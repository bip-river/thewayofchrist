for the saints according to the will of God."]]}, "Titus 2:3–5": {"c": "2", "items": [["3", "The aged women likewise, that they be in behaviour as becometh holiness, not false accusers, not given to much wine, teachers of good things;"], ["4", "That they may teach the young women to be sober, to love their husbands, to love their children,"], ["5", "To be discreet, chaste, keepers at home, good, obedient to their own husbands, that the word of God be not blasphemed."]]}, "Titus 3:10": {"c": "3", "items": [["10", "A man that is an heretick after the first and second admonition reject;"]]}, "Titus 3:4–7": {"c": "3", "items": [["4", "But after that the kindness and love of God our Saviour toward man appeared,"], ["5", "Not by works of righteousness which we have done, but according to his mercy he saved us, by the washing of regeneration, and renewing of the Holy Ghost;"], ["6", "Which he shed on us abundantly through Jesus Christ our Saviour;"], ["7", "That being justified by his grace, we should be made heirs according to the hope of eternal life."]]}, "Titus 3:5": {"c": "3", "items": [["5", "Not by works of righteousness which we have done, but according to his mercy he saved us, by the washing of regeneration, and renewing of the Holy Ghost;"]]}, "Titus 3:5–6": {"c": "3", "items": [["5", "Not by works of righteousness which we have done, but according to his mercy he saved us, by the washing of regeneration, and renewing of the Holy Ghost;"], ["6", "Which he shed on us abundantly through Jesus Christ our Saviour;"]]}};

const FAITH = {
  name: "The Way of Christ",
  descriptor: "a plain, Anabaptist rule of life",
  epigraph: {
    text: "Ask for the old paths, where is the good way, and walk therein, and ye shall find rest for your souls.",
    ref: "\u2014 Jeremiah 6:16"
  },
  preface: {
    id:"preface", front:true, no:"", name:"Preface",
    tag:"what this is, and where it comes from",
    content:[
      {type:"p",text:"This work was not invented. It was received, and set down."},
      {type:"p",text:"Five hundred years ago, in the years after the great Reformation, there were those who held that the Reformers had not gone far enough — that to follow Christ was not to be born into a church and kept by the sword of the state, but to be joined to him by faith, baptized upon one's own confession, and gathered out of the world into a company that lived by his teaching and his cross. They would not swear, nor kill, nor lord it over one another. For this they were hunted, drowned, and burned, by Catholic and Protestant alike; and still the stream ran on, plain and yielded, down five centuries to our own day."},
      {type:"refs",text:"see \u201c[[together|Of the gathering of a company]],\u201d Part VII"},
      {type:"p",text:"We did not begin that stream. We are late to it, and small. This work is only what came of one household, in this present age of noise and haste and endless choosing, asking for the old paths — wishing to follow Christ without dividing life into the holy hour and the worldly week, and to raise children under his Lordship, set apart and unashamed. Finding much of the old way scattered or half-kept, we set it down again, whole, as a rule we ourselves could live by."},
      {type:"p",text:"So this is no new gospel, and those who wrote it claim no vision and no authority of their own. What is faithful in it is borrowed — from the Scriptures first, and from those older witnesses who paid for it. What is unfaithful is ours, and we ask that it be corrected by the Word and by the church that gathers around it."},
      {type:"refs",text:"Jeremiah 6:16  ·  1 Corinthians 3:11  ·  Jude 1:3"},
      {type:"p",text:"It is written plainly, and left open. Whoever is drawn by it did not come by our persuading; he was called by the same Lord who called us. Let him read, and prove it against the Scriptures, and if it is true, walk in it."},
      {type:"refs",text:"1 Thessalonians 5:21  ·  John 6:44"}
    ]
  },
  parts: [
    { id:"foundations", no:"i",   name:"Foundations",
      tag:"why this exists, and where a newcomer begins",
      content:[
        {type:"p",text:"This is a rule of life — a way of following Christ, ordered and shared. It is not a new gospel but an old obedience: to live simply, plainly, and together, under the Scriptures and the Lordship of Jesus."},
        {type:"p",text:"It stands in the Anabaptist stream of the church — the free company of believers, baptized upon their own confession, refusing the sword and the oath, plain and yielded, gathered out of the world. We draw upon that tradition and its witnesses without being bound to any body that now bears its name; we take from it what is faithful to Christ, and answer to him alone."},
        {type:"h",text:"What it is for"},
        {type:"p",text:"This way exists so that a people might live the whole of life as disciples — not faith kept for an hour and the world kept for the rest, but one undivided life, disciplined and simple, shared and carried together. We are gathered to be a people: distinct not by ambition but by belonging, set apart to God and joined to one another."},
        {type:"refs",text:"Acts 2:42–47  ·  Galatians 6:2  ·  1 Peter 2:9"},
        {type:"p",text:"What one keeps alone is habit; what a people keep together is a way. The discipline is not the point — the point is a life freed from the world's clamor and given over to God and to neighbor."},
        {type:"p",text:"We do not hold goods in common by compulsion; what is a member's remains his own. Yet it is held with an open hand, freely shared as any has need, so that none among us is left in want. The bond between us is not shared ownership but shared burden."},
        {type:"refs",text:"2 Corinthians 8:13–15  ·  Acts 2:44–45  ·  1 John 3:17"},
        {type:"h",text:"The heart of it"},
        {type:"p",text:"The disposition at the center of this way is plainness: simplicity in how we live, dress, speak, and want. Plainness is first inward — a heart unadorned and content — and only then outward. We are not conformed to the world's fashions or its appetites, that our lives might bear a quieter witness."},
        {type:"refs",text:"Romans 12:2  ·  1 Peter 3:3–4  ·  Matthew 6:19–21  ·  1 Timothy 2:9–10"},
        {type:"p",text:"Plainness is not poverty for its own sake, nor a rule of mere appearances. It is the freedom of wanting little, so that what we have and who we are may be freely given away."},
        {type:"h",text:"Set apart from the world"},
        {type:"p",text:"Because we are not our own but Christ's, we are not conformed to the world. We are a people visibly set apart — known, if known at all, as belonging to another Kingdom. This apartness is not a costume worn over an ordinary heart; it is the outward shape of an inward plainness, and where the heart is not first yielded, the outward sign is empty."},
        {type:"refs",text:"Romans 12:2  ·  2 Corinthians 6:14–17  ·  John 17:14–16"},
        {type:"p",text:"We are set apart in obedience, not in strategy. We do not stand apart to be seen by the world, nor to flee it, but because Christ has called his own to a narrow way; the guarding of the community is the fruit of that obedience, not its aim. Nor do we despise those outside — Christ prayed not that his own be taken out of the world, but kept from its evil."},
        {type:"refs",text:"John 17:15  ·  Matthew 7:13–14  ·  1 Peter 2:11"},
        {type:"p",text:"This separation takes visible form: in plain dress, that the body not be adorned to the world's eye; in a guarded use of tools and media, that the world's noise not master us; in the stance we take toward the powers of the state — its oaths, its offices, its sword; and in the raising and teaching of our children in the way. In each, the standard is set by the gathered church, and each is held as a sign of the heart, never as the heart itself. The particulars belong to the Rule of Life."},
        {type:"refs",text:"1 Peter 3:3–4  ·  Matthew 5:33–37  ·  Deuteronomy 6:6–7"},
        {type:"h",text:"How we hold Scripture"},
        {type:"p",text:"The Scriptures are our final authority — sufficient, and standing over every human opinion. Yet Scripture is not read flat, nor read alone. It is read toward Christ: his life and teaching are the key that unlocks the whole, and where the plain word of Jesus speaks, it governs all the rest."},
        {type:"refs",text:"2 Timothy 3:16–17  ·  Hebrews 1:1–2  ·  John 13:15  ·  1 Peter 2:21"},
        {type:"p",text:"His hardest commands — resist not evil, swear not at all — we hold as the true and binding ideal of the heart, to be pursued without reserve; not as a bare law that mere outward compliance could satisfy, and not as counsel we are free to lay aside. Where grave necessity seems to compel a departure from them, none excuses himself: the gathered church discerns the case, and the departure is confessed as a falling-short, never claimed as a right."},
        {type:"refs",text:"Matthew 5:17–20  ·  Matthew 5:48  ·  James 5:12"},
        {type:"p",text:"And it is read together, not privately. No one of us is the lone interpreter; the gathered people discern the meaning of the Word as one body, weighing and consenting together. What binds us is not each reading his own way, but the shared mind of the church under Christ."},
        {type:"refs",text:"2 Peter 1:20  ·  Matthew 18:15–20  ·  Acts 15  ·  1 Corinthians 14:29"},
        {type:"h",text:"Of what may change, and what may not"},
        {type:"p",text:"Not all that we hold is held in the same way, and much strife is spared a people when they learn to tell the difference. There are three sorts of things among us, and each is kept differently."},
        {type:"p",text:"First is the gospel itself, and the faith confessed in these articles: that salvation is by grace, through faith in Christ crucified and risen; that the Scriptures are the Word of God; and all that our confession sets down. This is the ground, and it does not change — not with the age, not with our own wishes, not ever. Here we are wholly one, and here we stand with every soul in every age who has truly called upon Christ."},
        {type:"refs",text:"Jude 1:3  ·  Galatians 1:8–9  ·  1 Corinthians 3:11"},
        {type:"p",text:"Second are the convictions of this way: peace and the refusal of the sword, plainness, separation from the world, baptism upon confession, the shared and yielded life, and the ordinances Christ gave. These are the shape of our covenant together — the form of obedience we believe Christ asks of us — and we hold them firmly, and do not lay them down at the world's urging or our own weariness. Yet we do not make them the measure of another's salvation; we hold them as our own calling in fear, never as a boast, and we unchurch no one whom Christ has received who has not seen as we see."},
        {type:"refs",text:"John 14:15  ·  Romans 14:4–5  ·  Philippians 3:15–16"},
        {type:"p",text:"Third are the forms and the customs: the particular cut of our dress, the fashion of the covering, the bounds we set on tool and media, the ordering of our schools and our feast-days. These are the garments of the convictions, and not the convictions themselves; they serve their purpose in their time, and may be altered by the gathered church as wisdom and the age require. Of these we make no test of fellowship, and no measure of a soul. He that keeps a custom and he that must vary it are brethren still, and neither is to despise or to judge the other."},
        {type:"refs",text:"Romans 14:1–4  ·  Colossians 2:16–17  ·  Mark 7:8–9"},
        {type:"p",text:"So we would guard against the two deaths of a people: the slow death, in which the ground itself is given up little by little, until nothing is left but a name; and the sudden death, in which the body is torn apart over a bonnet or a boundary that was never the gospel at all. Against the first we hold fast and yield nothing; against the second we bear with one another in love. In the gospel, unity; in our convictions, faithfulness; in all customs, forbearance; and in all things, charity."},
        {type:"refs",text:"Ephesians 4:1–3  ·  2 Thessalonians 2:15  ·  Colossians 3:14"},
        {type:"h",text:"Of honest questions and doubt"},
        {type:"p",text:"A question is never a sin, and doubt is not the enemy of faith but is often the road to it. We do not fear the hard question, nor shame the one who asks it, nor count the doubter a rebel. The Scriptures themselves are full of honest wrestling: Job cried out against heaven and was not rebuked, but was vindicated over the friends who defended God with easy answers; Thomas would not believe till he had seen, and Christ did not cast him out, but showed him his hands; and the man who prayed, Lord, I believe, help thou mine unbelief, was heard. Israel itself is named for one who wrestled with God and would not let go."},
        {type:"refs",text:"Job 42:7  ·  John 20:27–28  ·  Mark 9:24  ·  Genesis 32:28"},
        {type:"p",text:"So we would rather a soul doubt honestly among us than believe falsely, or feign a peace he does not have. We search the Scriptures to see whether these things be so, and we prove all things, holding fast that which is good; and we stand ready, as we are able, to give a reason for the hope that is in us. Where we have answers, we give them plainly and without anger; where we have none, we say so, for there are deep things that we ourselves hold in trust and do not fully understand. A faith that cannot bear a question is a faith unsure of its ground; ours, we believe, can bear them all."},
        {type:"refs",text:"Acts 17:11  ·  1 Thessalonians 5:21  ·  1 Peter 3:15"},
        {type:"p",text:"This welcome we guard for the honest seeker especially, and we do not let it be turned into a rod against him. The trouble is never the hard question, but the settled and scornful heart — the one who asks not to find but only to tear, who will hear no answer, and sows division for its own sake. Even him we bear with in patience, and admonish as a brother; yet we will not let the peace of the church be broken by strife that seeks no truth. To question is the seeker's right; to divide is another matter. But the burden falls first upon us who would answer: to hear before we speak, to love the one who asks, and never to mistake our own discomfort for his sin."},
        {type:"refs",text:"Titus 3:10  ·  James 1:19  ·  2 Timothy 2:24–25"},
        {type:"h",text:"Of holiness without shame"},
        {type:"p",text:"We are a people who take sin seriously, and we would not soften it; yet we have seen how the fear of sin can curdle into a poison of its own. There is a sorrow that is of God, which turns a soul toward Christ and mends it; and there is a sorrow of the world, which only crushes, and drives to hiding and to despair. The first we welcome; the second we labor to heal. For to them that are in Christ there is no condemnation, and we will not lay upon a soul a burden the Lord himself has lifted."},
        {type:"refs",text:"2 Corinthians 7:9–10  ·  Romans 8:1  ·  Psalm 34:18"},
        {type:"p",text:"So among us confession is for healing, and not for exposure: a man opens his sin to be restored, not to be shamed before the eyes of the curious. We would have our people convicted, but not crushed; repentant, but not despairing; and we are tender with the scrupulous conscience, that accuses itself where God does not. Our holiness is not a spotlessness we achieve and parade, but a gift we receive, daily, from the hand of Christ; and no man among us may take another's fall and make of it a rod, or a rank, or a tale to tell. He that is forgiven much is not thereby made least, but loves the most."},
        {type:"refs",text:"Galatians 6:1  ·  James 5:16  ·  Luke 7:47"},
        {type:"p",text:"And because this fear fastens most cruelly upon the body, we say plainly: the body is God's good work, and not a thing of shame. Our modesty is the humility of the whole people, of the men no less than the women, and it is not a burden laid upon our daughters to bear for the eyes of others; no girl among us is taught to carry shame for another's desire. We clothe ourselves plainly for the love of God and the quiet of the heart — never to hide a shame that is not there, nor to make an enemy of the body. What God hath called good, we will not call unclean."},
        {type:"refs",text:"Genesis 1:31  ·  Psalm 139:14  ·  1 Corinthians 12:23–24"},
        {type:"h",text:"Of love, and not fear"},
        {type:"p",text:"We would have it plainly known why we obey, and hold together, and walk this narrow way: it is for love, and not for fear. We are not driven, but drawn — by the mercy of God in Christ, who loved us first. The dread of punishment may govern a slave, but it cannot make a son; and perfect love casteth out fear. Where a people is ruled by fear — fear of hell held over the head, fear of the shunning, fear of the frown of men — there the gospel has been turned upside down, and we will not have it so among us."},
        {type:"refs",text:"1 John 4:18–19  ·  Romans 8:15  ·  2 Timothy 1:7"},
        {type:"p",text:"There is a fear that is good, and we keep it: the reverence of a child before a Father greatly loved, which the Scripture calls the beginning of wisdom. But this is far from the terror we renounce. We teach our children, and one another, to flee sin because it grieves the God who loves us, and wounds the neighbor, and mars the soul — and not merely because punishment waits. And though we hold, with the Scriptures, that a living faith may yet be lost, we do not turn this warning into a whip. It is spoken as a gardener speaks, who bids you tend a living thing — not as a jailer who threatens; for we are kept by the power of God, and the same love that warns us also holds us."},
        {type:"refs",text:"Proverbs 9:10  ·  1 John 4:10  ·  1 Peter 1:5"},
        {type:"h",text:"Toward the state and the sword"},
        {type:"p",text:"We honor the governing powers as ordained of God for the order of the world; we obey the laws, pay what is owed, and pray for those who rule. Yet our first allegiance is to Christ and his Kingdom, and where the two are set against each other, we obey God rather than men."},
        {type:"refs",text:"Romans 13:1–7  ·  1 Timothy 2:1–2  ·  Acts 5:29"},
        {type:"p",text:"These leanings are not all of one weight; each is measured by how nearly it touches the sword and the world's power."},
        {type:"p",text:"Of voting and the seeking of place in the world's contests we are wary, for they entangle the brethren in the strife of parties and the pursuit of power, which is not our calling. Yet this is a caution, not a bar: a member may, in his own conscience before God, cast a vote upon a plain matter of right and wrong, without the leave of the church. But the pursuit of power we lay down."},
        {type:"refs",text:"Matthew 20:25–28  ·  John 18:36"},
        {type:"p",text:"And what we withhold from the parties, we withhold no less from the nations. The church is the chaplain of no party and of no country: she does not bless its banners, nor baptize its causes, nor hang its flag in the place where Christ alone is Lord. We love the land we dwell in, and seek its peace, and pray for it; but we will not confuse it with the Kingdom, nor render unto Caesar the devotion that belongs to God. Our commonwealth is in heaven; and among every earthly people we are sojourners and strangers, our true citizenship held elsewhere."},
        {type:"refs",text:"Philippians 3:20  ·  1 Peter 2:11  ·  Matthew 22:21"},
        {type:"p",text:"So we do not let the church be captured — neither driven into the world's quarrels as a soldier for one side, nor made the ornament of any ruler or movement. When a power takes up the name of Christ to gather men to itself, we are not deceived by it; for our Lord himself, when they would have taken him by force to make him a king, would not have it, but withdrew. Our hope is not in princes, nor in the arm of man: some trust in chariots, and some in horses, but we will remember the name of the Lord our God."},
        {type:"refs",text:"John 6:15  ·  Psalm 146:3  ·  Psalm 20:7"},
        {type:"p",text:"The oath we do not swear. Our yes is yes and our no is no; we will not set some words above our ordinary truthfulness, nor call God to witness what our plain word should already bear. Where the law requires it, we affirm rather than swear — and because affirmation is nearly always allowed, this costs us little, and so we hold it firmly."},
        {type:"refs",text:"Matthew 5:33–37  ·  James 5:12"},
        {type:"p",text:"Public office we weigh by the sword. The office that wields force — that judges, imprisons, or commands the sword — we do not take, for it would require of us what Christ forbids. But office that serves without force — the ordering of a school, the keeping of records, the care of a road — a member may bear, and bear gladly, as love of neighbor. The test is single: does the office compel what Christ forbids?"},
        {type:"refs",text:"Romans 13:3–4  ·  Matthew 20:25–28"},
        {type:"p",text:"The sword is the gravest of all, and here we do not deal in leanings but in a wall. The sword — as vengeance, as the trade of the soldier, as the saving of our own life by the shedding of another's — we lay down altogether. We do not kill, and by grace we would die before we killed; for they that take the sword shall perish by the sword, and the servants of a kingdom not of this world do not fight."},
        {type:"refs",text:"Matthew 26:52  ·  John 18:36  ·  Matthew 5:38–39"},
        {type:"p",text:"Yet this is no leave to abandon the weak, and the wall does not fence us from love. What is laid down is the shedding of man's blood in vengeance and war — not the shepherd's care. Against the beast, the fire, the flood, and the wasting sickness we labor with all our strength to save; and when the wolf is a man, we do not stand and watch the innocent perish. We put ourselves between the strong and the weak; we shield, we restrain, we bear the blow, we do all that love and strength can do to deliver the helpless out of the hand of the wicked. The shepherd who flees and leaves the flock is no shepherd, but a hireling."},
        {type:"refs",text:"Psalm 82:3–4  ·  Proverbs 24:11–12  ·  John 10:11–12"},
        {type:"p",text:"What we will not do, even there, is take the life of the aggressor. Where the innocent cannot be saved but by killing, we give our own life rather than his, and commit the rest into the hands of God — as our forebears did, who turned back to draw from the ice the very man who hunted them to death. For the aggressor also is a soul for whom Christ died; and we may lay down our own life, but we may not purchase it, nor even another's, with a brother-man's blood."},
        {type:"refs",text:"John 15:13  ·  Romans 12:19–21  ·  1 Peter 2:21–23"},
        {type:"p",text:"And if a man in that dark moment cannot rise to this — if, to save his child, he strikes the attacker down — we do not name it his right, nor a deed to be praised; we name it, with all the hardest commands of Christ, a falling-short. But neither do we cast him out. We grieve with him, and restore him, and bear him up, as we bear every one who stumbles under a weight almost too great to carry."},
        {type:"refs",text:"Galatians 6:1–2"},
        {type:"p",text:"Aggression, the wars of the nations, and the taking of life for the state, we refuse wholly and without exception. We keep this hard word not because the wolf is unreal, but because we follow the Lamb — and because we wait for, and point toward, the day he has promised, when the wolf shall dwell with the lamb, and they shall not hurt nor destroy in all his holy mountain."},
        {type:"refs",text:"Isaiah 2:4  ·  Isaiah 11:6–9  ·  Matthew 5:9"},
        {type:"h",text:"Of other believers"},
        {type:"p",text:"We do not imagine that we are the whole of Christ's church, nor the only door to him. Wherever there is true faith in Christ and a heart turned to follow him, there is a brother and a sister — though they have never heard of this way. We keep our own table and our own shared life, for these belong to a covenant we have made together; but this is no verdict upon another's soul, and we unchurch no one whom Christ has received."},
        {type:"refs",text:"John 10:16  ·  Romans 14:4  ·  Mark 9:38–40"},
        {type:"p",text:"And yet we hold this way in earnest, as our own calling to a fuller and plainer obedience — believed in fear, not in pride. We do not measure other believers by it, nor count ourselves above them: to his own Master each servant stands or falls. We keep what we have been given, and leave the judging to God."},
        {type:"refs",text:"Romans 14:10–12  ·  Philippians 3:15–16  ·  Luke 18:11–14"},
        {type:"h",text:"Where to begin"},
        {type:"p",text:"This way is not hidden, nor is it pressed upon any; whoever is drawn may simply begin. The beginning asks no community and no leave: read the Scriptures, lay down what the world has piled on, take up the plain obedience of Christ and the daily rhythm of prayer, and give yourself inwardly to this way before God. This much one may do alone, today."},
        {type:"refs",text:"James 1:22  ·  Luke 9:23  ·  Philippians 3:13–14"},
        {type:"p",text:"But this life was never meant to be kept alone, and it is not complete in one. In time the walk seeks a people — to be baptized, to break bread, to be taught and borne and held. Where a company of this way is found, one joins it; where none is found, one gathers others, or waits and prays until Christ provides them. The fullness — baptism, the table, the shared life — awaits a people; the beginning does not."},
        {type:"refs",text:"Hebrews 10:24–25  ·  Ecclesiastes 4:9–12  ·  Matthew 18:20"}
      ],
      whatgoeshere:["The purpose \u2014 what this way is for",
                    "Its origin and the need it answers",
                    "How someone who finds it can begin"] },
    { id:"confession", no:"ii",   name:"The Confession",
      tag:"what is believed, grounded in the Bible",
      content:[
        {type:"p",text:"This is what we believe, held plainly and together. It is not the ground of our salvation, which is Christ, but the shared confession of a people who follow him."},
        {type:"h",text:"I.  God"},
        {type:"p",text:"We believe in one God, eternal and unchanging, who is Father, Son, and Holy Spirit — three persons in one Being, maker of heaven and earth and of all things seen and unseen. To him alone belong our worship and our whole allegiance."},
        {type:"refs",text:"Deuteronomy 6:4  ·  Matthew 28:19  ·  Genesis 1:1"},
        {type:"h",text:"II.  Jesus Christ"},
        {type:"p",text:"We believe in Jesus Christ, the eternal Son, true God and true man: conceived of the Holy Spirit, born of Mary, who lived without sin, taught the way of the Kingdom, was crucified for our sins, rose bodily from the dead, ascended to the Father, and shall come again to judge the living and the dead. He is both our Savior and our pattern: we are saved by him, and we follow him."},
        {type:"refs",text:"John 1:1,14  ·  1 Corinthians 15:3–4  ·  1 Peter 2:21"},
        {type:"h",text:"III.  The Holy Spirit"},
        {type:"p",text:"We believe in the Holy Spirit, God with us and within us, who convicts of sin, gives the new birth, dwells in the believer and the church, and leads the gathered people into the truth of the Word. The life we are called to is beyond our own strength; it is his work in us."},
        {type:"refs",text:"John 16:8,13  ·  Titus 3:5  ·  Galatians 5:22–25"},
        {type:"h",text:"IV.  The Scriptures"},
        {type:"p",text:"We believe the Scriptures to be the Word of God, our final authority, sufficient for faith and life. They are read toward Christ, in whom they find their center, and discerned together by the gathered church, never bent to each one's private will."},
        {type:"refs",text:"2 Timothy 3:16–17  ·  2 Peter 1:20–21"},
        {type:"h",text:"V.  Man and sin"},
        {type:"p",text:"We believe man was made in God's image and for his fellowship, and made good; but that turning from God he fell into sin, and all have sinned and come short of the glory of God. Of ourselves we cannot mend what sin has broken; we stand in need of grace."},
        {type:"refs",text:"Genesis 1:27  ·  Romans 3:23  ·  Romans 5:12"},
        {type:"h",text:"VI.  Salvation"},
        {type:"p",text:"We believe salvation is the gift of God, by his grace, received through faith in Christ, and never earned by any work or merit of our own. This is the sole ground of our standing before God: the rule of our life is never the price of it, and our assurance rests upon Christ, not upon our own record."},
        {type:"refs",text:"Ephesians 2:8–9  ·  Titus 3:5  ·  Romans 5:1"},
        {type:"p",text:"Yet the faith that saves is a living faith, which always follows Christ; a faith that will not follow him is dead, and saves no one. So grace is never cheap, and the whole obedient life is the shape of true faith — its fruit and its evidence, never its purchase."},
        {type:"refs",text:"James 2:17,26  ·  Ephesians 2:10  ·  John 14:15"},
        {type:"p",text:"This assurance is real, and may be known: the one who trusts Christ and walks in him need not live in doubt of his standing, for it rests not upon the strength of his own faith but upon the finished work of the Lord. Yet it is held humbly, in godly fear, and never turned into presumption; for the same Scripture that comforts the trusting warns the careless — let him that thinketh he standeth take heed lest he fall."},
        {type:"refs",text:"1 John 5:13  ·  Romans 8:16  ·  1 Corinthians 10:12"},
        {type:"p",text:"For it is possible to fall away — not by the daily stumbling of a heart that grieves its sin and returns, for such a one is met by the blood of Christ, and lifted, and forgiven seventy times seven, but by the settled turning-away: the deliberate abandoning of Christ and his way, the return to the world with no repentance. The faith that saves is a living faith, and a living thing may die. Therefore we neither despair at every fault nor presume upon grace, but abide in Christ, and hold fast, and help one another to the end — assured, yet watchful; at rest, yet not asleep."},
        {type:"refs",text:"Hebrews 10:26–29  ·  John 15:5–6  ·  Hebrews 6:11–12  ·  Matthew 18:21–22"},
        {type:"h",text:"VII.  The Church"},
        {type:"p",text:"We believe the church is the body of Christ: not a nation nor a building, but a people gathered out of the world by grace and joined to one another in a voluntary, committed fellowship. None is born into it or bound by birth; each enters by his own confession and yielding, and is kept within it by a shared life under Christ. To it Christ has given a ministry — to serve, teach, and shepherd — chosen from among the people, and a discipline exercised in love, whose aim is never punishment but restoration; the form of this order is set forth in [[together|Life Together]]."},
        {type:"refs",text:"1 Corinthians 12:12–13  ·  1 Peter 2:9–10  ·  Ephesians 4:11–13  ·  Matthew 18:15–17"},
        {type:"h",text:"VIII.  Baptism"},
        {type:"p",text:"We believe baptism is for those who, hearing the gospel, repent and confess faith in Christ of their own will — and for these alone. We do not baptize infants, who cannot yet believe; baptism is the sign of a faith already received and a life now given over to Christ and his people, a burial of the old life and a rising to the new."},
        {type:"refs",text:"Acts 2:38  ·  Acts 8:36–37  ·  Romans 6:3–4"},
        {type:"h",text:"IX.  The Lord's Supper"},
        {type:"p",text:"We believe the Lord's Supper is the holy remembrance of Christ's body broken and his blood shed for us, kept in thanksgiving until he comes. In the sharing of the one bread we are shown to be one body; and we come to the table having first made peace with God and with one another."},
        {type:"refs",text:"1 Corinthians 11:23–26  ·  1 Corinthians 10:16–17"},
        {type:"h",text:"X.  The new life"},
        {type:"p",text:"We believe those who are Christ's are made new, and walk in holiness, love, and lowliness of heart. This new life bears the marks already named in this way: plainness, separation from the world, peace and nonresistance, truthfulness without oaths, and the bearing of one another's burdens. It is not conformity to the world, but conformity to Christ."},
        {type:"refs",text:"Romans 12:1–2  ·  Galatians 5:24–25  ·  1 John 2:6"},
        {type:"h",text:"XI.  Peace and the sword"},
        {type:"p",text:"We believe the way of Christ is the way of peace. We love our enemies, bless them that curse us, and overcome evil with good; we swear not at all, but let our yea be yea and our nay, nay. We defend the helpless with our own bodies and with all that love can do, yet we take no human life — not in vengeance, not to save our own, not for the state, nor in the wars of the nations. We follow the Lamb, who when he was reviled, reviled not again; and we wait for the Kingdom in which none shall hurt nor destroy."},
        {type:"refs",text:"Matthew 5:38–48  ·  Romans 12:17–21  ·  Matthew 26:52  ·  1 Peter 2:21–23  ·  Isaiah 11:6–9"},
        {type:"h",text:"XII.  The last things"},
        {type:"p",text:"We believe Christ will come again in glory; that the dead shall be raised; that all shall stand before God to be judged; and that there is a life everlasting with him for those who are his. In this hope we live — holding the things of this world lightly, and setting our hearts on the world to come."},
        {type:"refs",text:"1 Thessalonians 4:16–17  ·  2 Corinthians 5:10  ·  Revelation 21:3–4"}
      ],
      whatgoeshere:["The core beliefs, article by article",
                    "The scripture each rests on",
                    "What is held plainly vs. left open"] },
    { id:"scripture", no:"iii",   name:"Scripture",
      tag:"the Bible foundation, gathered by theme",
      content:[
        {type:"p",text:"These are the Scriptures we return to, gathered by theme, that a reader may find the ground on which this way stands. They are not the whole of the Word, but its load-bearing places for us. Read them slowly, and read them whole — the references are only doors."},
        {type:"h",text:"I.  The Word of God"},
        {type:"p",text:"The Scriptures are God's own Word, sufficient and final, read toward Christ and discerned together."},
        {type:"refs",text:"2 Timothy 3:16–17  ·  2 Peter 1:20–21  ·  Hebrews 1:1–2  ·  Isaiah 40:8  ·  John 17:17"},
        {type:"h",text:"II.  Christ our Lord and pattern"},
        {type:"p",text:"Jesus Christ, true God and true man, is both the one who saves us and the one we follow; his life is our example, and his teaching our rule."},
        {type:"refs",text:"John 1:1–14  ·  Philippians 2:5–11  ·  1 Peter 2:21–24  ·  John 13:15  ·  Matthew 5–7"},
        {type:"h",text:"III.  The new birth and the following life"},
        {type:"p",text:"We are saved by grace through faith, not by works; yet the faith that saves is a living faith, born anew and following Christ."},
        {type:"refs",text:"Ephesians 2:8–10  ·  John 3:3–7  ·  Titus 3:4–7  ·  James 2:14–26  ·  Luke 9:23"},
        {type:"h",text:"IV.  Plainness and the unadorned life"},
        {type:"p",text:"A heart content and unadorned, wanting little, laying up treasure not on earth but in heaven."},
        {type:"refs",text:"1 Timothy 6:6–10  ·  1 Peter 3:3–4  ·  1 Timothy 2:9–10  ·  Matthew 6:19–21  ·  Philippians 4:11–13"},
        {type:"h",text:"V.  Set apart from the world"},
        {type:"p",text:"Not conformed to the world nor loving it, but transformed — a people belonging to God."},
        {type:"refs",text:"Romans 12:1–2  ·  2 Corinthians 6:14–18  ·  1 John 2:15–17  ·  John 17:14–16  ·  1 Peter 2:9–11"},
        {type:"h",text:"VI.  Peace and the sword"},
        {type:"p",text:"The way of Christ is the way of peace: loving the enemy, refusing vengeance and the oath, defending the weak yet taking no life, and following the Lamb."},
        {type:"refs",text:"Matthew 5:38–48  ·  Romans 12:17–21  ·  Matthew 26:52  ·  James 5:12  ·  Isaiah 11:6–9"},
        {type:"h",text:"VII.  The church and life together"},
        {type:"p",text:"One body, entered by confession and baptism, bearing one another's burdens, keeping and restoring one another in love."},
        {type:"refs",text:"Acts 2:41–47  ·  1 Corinthians 12:12–27  ·  Matthew 18:15–20  ·  Galatians 6:1–2  ·  1 Peter 5:1–3"},
        {type:"h",text:"VIII.  The life to come"},
        {type:"p",text:"Holding this world lightly, we wait for Christ's return, the resurrection, and the rest that remains for the people of God."},
        {type:"refs",text:"1 Thessalonians 4:13–18  ·  2 Corinthians 5:1–10  ·  Revelation 21:1–7  ·  Hebrews 4:9–11  ·  1 Peter 1:3–5"}
      ],
      whatgoeshere:["Which texts anchor the way",
                    "Passages arranged by theme",
                    "How scripture is read and weighed"] },
    { id:"rule", no:"iv",         name:"The Rule of Life",
      tag:"the standing order, and the daily rhythm",
      content:[
        {type:"p",text:"The Rule of Life is the plain shape of our days — the standing order we keep and the rhythm we walk. It is not the ground of our hope, which is Christ alone, but the ordered form of a life yielded to him. What follows is set by the gathered church, held with an open and inward heart, and never mistaken for the faith itself."},
        {type:"h",text:"Of dress and appearance"},
        {type:"p",text:"We dress plainly, that the body not be adorned to the world's eye, nor one set above another. Ours is a recognizable plainness, not a uniform: a people known by their simplicity, though not made identical. The standard is set by the church and held as a sign of the heart — worn from an inward plainness, or else worn empty."},
        {type:"refs",text:"1 Timothy 2:9–10  ·  1 Peter 3:3–4  ·  Romans 12:2"},
        {type:"p",text:"We wear no ornament. No jewelry is kept — not even the wedding band, for the covenant is worn in the life and the heart, not upon the hand; no cosmetics, that paint over the face God gave; and no costly or showy array that turns dress into display or rank."},
        {type:"refs",text:"Genesis 35:2–4  ·  1 Peter 3:3–4"},
        {type:"p",text:"Our garments are of subdued color and simple cut, without the marks of fashion or the reach for notice. What we wear should pass unremarked for its plainness — drawing no eye, and making no boast."},
        {type:"p",text:"Men and women keep the plainness proper to each, not blurring the distinction God set between them. The woman covers her head, and wears the covering continually — not for the eyes of others, but as a sign before God, who may be sought in prayer at any hour. Her dress is modest and plain."},
        {type:"refs",text:"1 Corinthians 11:2–16  ·  Deuteronomy 22:5  ·  1 Thessalonians 5:17"},
        {type:"p",text:"The man likewise dresses plainly — no neckties, no showy or fashionable attire, nothing worn for display. No custom of the beard is required of him; that is left to conscience. His plainness is in the simplicity of all he wears, not in a single mark."},
        {type:"p",text:"In all of this the inward comes first. The plain garb without the plain heart is a whitened tomb; but where the heart is truly yielded, the plainness of dress is its quiet and fitting sign."},
        {type:"refs",text:"Matthew 23:25–28  ·  1 Samuel 16:7"},
        {type:"h",text:"Of tools and media"},
        {type:"p",text:"We do not ask of a tool whether it is old or new, but what it does to us. Every tool is weighed by the church, and by three questions together: does it serve the household and the congregation, or corrode them? how far does it bind us to the world and its noise? and is it needful, or only convenience and indulgence? A thing may be lawful and still not build us up, and we will not be mastered by any of it."},
        {type:"refs",text:"1 Corinthians 10:23  ·  1 Corinthians 6:12  ·  Romans 12:2"},
        {type:"p",text:"The tools that carry the world's voice into the home we bind closely. We keep no personal devices given over to endless connection; where the telephone and the internet are needed for work, for commerce, or for the care of one another, they are used plainly and in common — as servants, not companions. We keep no social media, which trades in vanity and comparison, and no screen kept for entertainment, that the world's images not fill our eyes and our hours."},
        {type:"refs",text:"Psalm 101:3  ·  1 John 2:15–16  ·  Philippians 4:8"},
        {type:"p",text:"The conveniences of the age we do not forbid, but neither do we hold them exempt; they are weighed by the same test, each for what it does. Most may be used with a clear conscience. But we watch with special care the tools that would loosen our need for one another, or quicken life past the pace of presence — for a thing may carry no voice of the world at all, and still scatter a people, if it lets us live ever farther apart and lean ever less upon each other. Such we do not ban, but weigh soberly, by what they do to our nearness and our common life. We keep our material life simple, and share what may be shared."},
        {type:"refs",text:"Ephesians 5:15–16  ·  Hebrews 13:5  ·  Galatians 6:2"},
        {type:"p",text:"In all this our fear is not of tools, but for the wholeness of the household and the church. A thing is judged by what it does to love, to presence, and to the quiet of the heart before God."},
        {type:"refs",text:"Proverbs 4:23  ·  1 Corinthians 10:31"},
        {type:"h",text:"Of the children and their schooling"},
        {type:"p",text:"Our children are the gift and the charge of the whole people, and they are raised in the way from their earliest years. The teaching of them belongs first to their parents, and to the church that surrounds them: the home is the first school, and the fear of the Lord its first lesson."},
        {type:"refs",text:"Deuteronomy 6:6–7  ·  Ephesians 6:4  ·  Proverbs 22:6"},
        {type:"p",text:"We keep our own schools, apart from the world's, that the young not be formed in its appetites and its ambitions. There the basics are taught well and thoroughly — to read, to write, to reckon — with the Scriptures and the way of Christ at the center, and cooperation valued above rivalry, character above attainment."},
        {type:"refs",text:"Proverbs 9:10  ·  2 Timothy 3:15"},
        {type:"p",text:"When the basics are gotten, learning turns to work: the trades, the household, the care of the land, and apprenticeship among the brethren, that each may take up a useful place. To send the young out into higher and worldly learning we decline — not from any contempt for knowledge, but because it tends to feed pride, and to draw them away toward the world before they are rooted in Christ. Of learning for those grown and grounded, we speak below."},
        {type:"refs",text:"1 Corinthians 8:1  ·  Colossians 2:8  ·  2 Thessalonians 3:10"},
        {type:"p",text:"We do not seek ignorance, but a heart formed for God and a life fitted to serve. Each child's gifts are honored within the calling of the people; and as our Lord himself grew, so we would have them grow — in wisdom, and in stature, and in favor with God and man."},
        {type:"refs",text:"Luke 2:52  ·  Micah 6:8"},
        {type:"h",text:"Of the life of the mind"},
        {type:"p",text:"We are not enemies of the mind, and ignorance is no virtue among us. God is to be loved with all the mind, as well as all the heart; and a people who cannot give a reason for what they believe are easily led astray, and easily ruled by any man bold enough to claim that he alone understands. So we hold it a duty, and not a danger, to know our faith deeply: to read the Scriptures diligently and think upon them, to hold the story of the church and of our own forebears, to reason honestly, and to be ready always to give an answer for the hope that is in us."},
        {type:"refs",text:"Mark 12:30  ·  1 Peter 3:15  ·  Acts 17:11"},
        {type:"p",text:"For the young we keep the bounds already set: they are grounded first in the faith and the basics, and not sent out to be formed by the world's learning before they are formed in Christ. But for those grown and grounded, we do not fear knowledge itself. A settled member may learn widely — the trades and their sciences, the tongues, the histories, the workings of the world he lives in — as it serves his calling, his household, or his understanding; weighing it, as we weigh every tool, by what it does to him. What feeds humility, and usefulness, and a deeper knowledge of God, we welcome; what feeds only pride, or draws the heart away to the world, we lay down. Knowledge puffeth up, but it need not; joined to love, it builds."},
        {type:"refs",text:"Proverbs 9:10  ·  1 Corinthians 8:1  ·  Philippians 4:8"},
        {type:"h",text:"Of remembrance"},
        {type:"p",text:"A people that forgets its story does not keep its faith; it keeps only its habits, until these too are let go. So we remember, on purpose and together. We tell our children whence we came: how in an evil time men and women were baptized upon their faith and were drowned, and burned, and beheaded for it; how they would not take the sword even to save their own lives; how one turned back upon the ice to save the man who hunted him, and so was taken. We keep the accounts of the martyrs in our homes, and read them; we sing the old and heavy hymns that carry their memory; and we do not let the price that was paid grow cheap by being forgotten."},
        {type:"refs",text:"Deuteronomy 6:6–7  ·  Psalm 78:4–7  ·  Hebrews 12:1"},
        {type:"p",text:"Yet we honor the fathers; we do not worship them. We keep their memory that we may hold what they held, and know why they held it — and this same knowing sets us free where they were not free. For he who remembers why a thing was done can tell whether the reason yet stands, and so can keep the heart of a custom though its form must change; while he who has forgotten can only cling to the husk, or cast it away, and knows not which he does. So memory serves a living faith, and not a dead hand: we are anchored by it in the things that cannot change, and steadied by it — not frozen — in the things that may. That we have always done so is a reason to understand a thing well, and never the last word for the keeping or the leaving of it."},
        {type:"refs",text:"Jeremiah 6:16  ·  Matthew 15:6  ·  1 Corinthians 11:2"},
        {type:"h",text:"Of the daily rhythm"},
        {type:"p",text:"The day is opened and closed with God. Morning and evening the household gathers — parents and children together — to read the Scriptures, to sing, and to pray; and at every meal we give thanks, receiving our bread as from his hand. Beyond this common worship each seeks God in secret, that the life of prayer be not the family's only, but the heart's own."},
        {type:"refs",text:"Deuteronomy 6:6–7  ·  Psalm 92:1–2  ·  Matthew 6:6"},
        {type:"p",text:"This rhythm is a gift, and not a yoke. We keep it as the cherished shape of our days, and hand it to our children as a treasure; yet it is made for the household, and not the household for it. Sickness, travel, and the plain weariness of life will break the pattern from time to time, and when they do, none is condemned, and nothing is lost that a return will not mend. What we guard is not an unbroken record but a living habit — the daily turning of the home toward God, taken up again and again, that faith be the air the household breathes and not a duty it discharges."},
        {type:"refs",text:"Matthew 11:28–30  ·  Mark 2:27  ·  Psalm 55:17"},
        {type:"h",text:"Of the Lord's Day"},
        {type:"p",text:"The first day of the week we keep holy, in memory of our Lord's rising. On it we lay aside our labor and our buying and selling, and give the day wholly to worship, to rest, to family, and to works of mercy. We do not make of it a burden of rules: the day was made for man, and not man for the day, and where love or true need calls, we answer freely, as our Lord himself did. It is a gift — a weekly release from the world's endless toil, and a foretaste of the rest that remains for the people of God."},
        {type:"refs",text:"Acts 20:7  ·  Mark 2:27–28  ·  Hebrews 4:9–10"},
        {type:"h",text:"Of work"},
        {type:"p",text:"Six days we labor, and count it good. Work is no curse to be escaped but a calling and a dignity — the tilling of the ground, the keeping of a trade, the ordering of a home — by which we earn our bread, serve our neighbor, and are kept from idleness and want. We work with our hands, quietly, that we may have to give to him that needeth, and owe no man anything but to love him."},
        {type:"refs",text:"Genesis 2:15  ·  1 Thessalonians 4:11–12  ·  Ephesians 4:28"},
        {type:"p",text:"So our time is ordered — given to God, to labor, and to rest, each in its measure — that our days be not swept along in the world's hurry, but kept at the pace of presence, and numbered unto wisdom."},
        {type:"refs",text:"Psalm 90:12  ·  Ecclesiastes 3:1"},
        {type:"h",text:"Of the land and the trades"},
        {type:"p",text:"We hold the land in honor, and count life upon it the good soil for this way. To keep a farm, or a garden and a few animals, is to labor together as a household, to stay put and rooted, and to depend upon God and the seasons rather than upon the world's markets — and so we seek the land where it can be had, and teach our children to love and to work it."},
        {type:"refs",text:"Genesis 2:15  ·  Psalm 104:14  ·  Proverbs 12:11"},
        {type:"p",text:"Yet the land is not always to be had, and we do not bind it as a law. The trades and honest handwork are honored no less — carpentry, building, the shop, the craft. What we ask of a man's work is not that it be tied to the soil, but that it keep the character the land teaches: that it be honest, and near home, and keep the family together, and not sweep him daily into the world's rhythms nor bind him to its masters. Work that keeps a man home and whole we bless, whatever its kind; work that scatters him we are slow to take up, though it pay well."},
        {type:"refs",text:"1 Thessalonians 4:11–12  ·  Ephesians 4:28  ·  2 Thessalonians 3:10–12"},
        {type:"h",text:"Of trade and wealth"},
        {type:"p",text:"We buy and sell with the world as we must, honestly and without deceit, giving a fair measure and a plain price. But we keep our trades household-sized, and do not reach after great enterprises, nor build businesses that must feed on the labor of many hired hands, nor enter the tangles of the world — its debts, its lawsuits, its endless growth — for the sake of gain. We seek a competence, enough for our household and to spare; we do not seek a fortune."},
        {type:"refs",text:"Proverbs 30:8–9  ·  1 Timothy 6:6–10  ·  Leviticus 19:35–36"},
        {type:"p",text:"If a man's honest labor prospers beyond his need, we do not fault his diligence, nor forbid him to prosper; but the increase is not his to heap up as an estate, nor to spend upon display. It is held with an open hand, and flows to the need of the brethren and the poor, [[foundations|as we have said]]. So the one who prospers becomes not a rich man among us, but a spring for the whole body."},
        {type:"refs",text:"Luke 12:16–21  ·  2 Corinthians 8:13–15  ·  1 Timothy 6:17–19"},
        {type:"p",text:"We are wary of debt, which binds a man to the lender and to the morrow, and we shun it where we can, owing no man anything but love. Among ourselves we lend without interest — for it is no gain to grow rich upon a brother's need — and the church is the first lender to its own, that none need go to the world's moneylenders in his want."},
        {type:"refs",text:"Romans 13:8  ·  Exodus 22:25  ·  Deuteronomy 23:19–20  ·  Luke 6:34–35"},
        {type:"h",text:"Of the world's help, and the church's"},
        {type:"p",text:"The world insures itself against every loss — with the company's policy, the state's welfare, the subsidy and the pension — that no man need depend upon his neighbor. We take another way. Where a people is truly gathered and able to bear it, we lay down the world's nets: we carry no commercial insurance, and lean not upon the state's provision, but pledge ourselves to one another. When fire or storm or sickness falls upon one, the brethren come — to rebuild the barn, to pay the reckoning, to take in the widow and the orphan — so that the church itself is our surety, and none among us is left to the world's mercy or his own."},
        {type:"refs",text:"Acts 4:34–35  ·  Galatians 6:2  ·  2 Corinthians 8:14"},
        {type:"p",text:"For if we knew the world would catch us, we would not catch one another, and the bond that makes us a people would slacken into a sentiment. To cut away the world's net is to make our need of each other real, and our love costly, and our care true."},
        {type:"refs",text:"1 John 3:17–18  ·  Acts 2:44–45"},
        {type:"p",text:"But this is the burden of a people, not of a seed. A household still walking alone, with no company yet to bear its losses, is not asked to leap into the void; let it use what prudence it must, in good conscience, while it seeks and builds the company that will one day make the world's net needless. The refusal is the end to which the whole life moves — the mark of a body that has become, in truth, each other's keeper."},
        {type:"refs",text:"Hebrews 10:24–25  ·  Ecclesiastes 4:9–10"},
        {type:"h",text:"Of hospitality and the stranger"},
        {type:"p",text:"Our door is open. The traveler, the poor, the stranger, and the one in trouble we take in, and feed, and shelter as we are able — not for the brethren only, but for whoever is sent to us; for in so doing some have entertained angels unawares, and what is done to the least of these is done to Christ. This is the plain duty of the people of God, and a chief mark of our life."},
        {type:"refs",text:"Hebrews 13:1–2  ·  Matthew 25:35–40  ·  Romans 12:13"},
        {type:"p",text:"We show this mercy for its own sake, and not to gather converts; we press our way upon no one, and keep no reckoning of souls. Yet the door we leave open is also the door by which the called may come. If one is drawn by what he finds among us, we do not turn him away — we teach him plainly, and let the Lord who drew him do his own work."},
        {type:"refs",text:"Luke 14:12–14  ·  1 Peter 4:9  ·  John 6:44"},
        {type:"h",text:"Of the household that walks alone"},
        {type:"p",text:"Not all who take up this way have a people near them. One may find it far from any company — at the first, when none yet exists, or in a place where none is gathered. To such a one, and to such a household, this is the rule that may be kept even now, alone."},
        {type:"p",text:"Keep the daily rhythm: morning and evening worship in the home, thanks at every meal, and prayer in secret. Keep the Lord's Day holy, laying down labor and commerce for worship and rest. Keep the plainness — in dress, in the covering, in what you own and want, in a guarded use of tools and of the world's media. Raise your children in the way. Mark the gospel feasts plainly, and fast when there is need. Work with your hands, bear your neighbor's burden, and give with an open hand. And commit yourself inwardly to Christ, and to this way, before God."},
        {type:"refs",text:"Joshua 24:15  ·  Deuteronomy 6:6–7  ·  Micah 6:8"},
        {type:"p",text:"But do not mistake this beginning for the whole. [[practices|Baptism, the Lord's Supper, the washing of feet]], [[together|the ministry]] and the shared discernment of the church — these await a people, and cannot be kept alone. So while you walk faithfully where you are, seek and pray for a company of this way, or for the two or three with whom one may begin; for the walk was made to become a people, and the lone household is a seed, not the tree."},
        {type:"refs",text:"Hebrews 10:24–25  ·  Matthew 18:20  ·  Psalm 68:6"}
      ],
