        {type:"refs",text:"Ephesians 5:15–16  ·  Hebrews 13:5  ·  Galatians 6:2"},
        {type:"h",text:"Of learning",short:"Learning"},
        {type:"p",text:"Our children are the gift and charge of the whole people. Their teaching belongs first to their parents and to the church: the home is the first school, and the fear of the Lord its first lesson."},
        {type:"refs",text:"Deuteronomy 6:6–7  ·  Ephesians 6:4  ·  Proverbs 22:6"},
        {type:"p",text:"We keep our own schools, apart from the world's, that the young not be formed in its appetites and ambitions. There they learn to read, to write, and to reckon, with the Scriptures at the center, cooperation valued above rivalry, and character above attainment. Then learning turns to work: the trades, the household, the land, and apprenticeship among the brethren."},
        {type:"refs",text:"Proverbs 9:10  ·  2 Timothy 3:15  ·  2 Thessalonians 3:10"},
        {type:"p",text:"We send none of our people, at any age, into the world's schools. For the young, such learning tends to feed pride and draw the heart toward the world before it is rooted in Christ; for the grown, we do not fear knowledge, but order it. Ignorance is no virtue among us: a people who cannot give a reason for what they believe are easily led astray, and easily ruled by any man who claims that he alone understands. So we hold it a duty to know our faith deeply and to reason honestly, and a man may learn deeply his trade and its sciences, the care of the land and the household, the Scriptures, and the story of the church and of our forebears — whatever serves his calling and his knowledge of God. Knowledge puffeth up; joined to love, it builds."},
        {type:"refs",text:"Colossians 2:8  ·  1 Corinthians 8:1  ·  Mark 12:30  ·  1 Peter 3:15"},
        {type:"h",text:"Of remembrance",short:"Remembrance"},
        {type:"p",text:"A people that forgets its story keeps only its habits, until these too are let go. So we tell our children whence we came: how men and women were baptized upon their faith and were drowned, burned, and beheaded for it; how they would not take the sword even to save their lives; how one turned back upon the ice to save the man who hunted him, and so was taken. We keep the accounts of the martyrs in our homes, and sing the old hymns that carry their memory."},
        {type:"refs",text:"Deuteronomy 6:6–7  ·  Psalm 78:4–7  ·  Hebrews 12:1"},
        {type:"p",text:"We honor the fathers; we do not worship them. We keep their memory that we may hold what they held, and know why they held it — for he who knows why a thing was done can keep its heart though its form must change, while he who has forgotten can only cling to the husk, or cast it away."},
        {type:"refs",text:"Jeremiah 6:16  ·  Matthew 15:6  ·  1 Corinthians 11:2"},
        {type:"h",text:"Of work and the land",short:"Work"},
        {type:"p",text:"Six days we labor, and count it good. Work is no curse to be escaped but a calling: by it we earn our bread, serve our neighbor, and have to give to him that needeth. We work with our hands, quietly, and are beholden to no man."},
        {type:"refs",text:"Genesis 2:15  ·  1 Thessalonians 4:11–12  ·  Ephesians 4:28"},
        {type:"p",text:"We hold the land in honor. To keep a farm, or a garden and a few animals, is to labor together as a household, to stay rooted, and to depend upon God and the seasons rather than the world's markets; so we seek the land where it can be had. Yet we do not bind it as a law, and the trades and honest handwork are honored no less. What we ask of a man's work is that it be honest and near home, that it keep the family together, and that it not bind him to the world's masters. Work that scatters him we are slow to take up, though it pay well."},
        {type:"refs",text:"Psalm 104:14  ·  Proverbs 12:11  ·  2 Thessalonians 3:10–12"},
        {type:"h",text:"Of goods, debt, and mutual aid",short:"Goods"},
        {type:"p",text:"What is a member's remains his own, held with an open hand and freely shared as any has need, so that none among us is left in want. We buy and sell honestly, with a fair measure and a plain price. We keep our trades household-sized, and do not enter the world's tangles — its debts, its lawsuits, its endless growth — for the sake of gain; we seek a competence, not a fortune. If a man's labor prospers beyond his need, the increase is not his to heap up or display, but flows to the brethren and the poor; so the one who prospers becomes a spring for the whole body."},
        {type:"refs",text:"Proverbs 30:8–9  ·  1 Timothy 6:6–10  ·  2 Corinthians 8:13–15  ·  1 Timothy 6:17–19"},
        {type:"p",text:"We shun debt where we can, owing no man anything but love. Among ourselves we lend without interest, and the church is the first lender to its own, that none need go to the world's moneylenders in his want."},
        {type:"refs",text:"Romans 13:8  ·  Exodus 22:25  ·  Luke 6:34–35"},
        {type:"p",text:"Where a people is truly gathered and able to bear it, we lay down the world's nets: we carry no commercial insurance and lean not upon the state's provision, but pledge ourselves to one another. When fire or sickness falls upon one, the brethren come — to rebuild the barn, to pay the reckoning, to take in the widow and the orphan — so that the church itself is our surety, and none is left to the world's mercy. For if we knew the world would catch us, we would not catch one another."},
        {type:"refs",text:"Acts 4:34–35  ·  Galatians 6:2  ·  1 John 3:17–18"},
        {type:"p",text:"This is the burden of a gathered people, not of a household still alone. Such a household uses what prudence it must, in good conscience, while it seeks the company that will one day make the world's net needless."},
        {type:"refs",text:"Hebrews 10:24–25  ·  Ecclesiastes 4:9–10"},
        {type:"h",text:"Of hospitality",short:"Hospitality"},
        {type:"p",text:"Our door is open. The traveler, the poor, the stranger, and the one in trouble we take in and feed as we are able, for what is done to the least of these is done to Christ. We show this mercy for its own sake, not to gather converts; but if one is drawn by what he finds among us, we teach him plainly, and let the Lord who drew him do his own work."},
        {type:"refs",text:"Hebrews 13:1–2  ·  Matthew 25:35–40  ·  Luke 14:12–14  ·  John 6:44"},
        {type:"h",text:"Of days and seasons",short:"Days"},
        {type:"p",text:"The day is opened and closed with God. Morning and evening the household gathers to read the Scriptures, to sing, and to pray, and at every meal we give thanks; beyond this, each seeks God in secret. The order of it is given in [[prayers|Prayers and the Order of Worship]]. This rhythm is a gift, and not a yoke: what we guard is not an unbroken record but a living habit, taken up again and again."},
        {type:"refs",text:"Deuteronomy 6:6–7  ·  Psalm 92:1–2  ·  Matthew 6:6"},
        {type:"p",text:"The first day of the week we keep holy, in memory of our Lord's rising. On it we lay aside our labor and our buying and selling, and give the day to worship, rest, family, and works of mercy — a foretaste of the rest that remains for the people of God."},
        {type:"refs",text:"Acts 20:7  ·  Mark 2:27–28  ·  Hebrews 4:9–10"},
        {type:"p",text:"Our year is measured by Christ, not by the world's holidays. We keep the great days of the gospel — his birth, his death, his rising, his ascension, and the coming of the Holy Spirit — in worship and thanksgiving, without the world's revelry, feasting, or commerce. Beyond these we bind no holy days upon the conscience; we keep no saints' days, and we do not follow the world into its festivals."},
        {type:"refs",text:"Luke 2:10–11  ·  1 Corinthians 15:3–4  ·  Acts 1:9–11  ·  Acts 2:1–4  ·  Romans 14:5–6"},
        {type:"p",text:"We fast, but not by a fixed rule of days. When the church has need — in seeking guidance, in repentance, in trouble, or before the Supper — a fast is appointed; and each may fast in secret as the Spirit leads, but never to be seen of men."},
        {type:"refs",text:"Matthew 6:16–18  ·  Matthew 9:15  ·  Acts 13:2–3"}
      ] },
    { id:"ordinances", no:"v", name:"Practices and Ordinances",
      tag:"the visible acts of the faith",
      content:[
        {type:"p",text:"These are the ordinances Christ gave his church, and the practices of the gathered life, kept plainly and in their season."},
        {type:"h",text:"Of baptism",short:"Baptism"},
        {type:"p",text:"None is baptized in haste. Before the water there is a season of teaching, in which the cost of this way is set plainly before the seeker, for he is not to promise what he has not counted. Then he is examined by the church: whether he believes, whether he repents, and whether he comes freely."},
        {type:"refs",text:"Luke 14:27–28  ·  Acts 8:30–38  ·  Matthew 28:19–20"},
        {type:"p",text:"The choice must be free, or it is nothing. We baptize none by pressure, nor by the expectation of kin; our own children are told plainly that they are free to decline, and that if they do, they are loved still, and remain among us."},
        {type:"refs",text:"Joshua 24:15  ·  Psalm 110:3  ·  1 Peter 3:21"},
        {type:"p",text:"At the water the candidate confesses his faith and vows before God and the church to follow Christ, to obey his teaching, and to walk with this people, open to their admonition as they to his. Then water is poured upon his head, in the name of the Father, and of the Son, and of the Holy Spirit — the sign of sins washed away and of the Spirit poured out — and he is received, a member among the members."},
        {type:"refs",text:"Romans 10:9–10  ·  Acts 2:38  ·  Romans 6:3–4"},
        {type:"h",text:"Of the Supper and the washing of feet",short:"Supper"},
        {type:"p",text:"Twice in the year we keep the Lord's Supper. It is preceded by a service of preparation, in which the church searches itself and makes peace, that none come to the table with a quarrel unhealed or a sin unconfessed. The table is shared by the members, at peace and in good standing, who thereby show themselves one bread and one body."},
        {type:"refs",text:"1 Corinthians 11:23–29  ·  Matthew 5:23–24  ·  1 Corinthians 10:17"},
        {type:"p",text:"With the Supper we wash one another's feet, as our Lord commanded. The greater stoops to the lesser, and all pride is laid down: among us there is no lord but Christ."},
        {type:"refs",text:"John 13:4–15  ·  1 Timothy 5:10"},
        {type:"h",text:"Of the holy kiss and the anointing",short:"Kiss & anointing"},
        {type:"p",text:"We greet one another with the holy kiss, brother to brother and sister to sister. When one among us is sick, the elders are called to pray over him and to anoint him with oil in the name of the Lord, committing him, in life or in death, into the hands of God."},
        {type:"refs",text:"Romans 16:16  ·  James 5:14–15"},
        {type:"h",text:"Of marriage",short:"Marriage"},
        {type:"p",text:"Marriage is a covenant before God between one man and one woman for the whole of life. A member marries within the faith, and weddings among us are plain and glad, kept within the church, without display."},
        {type:"refs",text:"Genesis 2:24  ·  Matthew 19:4–6  ·  2 Corinthians 6:14"},
        {type:"p",text:"What God has joined, man is not to put asunder; we do not divorce and marry again. Where one is in danger, separation for safety is always allowed, and the church stands with the wronged and the endangered; the door to reconciliation is kept, and remarriage is not sought while the other lives."},
        {type:"refs",text:"Mark 10:9  ·  1 Corinthians 7:10–11"},
        {type:"p",text:"In the household there is an order, and it is the order of the cross. The husband is head as Christ is head of the church: he lays himself down, and his headship is no right to rule, but a call to serve first and most. The wife yields to him in the same love, freely and never by compulsion, and each submits to the other in the fear of Christ."},
        {type:"refs",text:"Ephesians 5:21–33  ·  Philippians 2:3–8  ·  1 Peter 3:7"},
        {type:"h",text:"Of death and burial",short:"Death"},
        {type:"p",text:"We meet death in hope, for Christ is risen and death is swallowed up in victory. When one of us is dying, the church gathers to pray; when he is gone, we grieve truly, as those who wait for the resurrection."},
        {type:"refs",text:"1 Thessalonians 4:13–14  ·  1 Corinthians 15:54–57  ·  John 11:25–26"},
        {type:"p",text:"The body we return plainly to the earth: a simple coffin made by the brethren's hands, a grave dug by friends, a plain stone like every other, bearing the name and the years. The funeral is for the good of the living: no eulogy, but the Word preached, the resurrection set forth, and thanks given to the God who gave the life. Through the season of grief the whole church bears the family up, that none weep alone."},
        {type:"refs",text:"Genesis 3:19  ·  Job 1:21  ·  Romans 12:15"}
      ] },
    { id:"together", no:"vi", name:"Life Together",
      tag:"belonging, ministry, and restoration",
      content:[
        {type:"h",text:"Of membership, and of leaving",short:"Membership"},
        {type:"p",text:"None is a member of this people by birth, but only by his own confession and yielding. On repentance, faith, and baptism, a believer is received into the body and gives himself to its shared life — to be taught and admonished, to bear and be borne."},
        {type:"refs",text:"Acts 2:41–42  ·  Romans 12:4–5  ·  2 Corinthians 8:5"},
        {type:"p",text:"As no one is forced into this way, no one is held in it by force. A member who can no longer walk with us in conscience may go in peace, without our curse; he is not shunned, nor treated as an enemy. He remains one whom Christ may hold, though he has let go of us, and the door by which he came stays open for his return. For a faith that is not free is no faith at all."},
        {type:"refs",text:"John 6:66–67  ·  Philemon 1:14  ·  Luke 15:20"},
        {type:"p",text:"What is his own goes with him; we hold no man's property hostage to his staying. A debt to the church is dealt with as any honest debt between brethren — forgiven, or borne, or repaid in its season — but never wielded as a whip to hold him, nor called in as a punishment for his going. The mutual aid of the covenant is given while the life is shared, and he who leaves the life leaves its claim. But the one who has left is our neighbor still: if we find him in want, we help him as we would any man, and he is never cast below the reach of love."},
        {type:"refs",text:"Romans 13:8  ·  Galatians 6:10  ·  Luke 10:33–35"},
        {type:"h",text:"Of the ministry",short:"Ministry"},
        {type:"p",text:"Christ raises up from among the people servants for his church: a bishop, or elder, to oversee the flock and keep the ordinances; ministers to preach the Word; and deacons to tend the poor, the widow, and the sick, and to see that none is left in want. They serve, and do not lord; they are not hirelings, but brethren set apart to labor."},
        {type:"refs",text:"Ephesians 4:11–12  ·  1 Timothy 3:1–13  ·  1 Peter 5:2–3"},
        {type:"p",text:"These offices are not sought. The people name those they hold faithful, and from among the named the lot is cast, that no man choose himself and no one voice choose for the church. He whom the lot takes receives it from the Lord's hand, in fear and not in pride."},
        {type:"refs",text:"Acts 1:23–26  ·  Proverbs 16:33"},
        {type:"p",text:"Those who lead are shepherds under the Chief Shepherd, not above the Word nor above correction. Their teaching is received because it agrees with the Scriptures, not because they spoke it, and any member may search the Scriptures to see whether these things be so. The ministry holds no key that the whole church does not hold: it leads, the people consent, and over the conscience Christ alone is Lord."},
        {type:"refs",text:"1 Peter 5:2–4  ·  Acts 17:11  ·  2 Corinthians 1:24"},
        {type:"p",text:"To lead is the heavier charge, and the leader is held to the heavier account. A minister who errs is admonished as any brother; and if he teach falsely, or lord it over the flock, or fall into grave sin, he is not spared for his office, but corrected — and if he will not hear, put out of it. Even Peter was withstood to his face. This is done by due order, and not by faction nor the heat of a moment: upon the word of two or three witnesses, with patient admonition first, and the discernment of the church. So is the shepherd guarded from tyranny, and the flock from the tyranny of its own moods: we will suffer no lord over us, nor make the ministry the servant of every wind."},
        {type:"refs",text:"James 3:1  ·  1 Timothy 5:19–20  ·  Galatians 2:11"},
        {type:"h",text:"Of the brethren and the sisters",short:"Brethren & sisters"},
        {type:"p",text:"The offices of bishop, minister, and deacon the church commits to the brethren, holding to the order of Scripture signified among us in the covering: in the household and in the assembly the man is given to lead and to answer for it — not as a right to rule, but as the heavier yoke to bear. The greatest among us is the servant of all."},
        {type:"refs",text:"1 Timothy 2:11–12  ·  1 Timothy 3:1–13  ·  Matthew 20:26–27"},
        {type:"p",text:"The sisters are not thereby silent, nor without ministry. They pray in the assembly; the older women teach the younger; they instruct the children in the faith; and in works of mercy their labor is not beneath the deacon's, but beside it. The body has need of every member."},
        {type:"refs",text:"1 Corinthians 11:5  ·  Titus 2:3–5  ·  1 Corinthians 12:22–25"},
        {type:"h",text:"Of gathering a company",short:"Gathering"},
        {type:"p",text:"Where there is no company of this way, one may be gathered — not by a man setting himself up, but by believers joined under Christ and his Word. Where two or three are gathered in his name he is in their midst, and his church is truly present, needing no authority handed down from elsewhere. Such a company may in prayer raise up its first ministry by the lot, and baptize, and keep the ordinances, as the first Anabaptists did, who baptized one another with no authority but Christ and his Word."},
        {type:"refs",text:"Matthew 18:20  ·  Matthew 16:18–19  ·  Acts 14:23"},
        {type:"p",text:"Yet no company is a law to itself. It stands under the whole Word and this confession, and where other companies of the way exist, it keeps fellowship and counsel with them, giving and receiving admonition."},
        {type:"refs",text:"Acts 15:1–2,22  ·  Proverbs 11:14"},
        {type:"h",text:"Of admonition and restoration",short:"Admonition"},
        {type:"p",text:"When a brother sins, he is sought — first alone, then with one or two others, and only then before the church. The aim is never his shame but his return, and the whole matter is carried in love and in grief, never in anger."},
        {type:"refs",text:"Matthew 18:15–17  ·  Galatians 6:1  ·  James 5:19–20"},
        {type:"p",text:"Confession among us is for healing, not for exposure. There is a sorrow of God that turns a soul to Christ, and a sorrow of the world that only crushes; the first we welcome, and the second we labor to heal. We are tender with the scrupulous conscience, we lay upon no soul a burden the Lord has lifted, and no man may make of another's fall a rod, a rank, or a tale to tell. To them that are in Christ there is no condemnation, and he that is forgiven much loves the most."},
        {type:"refs",text:"2 Corinthians 7:9–10  ·  Romans 8:1  ·  James 5:16  ·  Luke 7:47"},
        {type:"p",text:"We are careful what we weigh. The details of our common life — the covering, the bounds on our tools, the manner of our dress — are taught and borne with in patience, and are never a ground for putting anyone out. Only grave and open sin clung to without repentance, or open defiance of the whole way one has vowed, comes to the gravest step."},
        {type:"refs",text:"1 Corinthians 5:11  ·  Romans 14:1,4  ·  Colossians 3:13"},
        {type:"p",text:"Then he is, in sorrow, put out — from the membership and from the table — that the body be kept whole and the weight of it call him home. He is held still within our love and welcome at our doors, greeted and prayed for, counted not an enemy but admonished as a brother. When he repents he is received again with joy, and the past is not held against him."},
        {type:"refs",text:"2 Thessalonians 3:14–15  ·  2 Corinthians 2:6–8  ·  Luke 15:20–24"},
        {type:"p",text:"Three things this discipline may never become. It is not the gate of salvation: a member's standing before God rests upon Christ alone, and one rightly put out is not thereby put out of God's hand. It is never a rod for conformity, to force agreement in disputable things or to bend a soul to the will of the strong. And it never cancels our care: the one under discipline is still fed and helped, never left destitute or alone. We withhold the table; we never withhold the bread."},
        {type:"refs",text:"Romans 14:4  ·  2 Corinthians 2:7  ·  Galatians 6:10"},
        {type:"h",text:"Of disagreement",short:"Disagreement"},
        {type:"p",text:"A living people will not always be of one mind. In matters of judgment — not the gospel, and not plain sin, but the many questions of how a people should walk — we seek the mind of Christ together and labor toward one accord, that we may say, It seemed good to the Holy Ghost, and to us. He who is overruled in a thing indifferent yields for the peace of the body; he may hold his view and speak it in its season, but he gathers no faction. The sin is never the honest difference, but the dividing."},
        {type:"refs",text:"Acts 15:22,28  ·  Philippians 2:2  ·  Ephesians 4:2–3"},
        {type:"p",text:"Those who prevail do not lord it over those who yielded, nor bind the conscience further than the matter requires. Parting is the last resort; and if part we must, we part as brethren, owing each other honor, and help, and the open door. Only a body that forsakes the gospel itself has left the faith, and even then we pronounce no man's soul lost, but grieve, and pray, and keep the door open."},
        {type:"refs",text:"Romans 15:1–2  ·  Galatians 1:8–9  ·  Romans 14:10–12"}
      ] },
    { id:"prayers", no:"vii", name:"Prayers and the Order of Worship",
      tag:"how we pray, and how we gather",
      content:[
        {type:"h",text:"Of prayer",short:"Prayer"},
        {type:"p",text:"Prayer is the breath of this life. We pray with set forms, that prayer be the common voice of the household and not the performance of the eloquent; with silence, that the forms be not mere words upon the lip; and freely, in our own words, as a child speaks to a father — humbly, and without show. The Lord's Prayer is the pattern of all our praying, and we use it daily."},
        {type:"refs",text:"Matthew 6:5–8  ·  Luke 11:1  ·  Romans 8:26–27"},
        {type:"verse",text:"Our Father which art in heaven, Hallowed be thy name. Thy kingdom come. Thy will be done in earth, as it is in heaven. Give us this day our daily bread. And forgive us our debts, as we forgive our debtors. And lead us not into temptation, but deliver us from evil: For thine is the kingdom, and the power, and the glory, for ever. Amen.",ref:"Matthew 6:9–13"},
        {type:"h",text:"Of the daily order",short:"Daily order"},
        {type:"p",text:"Morning and evening the household gathers. A portion of the Scriptures is read aloud; then all kneel, the Lord's Prayer is said, and the morning or evening prayer is offered, or another as the day requires, and a space of silence is kept. A hymn or psalm is sung, unaccompanied. At every meal thanks is given before and after, and the children are taught these prayers early."},
        {type:"refs",text:"Deuteronomy 6:6–7  ·  Psalm 55:17  ·  1 Timothy 4:4–5"},
        {type:"h",text:"Of the order on the Lord's Day",short:"Lord's Day"},
        {type:"p",text:"On the Lord's Day the company gathers in the homes in turn, one household opening its doors and then another, without display in the place of meeting. Worship is plain and unhurried: hymns and psalms sung in unison and unaccompanied; the reading of the Scriptures; the preaching of the Word by the ministers; prayer, said kneeling, with the Lord's Prayer and silence; and in their seasons, [[ordinances|the ordinances]]. We come not to be moved by music or eloquence, but to hear the Word, to pray, and to be knit together as one body."},
        {type:"refs",text:"Acts 2:46  ·  Colossians 3:16  ·  1 Corinthians 14:40"},
        {type:"h",text:"A morning prayer",short:"Morning"},
        {type:"p",text:"O God, who hast brought us in safety to the light of this day: we thank thee for sleep and for waking, for the breath yet in us, and for thy mercies that are new every morning. Order this day according to thy will. Keep us from sin, from pride, and from the love of the world. Give us our needful bread, and grace to be content. Make us faithful in our labor, gentle in our dealings, and ready to bear one another's burdens; and let all we do be done as unto thee. Through Jesus Christ our Lord. Amen."},
        {type:"refs",text:"Lamentations 3:22–23  ·  Psalm 143:8"},
        {type:"h",text:"An evening prayer",short:"Evening"},
        {type:"p",text:"O Lord our God, the day is spent, and we come to thee before we sleep. Forgive us wherein we have sinned this day — in thought, in word, in deed, and in the good we left undone. Cover us in the mercy of Christ, that we may lie down in peace and not in guilt. Watch over this house and all who dwell in it; keep the sick, the sorrowing, and the stranger this night; and if we wake to another day, let us wake to serve thee. Into thy hands we commend ourselves, for thou art our keeper, and thou slumberest not. Amen."},
        {type:"refs",text:"Psalm 4:8  ·  Psalm 121:3–4"},
        {type:"h",text:"Grace before and after meat",short:"Grace"},
        {type:"p",text:"Before: Bless us, O Lord, and these thy gifts, which we receive from thy bounty; and make us mindful of the needs of others. Amen."},
        {type:"p",text:"After: We thank thee, O God, for this food and for all thy mercies; feed us likewise with the bread of life, that we hunger no more. Amen."},
        {type:"refs",text:"Matthew 6:11  ·  John 6:35"},
        {type:"h",text:"A prayer of confession",short:"Confession"},
        {type:"p",text:"Merciful God, we have sinned against thee, and are not worthy to be called thy children. We have followed too much the desires of our own hearts, and left undone what we ought to have done. Yet thou hast promised that whoso confesseth and forsaketh his sin shall find mercy. We come therefore not pleading our own goodness, but the blood of Jesus Christ thy Son, which cleanseth from all sin. Forgive us, renew us, and grant us to walk henceforth in newness of life. Amen."},
        {type:"refs",text:"1 John 1:8–9  ·  Proverbs 28:13  ·  Psalm 51:1–2"},
        {type:"h",text:"Before the Lord's Supper",short:"Before the Supper"},
        {type:"p",text:"Lord Jesus, who in the night of thy betrayal didst break bread with thine own, and biddest us remember thee until thou come: search us, and try our hearts, that we come not unworthily to thy table. Let us be at peace with thee and with one another, holding no grudge and hiding no sin. As we take this bread and this cup, feed our souls upon thy body broken and thy blood shed for us; and bind us, who are many, into one body in thee. Amen."},
        {type:"refs",text:"1 Corinthians 11:23–29  ·  1 Corinthians 10:16–17"},
        {type:"h",text:"In sickness and affliction",short:"Sickness"},
        {type:"p",text:"O God, our refuge and strength, a very present help in trouble: we bring thee our affliction, and the one who suffers. If it be thy will, restore health and lift this burden; but if thou tarry, give grace to bear it, and let thy strength be made perfect in weakness. Teach us that thou dost all things well, and that neither life nor death can part us from thy love in Christ. We wait upon thee, and trust thee still. Amen."},
        {type:"refs",text:"Psalm 46:1  ·  2 Corinthians 12:9  ·  James 5:14–15"},
        {type:"h",text:"For the church, and the world",short:"Church & world"},
        {type:"p",text:"O God, keep thy little flock. Raise up faithful ministers, guard us from division and from pride, and make us of one heart and one mind. Provide for the poor and the widow among us, comfort the grieving, and bring home any who have wandered. Have mercy also upon the world that knoweth thee not; and where any is drawn to seek thee, send them a shepherd, and open to them the old paths. Thy kingdom come. Amen."},
        {type:"refs",text:"Luke 12:32  ·  1 Timothy 2:1–2  ·  Philippians 2:2"}
      ] }
  ]
};

/* ------------------------------- helpers ------------------------------- */
const $ = id => document.getElementById(id);
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
const ENTRIES = [FAITH.preface, ...FAITH.parts];
function findEntry(id){ return ENTRIES.find(e=>e.id===id); }
function numeral(e){ return e.front ? "" : e.no.toUpperCase(); }
function kicker(e){ return e.front ? "Preface" : "Part " + numeral(e); }
function shortName(e){ return e.front ? "Preface" : numeral(e) + " · " + e.name; }
const ICON = {
  book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>',
  prev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>',
  next:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>',
  chev:'<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>'
};
const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ------------------------- remembered settings ------------------------- */
const STORE = "way-of-christ";
function load(){ try{ return JSON.parse(localStorage.getItem(STORE)) || {}; }catch(e){ return {}; } }
function save(patch){ const s = Object.assign(load(), patch); try{ localStorage.setItem(STORE, JSON.stringify(s)); }catch(e){} }
const SIZES = [16,17,18,20,22];
let sizeIdx = 2;
function applySize(i){
  sizeIdx = Math.max(0, Math.min(SIZES.length-1, i));
  document.documentElement.style.setProperty("--fs", SIZES[sizeIdx] + "px");
}
applySize(typeof load().size === "number" ? load().size : 2);

/* ------------------------------ text render ------------------------------ */
function inlineLinks(text){
  return esc(text).replace(/\[\[([a-z-]+)\|([^\]]+)\]\]/g,(m,id,label)=>`<button class="xref" data-go="${id}">${label}</button>`);
}
function renderRefs(text){
  return inlineLinks(text).split("·").map(seg=>{
    const key = seg.trim();
    return VERSES[key] ? seg.replace(key, `<button class="vref" data-ref="${key}">${key}</button>`) : seg;
  }).join("·");
}
function renderBlock(b,i){
  const id = ` id="blk${i}"`;
  if(b.type==="h")     return `<h3 class="sub"${id}>${esc(b.text)}</h3>`;
  if(b.type==="refs")  return `<p class="refs"${id}>${renderRefs(b.text)}</p>`;
  if(b.type==="verse") return `<blockquote class="verse"${id}>${esc(b.text)}<span class="ref">${esc(b.ref||"")}</span></blockquote>`;
  return `<p class="body"${id}>${inlineLinks(b.text)}</p>`;
}
function sectionAt(e, i){
  let name = null;
  (e.content||[]).forEach((b,j)=>{ if(b.type==="h" && j<=i) name = b.text; });
  return name;
}

/* --------------------------------- bar --------------------------------- */
function tab(label, icon, attrs, current){
  return `<button class="tab" ${attrs}${current?' aria-current="page"':''}>${icon}<span>${label}</span></button>`;
}
function setBar(kind, e){
  const text = `<button class="tab" data-sheet="reading" aria-label="Reading settings"><span class="aa" aria-hidden="true">Aa</span><span>Text</span></button>`;
  if(kind === "part"){
    const i = ENTRIES.indexOf(e), p = ENTRIES[i-1], n = ENTRIES[i+1];
    $("bar").innerHTML =
      tab("Contents", ICON.book, 'data-go="home"') +
      (p ? tab(p.front?"Preface":numeral(p), ICON.prev, `data-go="${p.id}" aria-label="Previous: ${esc(p.name)}"`) : tab("", ICON.prev, "disabled aria-hidden=\"true\"")) +
      (n ? tab(numeral(n), ICON.next, `data-go="${n.id}" aria-label="Next: ${esc(n.name)}"`) : tab("", ICON.next, "disabled aria-hidden=\"true\"")) +
      text;
  }else{
    $("bar").innerHTML =
      tab("Contents", ICON.book, 'data-go="home"', kind==="home") +
      tab("Search", ICON.search, 'data-go="search"', kind==="search") +
      text;
  }
}

/* -------------------------------- views -------------------------------- */
let observer = null, current = null;

function renderHome(){
  current = null; document.title = FAITH.name;
  const s = load();
  let resume = "";
  const last = s.last && findEntry(s.last.id);
  if(last){
    const sec = sectionAt(last, s.last.block || 0);
    resume = `<button class="resume" data-go="${last.id}" data-block="${s.last.block||0}">
      <span class="what"><span class="label">Continue reading</span><span class="where">${esc(shortName(last))}${sec?` — ${esc(sec.replace(/^[IVX]+\.\s+/,""))}`:""}</span></span>${ICON.next.replace('<svg','<svg width="18" height="18"')}</button>`;
  }
  const rows = ENTRIES.map(e=>`<button class="row" data-go="${e.id}">
      <span class="no">${numeral(e)}</span>
      <span class="nm"><b>${esc(e.name)}</b><i>${esc(e.tag)}</i></span>${ICON.chev}</button>`).join("");
  $("view").innerHTML = `<header class="title">
      <span class="label">A rule of life</span>
      <h1>${esc(FAITH.name)}</h1>
      <p>${esc(FAITH.descriptor.charAt(0).toUpperCase()+FAITH.descriptor.slice(1))}</p>
    </header>
    <p class="epigraph">${esc(FAITH.epigraph.text)} <span>— ${esc(FAITH.epigraph.ref)}</span></p>
    ${resume}
    <nav class="list" aria-label="Contents">${rows}</nav>`;
  setBar("home");
}

function renderPart(e, block){
  current = e; document.title = e.name + " — " + FAITH.name;
  const content = e.content || [];
  const secs = content.map((b,i)=>({b,i})).filter(x=>x.b.type==="h");
  const chips = secs.length > 1
    ? `<nav class="chips" aria-label="Sections">${secs.map(x=>`<button class="chip" data-jump="${x.i}">${esc(x.b.short || x.b.text)}</button>`).join("")}</nav>` : "";
  const i = ENTRIES.indexOf(e), p = ENTRIES[i-1], n = ENTRIES[i+1];
  const pn = `<nav class="pn" aria-label="Parts">${p?`<button data-go="${p.id}"><span class="label">← Previous</span><b>${esc(shortName(p))}</b></button>`:"<span></span>"}${n?`<button class="next" data-go="${n.id}"><span class="label">Next →</span><b>${esc(shortName(n))}</b></button>`:""}</nav>`;
  $("view").innerHTML = `<article class="part">
      <span class="label">${esc(kicker(e))}</span>
      <h2>${esc(e.name)}</h2>
      <p class="lead">${esc(e.tag)}</p>
      ${chips}
      ${content.map(renderBlock).join("")}
      ${pn}
    </article>`;
  setBar("part", e);
  watchSections(e);
  if(block != null){ requestAnimationFrame(()=>jumpTo(block, true)); }
}

function renderSearch(raw){
  current = null; document.title = "Search — " + FAITH.name;
  if(!$("q")){
    $("view").innerHTML = `<span class="label">Search</span>
      <label class="search-box"><span class="sr">Search the text</span>${ICON.search}<input id="q" type="search" autocomplete="off" placeholder="A word or phrase"></label>
      <div id="results"></div>`;
    $("q").addEventListener("input", ()=>{ clearTimeout(renderSearch._t); renderSearch._t = setTimeout(()=>renderSearch($("q").value),120); });
    setBar("search");
    if(raw){ $("q").value = raw; }
    setTimeout(()=>$("q").focus(), 0);
  }
  const query = String(raw||"").trim().toLowerCase();
  const out = $("results");
  if(query.length < 2){ out.innerHTML = `<p class="note">Type a word or two to search the whole text.</p>`; return; }
  const hits = [];
  ENTRIES.forEach(e=>(e.content||[]).forEach((b,i)=>{
    const plain = (b.text||"").replace(/\[\[[a-z-]+\|([^\]]+)\]\]/g,"$1");
    const at = plain.toLowerCase().indexOf(query);
    if(at >= 0) hits.push({e,i,plain,at});
  }));
  if(!hits.length){ out.innerHTML = `<p class="note">Nothing found for “${esc(String(raw).trim())}”.</p>`; return; }
  out.innerHTML = `<p class="note">${hits.length} ${hits.length===1?"passage":"passages"}</p><div class="list">` +
    hits.map(h=>{
      const pad=60, s=Math.max(0,h.at-pad), t=Math.min(h.plain.length,h.at+query.length+pad);
      const snip = (s>0?"…":"") + esc(h.plain.slice(s,h.at)) + "<mark>" + esc(h.plain.slice(h.at,h.at+query.length)) + "</mark>" + esc(h.plain.slice(h.at+query.length,t)) + (t<h.plain.length?"…":"");
      const sec = sectionAt(h.e, h.i);
      return `<button class="result" data-go="${h.e.id}" data-block="${h.i}"><span class="label">${esc(shortName(h.e))}${sec?" · "+esc(sec.replace(/^[IVX]+\.\s+/,"")):""}</span><span class="snip">${snip}</span></button>`;
    }).join("") + `</div>`;
}

/* --------------------------- part behaviors --------------------------- */
function jumpTo(i, flash){
  const node = $("blk"+i); if(!node) return;
  node.scrollIntoView({block: node.classList.contains("sub") ? "start" : "center", behavior: reduceMotion ? "auto" : "smooth"});
  if(flash){ node.classList.remove("hl"); void node.offsetWidth; node.classList.add("hl"); }
}
function markChip(i){
  document.querySelectorAll(".chip").forEach(c=>{
    const on = Number(c.dataset.jump) === i;
    c.setAttribute("aria-current", on ? "true" : "false");
    const box = c.parentNode;
    if(on && box && box.scrollTo){ box.scrollTo({left: c.offsetLeft - 24, behavior: reduceMotion?"auto":"smooth"}); }
  });
}
function watchSections(e){
  if(observer){ observer.disconnect(); observer = null; }
  const heads = [...document.querySelectorAll(".sub")];
  if(heads.length && "IntersectionObserver" in window){
    observer = new IntersectionObserver(entries=>{
      const top = heads.filter(h=>h.getBoundingClientRect().top < 140).pop() || heads[0];
      markChip(Number(top.id.slice(3)));
    }, {rootMargin:"0px 0px -60% 0px", threshold:[0,1]});
    heads.forEach(h=>observer.observe(h));
  }
  if(heads.length) markChip(Number(heads[0].id.slice(3)));
  save({last:{id:e.id, block:0}});
}
let _saveT = null;
window.addEventListener("scroll", ()=>{
  if(!current) return;
  clearTimeout(_saveT);
  _saveT = setTimeout(()=>{
    const blocks = document.querySelectorAll("[id^=blk]");
    let idx = 0;
    for(const b of blocks){ if(b.getBoundingClientRect().bottom > 90){ idx = Number(b.id.slice(3)); break; } }
    save({last:{id:current.id, block:idx}});
  }, 300);
}, {passive:true});

/* -------------------------------- sheets -------------------------------- */
let lastFocus = null;
function openSheet(title, html){
  lastFocus = document.activeElement;
  $("sheetTitle").textContent = title;
  $("sheetBody").innerHTML = html;
  $("sheet").hidden = false;
  document.body.style.overflow = "hidden";
  const f = $("sheet").querySelector("[data-size],.close"); if(f) f.focus();
}
function closeSheet(){
  if($("sheet").hidden) return;
  $("sheet").hidden = true; document.body.style.overflow = "";
  if(lastFocus && lastFocus.focus) lastFocus.focus();
}
function showVerse(ref){
  const d = VERSES[ref]; if(!d) return;
  openSheet(ref, `<p class="vtext">${d.items.map(it=>`<sup>${esc(it[0])}</sup>${esc(it[1])}`).join(" ")}</p>`);
}
function readingSheet(){
  const dots = SIZES.map((_,i)=>`<i class="${i===sizeIdx?"on":""}"></i>`).join("");
  openSheet("Reading", `<div class="sizer">
      <button class="dn" data-size="-1" aria-label="Smaller text"${sizeIdx===0?" disabled":""}>A</button>
      <div class="dots" role="img" aria-label="Text size ${sizeIdx+1} of ${SIZES.length}">${dots}</div>
      <button class="up" data-size="1" aria-label="Larger text"${sizeIdx===SIZES.length-1?" disabled":""}>A</button>
    </div>
    <p class="sample">The Lord is my shepherd; I shall not want.</p>
    <button class="plain-btn" data-print>Print, or save as PDF</button>`);
}

/* ------------------------------ navigation ------------------------------ */
function go(where, block, push){
  closeSheet();
  if(where === "search"){ $("view").innerHTML = ""; renderSearch(""); }
  else{
    const e = findEntry(where);
    if(e) renderPart(e, block); else renderHome();
  }
  if(block == null) window.scrollTo(0,0);
  $("view").focus({preventScroll:true});
  if(push !== false){ try{ history.pushState({where, block}, ""); }catch(err){} }
}
window.addEventListener("popstate", ev=>{ const st = ev.state || {}; go(st.where || "home", st.block, false); });

document.addEventListener("click", ev=>{
  const t = ev.target.closest("button"); if(!t || t.disabled) return;
  if(t.dataset.ref){ showVerse(t.dataset.ref); return; }
  if(t.dataset.go){ const b = t.dataset.block; go(t.dataset.go, b==null ? null : Number(b)); return; }
  if(t.dataset.jump){ jumpTo(Number(t.dataset.jump), false); return; }
  if(t.dataset.sheet === "reading"){ readingSheet(); return; }
  if(t.dataset.size){ applySize(sizeIdx + Number(t.dataset.size)); save({size:sizeIdx}); readingSheet(); return; }
  if(t.hasAttribute("data-print")){ closeSheet(); setTimeout(()=>window.print(), 50); return; }
  if(t.hasAttribute("data-close")){ closeSheet(); return; }
});
$("sheet").addEventListener("click", ev=>{ if(ev.target === $("sheet")) closeSheet(); });
document.addEventListener("keydown", ev=>{ if(ev.key === "Escape") closeSheet(); });

/* --------------------------------- print --------------------------------- */
function buildPrintBook(){
  const strip = t => esc(t).replace(/\[\[([a-z-]+)\|([^\]]+)\]\]/g,"$2");
  let html = `<div class="pb-leaf"><h1>${esc(FAITH.name)}</h1><p>${esc(FAITH.descriptor)}</p></div><p class="pb-epi">${esc(FAITH.epigraph.text)}<br>— ${esc(FAITH.epigraph.ref)}</p>`;
  ENTRIES.forEach(e=>{
    html += `<section class="pb-part"><div class="pb-kick">${esc(kicker(e))}</div><h2>${esc(e.name)}</h2><p class="pb-lead">${esc(e.tag)}</p>`;
    (e.content||[]).forEach(b=>{
      if(b.type==="h") html += `<h3>${esc(b.text)}</h3>`;
      else if(b.type==="refs") html += `<p class="refs">${strip(b.text)}</p>`;
      else if(b.type==="verse") html += `<p class="verse">${esc(b.text)} (${esc(b.ref||"")})</p>`;
      else html += `<p>${strip(b.text)}</p>`;
    });
    html += `</section>`;
  });
  $("print-book").innerHTML = html;
}

/* --------------------------------- start --------------------------------- */
buildPrintBook();
try{ history.replaceState({where:"home"}, ""); }catch(err){}
renderHome();
</script>
