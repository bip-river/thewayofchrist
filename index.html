:root{
  color-scheme: light dark;
  --bg:#F3F4F1; --card:#FFFFFF; --ink:#1C2333; --muted:#586273; --line:#DEE1E4;
  --accent:#2F4D6E; --on-accent:#FFFFFF; --accent-text:#2F4D6E; --hl:rgba(47,77,110,.14);
  --scrim:rgba(18,22,30,.42);
  --serif:"Source Serif 4", "Iowan Old Style", Georgia, serif;
  --sans:"Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  --fs:18px; --col:40rem;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#12161E; --card:#1A1F29; --ink:#E4E7EC; --muted:#A3ACBA; --line:#2C3340;
    --accent:#9DB6D3; --on-accent:#12161E; --accent-text:#9DB6D3; --hl:rgba(157,182,211,.2);
    --scrim:rgba(0,0,0,.55);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:var(--fs);line-height:1.62;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
main:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---- shell ---- */
.app{max-width:var(--col);margin:0 auto;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.view{padding:40px 24px 24px}
.label{font-family:var(--sans);font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* ---- bottom bar ---- */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding:4px 8px calc(6px + env(safe-area-inset-bottom))}
.bar-in{max-width:var(--col);margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}
.tab{min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:600 12px/1.2 var(--sans);color:var(--muted);border-radius:8px;text-align:center}
.tab svg{width:21px;height:21px}
.tab .aa{font:400 19px/21px var(--serif)}
.tab[aria-current="page"]{color:var(--accent-text)}
.tab:disabled{opacity:.35;cursor:default}

/* ---- home ---- */
.title h1{margin:4px 0 2px;font-weight:600;font-size:2.1em;line-height:1.08;letter-spacing:-.005em}
.title p{margin:0;color:var(--muted)}
.epigraph{margin:22px 0 0;padding:2px 0 2px 14px;border-left:3px solid var(--line);font-style:italic;font-size:.94em;line-height:1.5}
.epigraph span{font-style:normal;color:var(--muted);white-space:nowrap}
.resume{margin-top:22px;width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:10px;background:var(--accent);color:var(--on-accent);text-align:left}
.resume .what{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.resume .label{color:inherit;opacity:.9}
.resume .where{font-size:1em;line-height:1.3}
.list{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{width:100%;display:flex;align-items:center;gap:12px;min-height:56px;padding:9px 14px;border-bottom:1px solid var(--line);text-align:left}
.row:last-child{border-bottom:0}
.row .no{width:28px;flex-shrink:0;font:600 13px var(--sans);color:var(--muted)}
.row .nm{flex:1;display:flex;flex-direction:column;min-width:0}
.row .nm b{font-weight:400;font-size:1em;line-height:1.3}
.row .nm i{font-size:.8em;color:var(--muted);line-height:1.35}
.chev{width:16px;height:16px;flex-shrink:0;color:var(--muted)}
@media (hover:hover){ .row:hover,.result:hover{background:var(--hl)} }

/* ---- part page ---- */
.part h2{margin:4px 0 2px;font-weight:600;font-size:1.7em;line-height:1.12}
.part .lead{margin:0 0 6px;color:var(--muted);font-style:italic}
.chips{position:sticky;top:0;z-index:10;background:var(--bg);display:flex;gap:8px;overflow-x:auto;margin:0 -24px;padding:12px 24px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;min-height:38px;padding:0 14px;border-radius:19px;border:1px solid var(--line);background:var(--card);font:500 14px var(--sans);white-space:nowrap}
.chip[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.sub{margin:1.9em 0 .45em;font-weight:600;font-size:1.18em;line-height:1.3;scroll-margin-top:72px}
.body{margin:0 0 1em}
.refs{margin:-.35em 0 1.35em;font:500 14px/1.6 var(--sans);color:var(--muted)}
.verse{margin:1.2em 0;font-style:italic;line-height:1.7}
.verse .ref{display:block;margin-top:.4em;font:500 14px var(--sans);font-style:normal;color:var(--muted)}
.vref,.xref{color:var(--accent-text);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;text-decoration-color:color-mix(in srgb,var(--accent-text) 45%,transparent)}
.vref{white-space:nowrap;font:inherit}
.pn{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:2.4em}
.pn button{display:flex;flex-direction:column;gap:2px;padding:12px 14px;min-height:64px;border:1px solid var(--line);border-radius:10px;background:var(--card);text-align:left}
.pn button.next{text-align:right;align-items:flex-end}
.pn .label{font-size:11px}
.pn b{font-weight:400;font-size:.9em;line-height:1.3}
@keyframes hl{from{background:var(--hl)}to{background:transparent}}
.hl{animation:hl 2.2s ease-out}

/* ---- search ---- */
.search-box{display:flex;align-items:center;gap:10px;padding:0 14px;min-height:50px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-top:12px}
.search-box svg{width:20px;height:20px;color:var(--muted);flex-shrink:0}
.search-box input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:400 17px var(--serif);outline:none;padding:12px 0}
.note{color:var(--muted);font-style:italic;margin:16px 2px 0}
.result{width:100%;display:block;text-align:left;padding:12px 14px;border-bottom:1px solid var(--line)}
.result:last-child{border-bottom:0}
.result .label{font-size:11px;color:var(--accent-text)}
.result .snip{display:block;margin-top:3px;font-size:.88em;line-height:1.5;color:var(--muted)}
.result mark{background:var(--hl);color:var(--ink);padding:0 .05em;border-radius:2px}

/* ---- sheets ---- */
.sheet[hidden]{display:none}
.sheet{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet-card{width:100%;max-width:var(--col);max-height:78vh;overflow:auto;background:var(--card);color:var(--ink);border-radius:16px 16px 0 0;padding:10px 22px calc(26px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.grab{display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.close{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--muted);border-radius:8px;margin-right:-10px}
.close svg{width:20px;height:20px}
.vtext{margin:0;font-size:1.02em;line-height:1.75}
.vtext sup{font:600 .62em var(--sans);color:var(--accent-text);margin-right:.15em}
.sizer{display:grid;grid-template-columns:56px 1fr 56px;align-items:center;gap:10px}
.sizer button{height:52px;border:1px solid var(--line);border-radius:10px;font-family:var(--serif)}
.sizer .dn{font-size:15px}.sizer .up{font-size:23px}
.dots{display:flex;justify-content:center;gap:8px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.sample{margin:16px 0 0;color:var(--muted);font-size:var(--fs)}
.plain-btn{margin-top:18px;width:100%;min-height:50px;border:1px solid var(--line);border-radius:10px;font:600 15px var(--sans)}

@media (min-width:720px){ .view{padding:56px 32px 32px} .chips{margin:0 -32px;padding:12px 32px} }
@media (prefers-reduced-motion:reduce){ .hl{animation:none} }

/* ---- print ---- */
#print-book{display:none}
@media print{
  :root{--bg:#fff;--ink:#000;--muted:#444}
  .app,.bar,.sheet{display:none!important}
  #print-book{display:block}
  body{background:#fff;color:#000;font-size:11.5pt;line-height:1.5}
  @page{margin:2cm}
  .pb-leaf{text-align:center;margin:3cm 0 1cm}
  .pb-leaf h1{font-size:26pt;font-weight:600;margin:0 0 4pt}
  .pb-leaf p{font-style:italic;margin:0}
  .pb-epi{text-align:center;font-style:italic;max-width:24rem;margin:1cm auto}
  .pb-part{break-before:page}
  .pb-kick{font:600 9pt var(--sans);letter-spacing:.14em;text-transform:uppercase;color:#555}
  .pb-part h2{font-size:18pt;font-weight:600;margin:2pt 0}
  .pb-lead{font-style:italic;color:#444;margin:0 0 12pt}
  .pb-part h3{font-size:12.5pt;font-weight:600;margin:14pt 0 4pt;break-after:avoid}
  .pb-part p{margin:0 0 6pt;orphans:2;widows:2}
  .pb-part p.refs{font:500 8.5pt var(--sans);color:#555;margin:-2pt 0 8pt}
  .pb-part .verse{font-style:italic;margin:8pt 0}
}

rks:"],["25","Not forsaking the assembling of ourselves together, as the manner of some is; but exhorting one another: and so much the more, as ye see the day approaching."]]},"Hebrews 10:26–29":{"c":"10","items":[["26","For if we sin wilfully after that we have received the knowledge of the truth, there remaineth no more sacrifice for sins,"],["27","But a certain fearful looking for of judgment and fiery indignation, which shall devour the adversaries."],["28","He that despised Moses’ law died without mercy under two or three witnesses:"],["29","Of how much sorer punishment, suppose ye, shall he be thought worthy, who hath trodden under foot the Son of God, and hath counted the blood of the covenant, wherewith he was sanctified, an unholy thing, and hath done despite unto the Spirit of grace?"]]},"Hebrews 12:1":{"c":"12","items":[["1","Wherefore seeing we also are compassed about with so great a cloud of witnesses, let us lay aside every weight, and the sin which doth so easily beset us, and let us run with patience the race that is set before us,"]]},"Hebrews 13:1–2":{"c":"13","items":[["1","Let brotherly love continue."],["2","Be not forgetful to entertain strangers: for thereby some have entertained angels unawares."]]},"Hebrews 13:5":{"c":"13","items":[["5","Let your conversation be without covetousness; and be content with such things as ye have: for he hath said, I will never leave thee, nor forsake thee."]]},"Hebrews 1:1–2":{"c":"1","items":[["1","God, who at sundry times and in divers manners spake in time past unto the fathers by the prophets,"],["2","Hath in these last days spoken unto us by his Son, whom he hath appointed heir of all things, by whom also he made the worlds;"]]},"Hebrews 4:9–10":{"c":"4","items":[["9","There remaineth therefore a rest to the people of God."],["10","For he that is entered into his rest, he also hath ceased from his own works, as God did from his."]]},"Hebrews 4:9–11":{"c":"4","items":[["9","There remaineth therefore a rest to the people of God."],["10","For he that is entered into his rest, he also hath ceased from his own works, as God did from his."],["11","Let us labour therefore to enter into that rest, lest any man fall after the same example of unbelief."]]},"Isaiah 11:6–9":{"c":"11","items":[["6","The wolf also shall dwell with the lamb, and the leopard shall lie down with the kid; and the calf and the young lion and the fatling together; and a little child shall lead them."],["7","And the cow and the bear shall feed; their young ones shall lie down together: and the lion shall eat straw like the ox."],["8","And the sucking child shall play on the hole of the asp, and the weaned child shall put his hand on the cockatrice’ den."],["9","They shall not hurt nor destroy in all my holy mountain: for the earth shall be full of the knowledge of the LORD, as the waters cover the sea."]]},"Isaiah 2:4":{"c":"2","items":[["4","And he shall judge among the nations, and shall rebuke many people: and they shall beat their swords into plowshares, and their spears into pruninghooks: nation shall not lift up sword against nation, neither shall they learn war any more."]]},"Isaiah 40:8":{"c":"40","items":[["8","The grass withereth, the flower fadeth: but the word of our God shall stand for ever."]]},"James 1:19":{"c":"1","items":[["19","Wherefore, my beloved brethren, let every man be swift to hear, slow to speak, slow to wrath:"]]},"James 1:22":{"c":"1","items":[["22","But be ye doers of the word, and not hearers only, deceiving your own selves."]]},"James 2:14–26":{"c":"2","items":[["14","What doth it profit, my brethren, though a man say he hath faith, and have not works? can faith save him?"],["15","If a brother or sister be naked, and destitute of daily food,"],["16","And one of you say unto them, Depart in peace, be ye warmed and filled; notwithstanding ye give them not those things which are needful to the body; what doth it profit?"],["17","Even so faith, if it hath not works, is dead, being alone."],["18","Yea, a man may say, Thou hast faith, and I have works: shew me thy faith without thy works, and I will shew thee my faith by my works."],["19","Thou believest that there is one God; thou doest well: the devils also believe, and tremble."],["20","But wilt thou know, O vain man, that faith without works is dead?"],["21","Was not Abraham our father justified by works, when he had offered Isaac his son upon the altar?"],["22","Seest thou how faith wrought with his works, and by works was faith made perfect?"],["23","And the scripture was fulfilled which saith, Abraham believed God, and it was imputed unto him for righteousness: and he was called the Friend of God."],["24","Ye see then how that by works a man is justified, and not by faith only."],["25","Likewise also was not Rahab the harlot justified by works, when she had received the messengers, and had sent them out another way?"],["26","For as the body without the spirit is dead, so faith without works is dead also."]]},"James 3:1":{"c":"3","items":[["1","My brethren, be not many masters, knowing that we shall receive the greater condemnation."]]},"James 5:12":{"c":"5","items":[["12","But above all things, my brethren, swear not, neither by heaven, neither by the earth, neither by any other oath: but let your yea be yea; and your nay, nay; lest ye fall into condemnation."]]},"James 5:14–15":{"c":"5","items":[["14","Is any sick among you? let him call for the elders of the church; and let them pray over him, anointing him with oil in the name of the Lord:"],["15","And the prayer of faith shall save the sick, and the Lord shall raise him up; and if he have committed sins, they shall be forgiven him."]]},"James 5:16":{"c":"5","items":[["16","Confess your faults one to another, and pray one for another, that ye may be healed. The effectual fervent prayer of a righteous man availeth much."]]},"James 5:19–20":{"c":"5","items":[["19","Brethren, if any of you do err from the truth, and one convert him;"],["20","Let him know, that he which converteth the sinner from the error of his way shall save a soul from death, and shall hide a multitude of sins."]]},"Jeremiah 6:16":{"c":"6","items":[["16","Thus saith the LORD, Stand ye in the ways, and see, and ask for the old paths, where is the good way, and walk therein, and ye shall find rest for your souls. But they said, We will not walk therein."]]},"Job 1:21":{"c":"1","items":[["21","And said, Naked came I out of my mother’s womb, and naked shall I return thither: the LORD gave, and the LORD hath taken away; blessed be the name of the LORD."]]},"Job 42:7":{"c":"42","items":[["7","And it was so, that after the LORD had spoken these words unto Job, the LORD said to Eliphaz the Temanite, My wrath is kindled against thee, and against thy two friends: for ye have not spoken of me the thing that is right, as my servant Job hath."]]},"John 10:11–12":{"c":"10","items":[["11","I am the good shepherd: the good shepherd giveth his life for the sheep."],["12","But he that is an hireling, and not the shepherd, whose own the sheep are not, seeth the wolf coming, and leaveth the sheep, and fleeth: and the wolf catcheth them, and scattereth the sheep."]]},"John 10:16":{"c":"10","items":[["16","And other sheep I have, which are not of this fold: them also I must bring, and they shall hear my voice; and there shall be one fold, and one shepherd."]]},"John 11:25–26":{"c":"11","items":[["25","Jesus said unto her, I am the resurrection, and the life: he that believeth in me, though he were dead, yet shall he live:"],["26","And whosoever liveth and believeth in me shall never die. Believest thou this?"]]},"John 13:15":{"c":"13","items":[["15","For I have given you an example, that ye should do as I have done to you."]]},"John 13:4–15":{"c":"13","items":[["4","He riseth from supper, and laid aside his garments; and took a towel, and girded himself."],["5","After that he poureth water into a bason, and began to wash the disciples’ feet, and to wipe them with the towel wherewith he was girded."],["6","Then cometh he to Simon Peter: and Peter saith unto him, Lord, dost thou wash my feet?"],["7","Jesus answered and said unto him, What I do thou knowest not now; but thou shalt know hereafter."],["8","Peter saith unto him, Thou shalt never wash my feet. Jesus answered him, If I wash thee not, thou hast no part with me."],["9","Simon Peter saith unto him, Lord, not my feet only, but also my hands and my head."],["10","Jesus saith to him, He that is washed needeth not save to wash his feet, but is clean every whit: and ye are clean, but not all."],["11","For he knew who should betray him; therefore said he, Ye are not all clean."],["12","So after he had washed their feet, and had taken his garments, and was set down again, he said unto them, Know ye what I have done to you?"],["13","Ye call me Master and Lord: and ye say well; for so I am."],["14","If I then, your Lord and Master, have washed your feet; ye also ought to wash one another’s feet."],["15","For I have given you an example, that ye should do as I have done to you."]]},"John 14:15":{"c":"14","items":[["15","If ye love me, keep my commandments."]]},"John 15:13":{"c":"15","items":[["13","Greater love hath no man than this, that a man lay down his life for his friends."]]},"John 15:5–6":{"c":"15","items":[["5","I am the vine, ye are the branches: He that abideth in me, and I in him, the same bringeth forth much fruit: for without me ye can do nothing."],["6","If a man abide not in me, he is cast forth as a branch, and is withered; and men gather them, and cast them into the fire, and they are burned."]]},"John 16:8,13":{"c":"16","items":[["8","And when he is come, he will reprove the world of sin, and of righteousness, and of judgment:"],["13","Howbeit when he, the Spirit of truth, is come, he will guide you into all truth: for he shall not speak of himself; but whatsoever he shall hear, that shall he speak: and he will shew you things to come."]]},"John 17:14–16":{"c":"17","items":[["14","I have given them thy word; and the world hath hated them, because they are not of the world, even as I am not of the world."],["15","I pray not that thou shouldest take them out of the world, but that thou shouldest keep them from the evil."],["16","They are not of the world, even as I am not of the world."]]},"John 17:15":{"c":"17","items":[["15","I pray not that thou shouldest take them out of the world, but that thou shouldest keep them from the evil."]]},"John 17:17":{"c":"17","items":[["17","Sanctify them through thy truth: thy word is truth."]]},"John 18:36":{"c":"18","items":[["36","Jesus answered, My kingdom is not of this world: if my kingdom were of this world, then would my servants fight, that I should not be delivered to the Jews: but now is my kingdom not from hence."]]},"John 1:1–14":{"c":"1","items":[["1","In the beginning was the Word, and the Word was with God, and the Word was God."],["2","The same was in the beginning with God."],["3","All things were made by him; and without him was not any thing made that was made."],["4","In him was life; and the life was the light of men."],["5","And the light shineth in darkness; and the darkness comprehended it not."],["6","There was a man sent from God, whose name was John."],["7","The same came for a witness, to bear witness of the Light, that all men through him might believe."],["8","He was not that Light, but was sent to bear witness of that Light."],["9","That was the true Light, which lighteth every man that cometh into the world."],["10","He was in the world, and the world was made by him, and the world knew him not."],["11","He came unto his own, and his own received him not."],["12","But as many as received him, to them gave he power to become the sons of God, even to them that believe on his name:"],["13","Which were born, not of blood, nor of the will of the flesh, nor of the will of man, but of God."],["14","And the Word was made flesh, and dwelt among us, (and we beheld his glory, the glory as of the only begotten of the Father,) full of grace and truth."]]},"John 20:27–28":{"c":"20","items":[["27","Then saith he to Thomas, Reach hither thy finger, and behold my hands; and reach hither thy hand, and thrust it into my side: and be not faithless, but believing."],["28","And Thomas answered and said unto him, My LORD and my God."]]},"John 3:3–7":{"c":"3","items":[["3","Jesus answered and said unto him, Verily, verily, I say unto thee, Except a man be born again, he cannot see the kingdom of God."],["4","Nicodemus saith unto him, How can a man be born when he is old? can he enter the second time into his mother’s womb, and be born?"],["5","Jesus answered, Verily, verily, I say unto thee, Except a man be born of water and of the Spirit, he cannot enter into the kingdom of God."],["6","That which is born of the flesh is flesh; and that which is born of the Spirit is spirit."],["7","Marvel not that I said unto thee, Ye must be born again."]]},"John 6:15":{"c":"6","items":[["15","When Jesus therefore perceived that they would come and take him by force, to make him a king, he departed again into a mountain himself alone."]]},"John 6:35":{"c":"6","items":[["35","And Jesus said unto them, I am the bread of life: he that cometh to me shall never hunger; and he that believeth on me shall never thirst."]]},"John 6:44":{"c":"6","items":[["44","No man can come to me, except the Father which hath sent me draw him: and I will raise him up at the last day."]]},"John 6:66–67":{"c":"6","items":[["66","From that time many of his disciples went back, and walked no more with him."],["67","Then said Jesus unto the twelve, Will ye also go away?"]]},"Joshua 24:15":{"c":"24","items":[["15","And if it seem evil unto you to serve the LORD, choose you this day whom ye will serve; whether the gods which your fathers served that were on the other side of the flood, or the gods of the Amorites, in whose land ye dwell: but as for me and my house, we will serve the LORD."]]},"Jude 1:3":{"c":"1","items":[["3","Beloved, when I gave all diligence to write unto you of the common salvation, it was needful for me to write unto you, and exhort you that ye should earnestly contend for the faith which was once delivered unto the saints."]]},"Lamentations 3:22–23":{"c":"3","items":[["22","It is of the LORD’s mercies that we are not consumed, because his compassions fail not."],["23","They are new every morning: great is thy faithfulness."]]},"Luke 10:33–35":{"c":"10","items":[["33","But a certain Samaritan, as he journeyed, came where he was: and when he saw him, he had compassion on him,"],["34","And went to him, and bound up his wounds, pouring in oil and wine, and set him on his own beast, and brought him to an inn, and took care of him."],["35","And on the morrow when he departed, he took out two pence, and gave them to the host, and said unto him, Take care of him; and whatsoever thou spendest more, when I come again, I will repay thee."]]},"Luke 11:1":{"c":"11","items":[["1","And it came to pass, that, as he was praying in a certain place, when he ceased, one of his disciples said unto him, Lord, teach us to pray, as John also taught his disciples."]]},"Luke 12:32":{"c":"12","items":[["32","Fear not, little flock; for it is your Father’s good pleasure to give you the kingdom."]]},"Luke 14:12–14":{"c":"14","items":[["12","Then said he also to him that bade him, When thou makest a dinner or a supper, call not thy friends, nor thy brethren, neither thy kinsmen, nor thy rich neighbours; lest they also bid thee again, and a recompence be made thee."],["13","But when thou makest a feast, call the poor, the maimed, the lame, the blind:"],["14","And thou shalt be blessed; for they cannot recompense thee: for thou shalt be recompensed at the resurrection of the just."]]},"Luke 14:27–28":{"c":"14","items":[["27","And whosoever doth not bear his cross, and come after me, cannot be my disciple."],["28","For which of you, intending to build a tower, sitteth not down first, and counteth the cost, whether he have sufficient to finish it?"]]},"Luke 15:20":{"c":"15","items":[["20","And he arose, and came to his father. But when he was yet a great way off, his father saw him, and had compassion, and ran, and fell on his neck, and kissed him."]]},"Luke 15:20–24":{"c":"15","items":[["20","And he arose, and came to his father. But when he was yet a great way off, his father saw him, and had compassion, and ran, and fell on his neck, and kissed him."],["21","And the son said unto him, Father, I have sinned against heaven, and in thy sight, and am no more worthy to be called thy son."],["22","But the father said to his servants, Bring forth the best robe, and put it on him; and put a ring on his hand, and shoes on his feet:"],["23","And bring hither the fatted calf, and kill it; and let us eat, and be merry:"],["24","For this my son was dead, and is alive again; he was lost, and is found. And they began to be merry."]]},"Luke 18:11–14":{"c":"18","items":[["11","The Pharisee stood and prayed thus with himself, God, I thank thee, that I am not as other men are, extortioners, unjust, adulterers, or even as this publican."],["12","I fast twice in the week, I give tithes of all that I possess."],["13","And the publican, standing afar off, would not lift up so much as his eyes unto heaven, but smote upon his breast, saying, God be merciful to me a sinner."],["14","I tell you, this man went down to his house justified rather than the other: for every one that exalteth himself shall be abased; and he that humbleth himself shall be exalted."]]},"Luke 2:10–11":{"c":"2","items":[["10","And the angel said unto them, Fear not: for, behold, I bring you good tidings of great joy, which shall be to all people."],["11","For unto you is born this day in the city of David a Saviour, which is Christ the Lord."]]},"Luke 6:34–35":{"c":"6","items":[["34","And if ye lend to them of whom ye hope to receive, what thank have ye? for sinners also lend to sinners, to receive as much again."],["35","But love ye your enemies, and do good, and lend, hoping for nothing again; and your reward shall be great, and ye shall be the children of the Highest: for he is kind unto the unthankful and to the evil."]]},"Luke 7:47":{"c":"7","items":[["47","Wherefore I say unto thee, Her sins, which are many, are forgiven; for she loved much: but to whom little is forgiven, the same loveth little."]]},"Luke 9:23":{"c":"9","items":[["23","And he said to them all, If any man will come after me, let him deny himself, and take up his cross daily, and follow me."]]},"Mark 10:9":{"c":"10","items":[["9","What therefore God hath joined together, let not man put asunder."]]},"Mark 12:30":{"c":"12","items":[["30","And thou shalt love the Lord thy God with all thy heart, and with all thy soul, and with all thy mind, and with all thy strength: this is the first commandment."]]},"Mark 2:27–28":{"c":"2","items":[["27","And he said unto them, The sabbath was made for man, and not man for the sabbath:"],["28","Therefore the Son of man is Lord also of the sabbath."]]},"Mark 7:8–9":{"c":"7","items":[["8","For laying aside the commandment of God, ye hold the tradition of men, as the washing of pots and cups: and many other such like things ye do."],["9","And he said unto them, Full well ye reject the commandment of God, that ye may keep your own tradition."]]},"Mark 9:24":{"c":"9","items":[["24","And straightway the father of the child cried out, and said with tears, Lord, I believe; help thou mine unbelief."]]},"Mark 9:38–40":{"c":"9","items":[["38","And John answered him, saying, Master, we saw one casting out devils in thy name, and he followeth not us: and we forbad him, because he followeth not us."],["39","But Jesus said, Forbid him not: for there is no man which shall do a miracle in my name, that can lightly speak evil of me."],["40","For he that is not against us is on our part."]]},"Matthew 15:6":{"c":"15","items":[["6","And honour not his father or his mother, he shall be free. Thus have ye made the commandment of God of none effect by your tradition."]]},"Matthew 16:18–19":{"c":"16","items":[["18","And I say also unto thee, That thou art Peter, and upon this rock I will build my church; and the gates of hell shall not prevail against it."],["19","And I will give unto thee the keys of the kingdom of heaven: and whatsoever thou shalt bind on earth shall be bound in heaven: and whatsoever thou shalt loose on earth shall be loosed in heaven."]]},"Matthew 18:15–17":{"c":"18","items":[["15","Moreover if thy brother shall trespass against thee, go and tell him his fault between thee and him alone: if he shall hear thee, thou hast gained thy brother."],["16","But if he will not hear thee, then take with thee one or two more, that in the mouth of two or three witnesses every word may be established."],["17","And if he shall neglect to hear them, tell it unto the church: but if he neglect to hear the church, let him be unto thee as an heathen man and a publican."]]},"Matthew 18:15–20":{"c":"18","items":[["15","Moreover if thy brother shall trespass against thee, go and tell him his fault between thee and him alone: if he shall hear thee, thou hast gained thy brother."],["16","But if he will not hear thee, then take with thee one or two more, that in the mouth of two or three witnesses every word may be established."],["17","And if he shall neglect to hear them, tell it unto the church: but if he neglect to hear the church, let him be unto thee as an heathen man and a publican."],["18","Verily I say unto you, Whatsoever ye shall bind on earth shall be bound in heaven: and whatsoever ye shall loose on earth shall be loosed in heaven."],["19","Again I say unto you, That if two of you shall agree on earth as touching any thing that they shall ask, it shall be done for them of my Father which is in heaven."],["20","For where two or three are gathered together in my name, there am I in the midst of them."]]},"Matthew 18:20":{"c":"18","items":[["20","For where two or three are gathered together in my name, there am I in the midst of them."]]},"Matthew 18:21–22":{"c":"18","items":[["21","Then came Peter to him, and said, Lord, how oft shall my brother sin against me, and I forgive him? till seven times?"],["22","Jesus saith unto him, I say not unto thee, Until seven times: but, Until seventy times seven."]]},"Matthew 19:4–6":{"c":"19","items":[["4","And he answered and said unto them, Have ye not read, that he which made them at the beginning made them male and female,"],["5","And said, For this cause shall a man leave father and mother, and shall cleave to his wife: and they twain shall be one flesh?"],["6","Wherefore they are no more twain, but one flesh. What therefore God hath joined together, let not man put asunder."]]},"Matthew 20:25–28":{"c":"20","items":[["25","But Jesus called them unto him, and said, Ye know that the princes of the Gentiles exercise dominion over them, and they that are great exercise authority upon them."],["26","But it shall not be so among you: but whosoever will be great among you, let him be your minister;"],["27","And whosoever will be chief among you, let him be your servant:"],["28","Even as the Son of man came not to be ministered unto, but to minister, and to give his life a ransom for many."]]},"Matthew 20:26–27":{"c":"20","items":[["26","But it shall not be so among you: but whosoever will be great among you, let him be your minister;"],["27","And whosoever will be chief among you, let him be your servant:"]]},"Matthew 22:21":{"c":"22","items":[["21","They say unto him, Caesar’s. Then saith he unto them, Render therefore unto Caesar the things which are Caesar’s; and unto God the things that are God’s."]]},"Matthew 25:35–40":{"c":"25","items":[["35","For I was an hungred, and ye gave me meat: I was thirsty, and ye gave me drink: I was a stranger, and ye took me in:"],["36","Naked, and ye clothed me: I was sick, and ye visited me: I was in prison, and ye came unto me."],["37","Then shall the righteous answer him, saying, Lord, when saw we thee an hungred, and fed thee? or thirsty, and gave thee drink?"],["38","When saw we thee a stranger, and took thee in? or naked, and clothed thee?"],["39","Or when saw we thee sick, or in prison, and came unto thee?"],["40","And the King shall answer and say unto them, Verily I say unto you, Inasmuch as ye have done it unto one of the least of these my brethren, ye have done it unto me."]]},"Matthew 26:52":{"c":"26","items":[["52","Then said Jesus unto him, Put up again thy sword into his place: for all they that take the sword shall perish with the sword."]]},"Matthew 28:19":{"c":"28","items":[["19","Go ye therefore, and teach all nations, baptizing them in the name of the Father, and of the Son, and of the Holy Ghost:"]]},"Matthew 28:19–20":{"c":"28","items":[["19","Go ye therefore, and teach all nations, baptizing them in the name of the Father, and of the Son, and of the Holy Ghost:"],["20","Teaching them to observe all things whatsoever I have commanded you: and, lo, I am with you alway, even unto the end of the world. Amen."]]},"Matthew 5:17–20":{"c":"5","items":[["17","Think not that I am come to destroy the law, or the prophets: I am not come to destroy, but to fulfil."],["18","For verily I say unto you, Till heaven and earth pass, one jot or one tittle shall in no wise pass from the law, till all be fulfilled."],["19","Whosoever therefore shall break one of these least commandments, and shall teach men so, he shall be called the least in the kingdom of heaven: but whosoever shall do and teach them, the same shall be called great in the kingdom of heaven."],["20","For I say unto you, That except your righteousness shall exceed the righteousness of the scribes and Pharisees, ye shall in no case enter into the kingdom of heaven."]]},"Matthew 5:23–24":{"c":"5","items":[["23","Therefore if thou bring thy gift to the altar, and there rememberest that thy brother hath ought against thee;"],["24","Leave there thy gift before the altar, and go thy way; first be reconciled to thy brother, and then come and offer thy gift."]]},"Matthew 5:33–37":{"c":"5","items":[["33","Again, ye have heard that it hath been said by them of old time, Thou shalt not forswear thyself, but shalt perform unto the Lord thine oaths:"],["34","But I say unto you, Swear not at all; neither by heaven; for it is God’s throne:"],["35","Nor by the earth; for it is his footstool: neither by Jerusalem; for it is the city of the great King."],["36","Neither shalt thou swear by thy head, because thou canst not make one hair white or black."],["37","But let your communication be, Yea, yea; Nay, nay: for whatsoever is more than these cometh of evil."]]},"Matthew 5:38–39":{"c":"5","items":[["38","Ye have heard that it hath been said, An eye for an eye, and a tooth for a tooth:"],["39","But I say unto you, That ye resist not evil: but whosoever shall smite thee on thy right cheek, turn to him the other also."]]},"Matthew 5:38–48":{"c":"5","items":[["38","Ye have heard that it hath been said, An eye for an eye, and a tooth for a tooth:"],["39","But I say unto you, That ye resist not evil: but whosoever shall smite thee on thy right cheek, turn to him the other also."],["40","And if any man will sue thee at the law, and take away thy coat, let him have thy cloak also."],["41","And whosoever shall compel thee to go a mile, go with him twain."],["42","Give to him that asketh thee, and from him that would borrow of thee turn not thou away."],["43","Ye have heard that it hath been said, Thou shalt love thy neighbour, and hate thine enemy."],["44","But I say unto you, Love your enemies, bless them that curse you, do good to them that hate you, and pray for them which despitefully use you, and persecute you;"],["45","That ye may be the children of your Father which is in heaven: for he maketh his sun to rise on the evil and on the good, and sendeth rain on the just and on the unjust."],["46","For if ye love them which love you, what reward have ye? do not even the publicans the same?"],["47","And if ye salute your brethren only, what do ye more than others? do not even the publicans so?"],["48","Be ye therefore perfect, even as your Father which is in heaven is perfect."]]},"Matthew 5:48":{"c":"5","items":[["48","Be ye therefore perfect, even as your Father which is in heaven is perfect."]]},"Matthew 5:9":{"c":"5","items":[["9","Blessed are the peacemakers: for they shall be called the children of God."]]},"Matthew 6:11":{"c":"6","items":[["11","Give us this day our daily bread."]]},"Matthew 6:16–18":{"c":"6","items":[["16","Moreover when ye fast, be not, as the hypocrites, of a sad countenance: for they disfigure their faces, that they may appear unto men to fast. Verily I say unto you, They have their reward."],["17","But thou, when thou fastest, anoint thine head, and wash thy face;"],["18","That thou appear not unto men to fast, but unto thy Father which is in secret: and thy Father, which seeth in secret, shall reward thee openly."]]},"Matthew 6:19–21":{"c":"6","items":[["19","Lay not up for yourselves treasures upon earth, where moth and rust doth corrupt, and where thieves break through and steal:"],["20","But lay up for yourselves treasures in heaven, where neither moth nor rust doth corrupt, and where thieves do not break through nor steal:"],["21","For where your treasure is, there will your heart be also."]]},"Matthew 6:5–8":{"c":"6","items":[["5","And when thou prayest, thou shalt not be as the hypocrites are: for they love to pray standing in the synagogues and in the corners of the streets, that they may be seen of men. Verily I say unto you, They have their reward."],["6","But thou, when thou prayest, enter into thy closet, and when thou hast shut thy door, pray to thy Father which is in secret; and thy Father which seeth in secret shall reward thee openly."],["7","But when ye pray, use not ":[["5","Let this mind be in you, which was also in Christ Jesus:"],["6","Who, being in the form of God, thought it not robbery to be equal with God:"],["7","But made himself of no reputation, and took upon him the form of a servant, and was made in the likeness of men:"],["8","And being found in fashion as a man, he humbled himself, and became obedient unto death, even the death of the cross."],["9","Wherefore God also hath highly exalted him, and given him a name which is above every name:"],["10","That at the name of Jesus every knee should bow, of things in heaven, and things in earth, and things under the earth;"],["11","And that every tongue should confess that Jesus Christ is Lord, to the glory of God the Father."]]},"Philippians 3:15–16":{"c":"3","items":[["15","Let us therefore, as many as be perfect, be thus minded: and if in any thing ye be otherwise minded, God shall reveal even this unto you."],["16","Nevertheless, whereto we have already attained, let us walk by the same rule, let us mind the same thing."]]},"Philippians 3:20":{"c":"3","items":[["20","For our conversation is in heaven; from whence also we look for the Saviour, the Lord Jesus Christ:"]]},"Philippians 4:11–13":{"c":"4","items":[["11","Not that I speak in respect of want: for I have learned, in whatsoever state I am, therewith to be content."],["12","I know both how to be abased, and I know how to abound: every where and in all things I am instructed both to be full and to be hungry, both to abound and to suffer need."],["13","I can do all things through Christ which strengtheneth me."]]},"Philippians 4:8":{"c":"4","items":[["8","Finally, brethren, whatsoever things are true, whatsoever things are honest, whatsoever things are just, whatsoever things are pure, whatsoever things are lovely, whatsoever things are of good report; if there be any virtue, and if there be any praise, think on these things."]]},"Proverbs 11:14":{"c":"11","items":[["14","Where no counsel is, the people fall: but mandments:"]]},"Psalm 82:3–4":{"c":"82","items":[["3","Defend the poor and fatherless: do justice to the afflicted and needy."],["4","Deliver the poor and needy: rid them out of the hand of the wicked."]]},"Psalm 92:1–2":{"c":"92","items":[["1","It is a good thing to give thanks unto the LORD, and to sing praises unto thy name, O most High:"],["2","To shew forth thy lovingkindness in the morning, and thy faithfulness every night,"]]},"Revelation 21:1–7":{"c":"21","items":[["1","And I saw a new heaven and a new earth: for the first heaven and the first earth were passed away; and there was no more sea."],["2","And I John saw the holy city, new Jerusalem, coming down from God out of heaven, prepared as a bride adorned for her husband."],["3","And I heard a great voice out of heaven saying, Behold, the tabernacle of God is with men, and he will dwell with them, and they shall be his people, and God himself shall be with them, and be their God."],["4","And God shall wipe away all tears from their eyes; and there shall be no more death, neither sorrow, nor crying, neither shall there be any more pain: for the former things are passed away."],["5","And he that sat upon the throne said, Behold, I make all things new. And he said unto me, Write: for these words are true and faithful."],["6","And he said unto me, It is done. I am Alpha and Omega, the beginning and the end. I will give unto him that is athirst of the fountain of the water of life freely."],["7","He that overcometh shall inherit all things; and I will be his God, and he shall be my son."]]},"Romans 10:9–10":{"c":"10","items":[["9","That if thou shalt confess with thy mouth the Lord Jesus, and shalt believe in thine heart that God hath raised him from the dead, thou shalt be saved."],["10","For with the heart man believeth unto righteousness; and with the mouth confession is made unto salvation."]]},"Romans 12:15":{"c":"12","items":[["15","Rejoice with them that do rejoice, and weep with them that weep."]]},"Romans 12:17–21":{"c":"12","items":[["17","Recompense to no man evil for evil. Provide things honest in the sight of all men."],["18","If it be possible, as much as lieth in you, live peaceably with all men."],["19","Dearly beloved, avenge not yourselves, but rather give place unto wrath: for it is written, Vengeance is mine; I will repay, saith the Lord."],["20","Therefore if thine enemy hunger, feed him; if he thirst, give him drink: for in so doing thou shalt heap coals of fire on his head."],["21","Be not overcome of evil, but overcome evil with good."]]},"Romans 12:19–21":{"c":"12","items":[["19","Dearly beloved, avenge not yourselves, but rather give place unto wrath: for it is written, Vengeance is mine; I will repay, saith the Lord."],["20","Therefore if thine enemy hunger, feed him; if he thirst, give him drink: for in so doing thou shalt heap coals of fire on his head."],["21","Be not overcome of evil, but overcome evil with good."]]},"Romans 12:1–2":{"c":"12","items":[["1","I beseech you therefore, brethren, by the mercies of God, that ye present your bodies a living sacrifice, holy, acceptable unto God, which is your reasonable service."],["2","And be not conformed to this world: but be ye transformed by the renewing of your mind, that ye may prove what is that good, and acceptable, and perfect, will of God."]]},"Romans 12:2":{"c":"12","items":[["2","And be not conformed to this world: but be ye transformed by the renewing of your mind, that ye may prove what is that good, and acceptable, and perfect, will of God."]]},"Romans 12:4–5":{"c":"12","items":[["4","For as we have many members in one body, and all members have not the same office:"],["5","So we, being many, are one body in Christ, and every one members one of another."]]},"Romans 13:1–7":{"c":"13","items":[["1","Let every soul be subject unto the higher powers. For there is no power but of God: the powers that be are ordained of God."],["2","Whosoever therefore resisteth the power, resisteth the ordinance of God: and they that resist shall receive to themselves damnation."],["3","For rulers are not a terror to good works, but to the evil. Wilt thou then not be afraid of the power? do that which is good, and thou shalt have praise of the same:"],["4","For he is the minister of God to thee for good. But if thou do that which is evil, be afraid; for he beareth not the sword in vain: for he is the minister of God, a revenger to execute wrath upon him that doeth evil."],["5","Wherefore ye must needs be subject, not only for wrath, but also for conscience sake."],["6","For for this cause pay ye tribute also: for they are God’s ministers, attending continually upon this very thing."],["7","Render therefore to all their dues: tribute to whom tribute is due; custom to whom custom; fear to whom fear; honour to whom honour."]]},"Romans 13:3–4":{"c":"13","items":[["3","For rulers are not a terror to good works, but to the evil. Wilt thou then not be afraid of the power? do that which is good, and thou shalt have praise of the same:"],["4","For he is the minister of God to thee for good. But if thou do that which is evil, be afraid; for he beareth not the sword in vain: for he is the minister of God, a revenger to execute wrath upon him that doeth evil."]]},"Romans 13:8":{"c":"13","items":[["8","Owe no man any thing, but to love one another: for he that loveth another hath fulfilled the law."]]},"Romans 14:1,4":{"c":"14","items":[["1","Him that is weak in the faith receive ye, but not to doubtful disputations."],["4","Who art thou that judgest another man’s servant? to his own master he standeth or falleth. Yea, he shall be holden up: for God is able to make him stand."]]},"Romans 14:10–12":{"c":"14","items":[["10","But why dost thou judge thy brother? or why dost thou set at nought thy brother? for we shall all stand before the judgment seat of Christ."],["11","For it is written, As I live, saith the Lord, every knee shall bow to me, and every tongue shall confess to God."],["12","So then every one of us shall give account of himself to God."]]},"Romans 14:1–4":{"c":"14","items":[["1","Him that is weak in the faith receive ye, but not to doubtful disputations."],["2","For one believeth that he may eat all things: another, who is weak, eateth herbs."],["3","Let not him that eateth despise him that eateth not; and let not him which eateth not judge him that eateth: for God hath received him."],["4","Who art thou that judgest another man’s servant? to his own master he standeth or falleth. Yea, he shall be holden up: for God is able to make him stand."]]},"Romans 14:4":{"c":"14","items":[["4","Who art thou that judgest another man’s servant? to his own master he standeth or falleth. Yea, he shall be holden up: for God is able to make him stand."]]},"Romans 14:4–5":{"c":"14","items":[["4","Who art thou that judgest another man’s servant? to his own master he standeth or falleth. Yea, he shall be holden up: for God is able to make him stand."],["5","One man esteemeth one day above another: another esteemeth every day alike. Let every man be fully persuaded in his own mind."]]},"Romans 14:5–6":{"c":"14","items":[["5","One man esteemeth one day above another: another esteemeth every day alike. Let every man be fully persuaded in his own mind."],["6","He that regardeth the day, regardeth it unto the Lord; and he that regardeth not the day, to the Lord he doth not regard it. He that eateth, eateth to the Lord, for he giveth God thanks; and he that eateth not, to the Lord he eateth not, and giveth God thanks."]]},"Romans 15:1–2":{"c":"15","items":[["1","We then that are strong ought to bear the infirmities of the weak, and not to please ourselves."],["2","Let every one of us please his neighbour for his good to edification."]]},"Romans 16:16":{"c":"16","items":[["16","Salute one another with an holy kiss. The churches of Christ salute you."]]},"Romans 3:23":{"c":"3","items":[["23","For all have sinned, and come short of the glory of God;"]]},"Romans 5:1":{"c":"5","items":[["1","Therefore being justified by faith, we have peace with God through our Lord Jesus Christ:"]]},"Romans 5:12":{"c":"5","items":[["12","Wherefore, as by one man sin entered into the world, and death by sin; and so death passed upon all men, for that all have sinned:"]]},"Romans 6:3–4":{"c":"6","items":[["3","Know ye not, that so many of us as were baptized into Jesus Christ were baptized into his death?"],["4","Therefore we are buried with him by baptism into death: that like as Christ was raised up from the dead by the glory of the Father, even so we also should walk in newness of life."]]},"Romans 8:1":{"c":"8","items":[["1","There is therefore now no condemnation to them which are in Christ Jesus, who walk not after the flesh, but after the Spirit."]]},"Romans 8:15":{"c":"8","items":[["15","For ye have not received the spirit of bondage again to fear; but ye have received the Spirit of adoption, whereby we cry, Abba, Father."]]},"Romans 8:16":{"c":"8","items":[["16","The Spirit itself beareth witness with our spirit, that we are the children of God:"]]},"Romans 8:26–27":{"c":"8","items":[["26","Likewise the Spirit also helpeth our infirmities: for we know not what we should pray for as we ought: but the Spirit itself maketh intercession for us with groanings which cannot be uttered."],["27","And he that searcheth the hearts knoweth what is the mind of the Spirit, because he maketh intercession for the saints according to the will of God."]]},"Titus 2:3–5":{"c":"2","items":[["3","The aged women likewise, that they be in behaviour as becometh holiness, not false accusers, not given to much wine, teachers of good things;"],["4","That they may teach the young women to be sober, to love their husbands, to love their children,"],["5","To be discreet, chaste, keepers at home, good, obedient to their own husbands, that the word of God be not blasphemed."]]},"Titus 3:10":{"c":"3","items":[["10","A man that is an heretick after the first and second admonition reject;"]]},"Titus 3:4–7":{"c":"3","items":[["4","But after that the kindness and love of God our Saviour toward man appeared,"],["5","Not by works of righteousness which we have done, but according to his mercy he saved us, by the washing of regeneration, and renewing of the Holy Ghost;"],["6","Which he shed on us abundantly through Jesus Christ our Saviour;"],["7","That being justified by his grace, we should be made heirs according to the hope of eternal life."]]},"Titus 3:5":{"c":"3","items":[["5","Not by works of righteousness which we have done, but according to his mercy he saved us, by the washing of regeneration, and renewing of the Holy Ghost;"]]}};

const FAITH = {
  name: "The Way of Christ",
  descriptor: "a plain, Anabaptist rule of life",
  epigraph: {
    text: "Ask for the old paths, where is the good way, and walk therein, and ye shall find rest for your souls.",
    ref: "Jeremiah 6:16"
  },
  preface: {
    id:"preface", front:true, no:"", name:"Preface",
    tag:"what this is, and where it comes from",
    content:[
      {type:"p",text:"This work was not invented. It was received, and set down."},
      {type:"p",text:"Five hundred years ago, in the years after the Reformation, our fathers and mothers in the faith held that the Reformers had not gone far enough. To follow Christ, they said, was not to be born into a church kept by the sword of the state, but to be joined to him by faith, baptized upon one's own confession, and gathered out of the world into a company that lived by his teaching and his cross. They would not swear, nor kill, nor lord it over one another, and for this they were hunted, drowned, and burned, by Catholic and Protestant alike. Still the stream ran on, plain and yielded, down to our own day."},
      {type:"refs",text:"see “[[together|Of gathering a company]],” Part VI"},
      {type:"p",text:"We did not begin that stream; we are late to it, and small. This work is what came of one household, in an age of noise and haste, asking for the old paths — wishing to follow Christ with an undivided life, and to raise children under his Lordship. So we have set the old way down, whole, as a rule we ourselves could live by."},
      {type:"p",text:"It is no new gospel, and those who wrote it claim no vision and no authority of their own. What is faithful in it is borrowed — from the Scriptures first, and from the witnesses who paid for it. What is unfaithful is ours; let it be corrected by the Word and by the church."},
      {type:"refs",text:"Jeremiah 6:16  ·  1 Corinthians 3:11  ·  Jude 1:3"},
      {type:"p",text:"It is written plainly, and left open. Whoever is drawn by it did not come by our persuading; he was called by the same Lord who called us. Let him read, and prove it against the Scriptures, and if it is true, walk in it."},
      {type:"refs",text:"1 Thessalonians 5:21  ·  John 6:44"}
    ]
  },
  parts: [
    { id:"foundations", no:"i", name:"Foundations",
      tag:"what this way is, and how it is held",
      content:[
        {type:"p",text:"This is a rule of life: a way of following Christ, ordered and shared. It is not a new gospel but an old obedience — to live simply, plainly, and together, under the Scriptures and the Lordship of Jesus. It stands in the Anabaptist stream: the free company of believers, baptized upon confession, refusing the sword and the oath, gathered out of the world. We take from that tradition what is faithful to Christ, and with its witnesses we answer to him alone."},
        {type:"h",text:"Of this way",short:"This way"},
        {type:"p",text:"This way exists so that a people might live the whole of life as disciples — not faith kept for an hour and the world kept for the rest, but one undivided life, simple and shared. We are gathered to be a people, set apart to God and joined to one another."},
        {type:"refs",text:"Acts 2:42–47  ·  Galatians 6:2  ·  1 Peter 2:9"},
        {type:"p",text:"At its heart is plainness: simplicity in how we live, dress, speak, and want. Plainness is first inward, a heart unadorned and content, and only then outward. It is the freedom of wanting little, so that what we have and who we are may be freely given away."},
        {type:"refs",text:"Romans 12:2  ·  1 Peter 3:3–4  ·  Matthew 6:19–21"},
        {type:"p",text:"We walk this way for love. We are drawn by the mercy of God, who loved us first; the dread of punishment may govern a slave, but it cannot make a son, and perfect love casteth out fear. So we hold one another by love, and not by fear — not by hell held over the head, nor by the threat of the shunning, nor by the frown of men. Where a people is kept by fear, the gospel has been turned upside down."},
        {type:"refs",text:"1 John 4:18–19  ·  Romans 8:15  ·  2 Timothy 1:7"},
        {type:"p",text:"There is a fear we keep: the reverence of a child before a Father greatly loved, which is the beginning of wisdom. We teach our children to flee sin because it grieves God, wounds the neighbor, and mars the soul. And though a living faith may yet be lost, that warning is spoken as a gardener speaks, not as a jailer; for we are kept by the power of God, and the love that warns us also holds us."},
        {type:"refs",text:"Proverbs 9:10  ·  1 John 4:10  ·  1 Peter 1:5"},
        {type:"p",text:"What one keeps alone is habit; what a people keep together is a way."},
        {type:"h",text:"Of separation from the world",short:"Separation"},
        {type:"p",text:"Because we are not our own but Christ's, we are not conformed to the world. We are a people visibly set apart, known, if known at all, as belonging to another Kingdom. This apartness is no costume over an ordinary heart; where the heart is not first yielded, the outward sign is empty."},
        {type:"refs",text:"Romans 12:2  ·  2 Corinthians 6:14–17  ·  John 17:14–16"},
        {type:"p",text:"We are set apart in obedience, not in strategy: not to be seen by the world, nor to flee it, but because Christ calls his own to a narrow way. And we hold those outside in love, for Christ prayed not that his own be taken out of the world, but kept from its evil."},
        {type:"refs",text:"John 17:15  ·  Matthew 7:13–14  ·  1 Peter 2:11"},
        {type:"p",text:"This separation takes visible form in dress, in a guarded use of tools and media, in our stance toward the powers of the state, and in the raising of our children. In each, the standard is set by the church and held as a sign of the heart, never as the heart itself. The particulars belong to [[rule|the Rule of Life]] and to [[powers|Peace and the Powers]]."},
        {type:"refs",text:"1 Peter 3:3–4  ·  Matthew 5:33–37  ·  Deuteronomy 6:6–7"},
        {type:"h",text:"Of the Scriptures, and of honest questions",short:"Scripture"},
        {type:"p",text:"The Scriptures are our final authority, sufficient, and standing over every human opinion. They are read toward Christ: his life and teaching are the key to the whole, and where the plain word of Jesus speaks, it governs the rest."},
        {type:"refs",text:"2 Timothy 3:16–17  ·  Hebrews 1:1–2  ·  1 Peter 2:21"},
        {type:"p",text:"His hardest commands — resist not evil, swear not at all — we hold as binding, to be pursued without reserve: not a bare law that outward compliance could satisfy, nor counsel we may lay aside. We plead no necessity against them. Where any of us falls short of them, it is not excused beforehand, but confessed afterward as sin."},
        {type:"refs",text:"Matthew 5:17–20  ·  Matthew 5:48  ·  James 5:12"},
        {type:"p",text:"The Word is read together, not privately. No one of us is the lone interpreter; the church discerns its meaning as one body, weighing and consenting together."},
        {type:"refs",text:"2 Peter 1:20  ·  Matthew 18:15–20  ·  Acts 15  ·  1 Corinthians 14:29"},
        {type:"p",text:"A question is never a sin, and doubt is often the road to faith. We do not shame the one who asks, nor count the doubter a rebel. Job cried out against heaven and was vindicated over friends with easy answers; Thomas would not believe till he had seen, and Christ showed him his hands; and the man who prayed, Lord, I believe, help thou mine unbelief, was heard."},
        {type:"refs",text:"Job 42:7  ·  John 20:27–28  ·  Mark 9:24"},
        {type:"p",text:"So we search the Scriptures to see whether these things be so, and stand ready to give a reason for the hope that is in us. Where we have answers, we give them freely and without anger; where we have none, we say so. We would rather a soul doubt honestly among us than believe falsely. This welcome is the seeker's right, and it is never turned into a rod against him. The trouble is never the hard question, but the scornful heart that asks only to tear; him we admonish as a brother. And the burden falls first upon us who answer: to hear before we speak, and never to mistake our own discomfort for his sin."},
        {type:"refs",text:"Acts 17:11  ·  1 Peter 3:15  ·  James 1:19  ·  Titus 3:10"},
        {type:"h",text:"Of what may change, and what may not",short:"What may change"},
        {type:"p",text:"Not all that we hold is held in the same way, and a people is spared much strife when it can tell the difference."},
        {type:"p",text:"First is the gospel, and the faith set down in [[confession|the Confession]]. This is the ground, and it does not change — not with the age, nor with our wishes. Here we are wholly one with every soul in every age who has truly called upon Christ."},
        {type:"refs",text:"Jude 1:3  ·  Galatians 1:8–9  ·  1 Corinthians 3:11"},
        {type:"p",text:"Second are the convictions of this way: peace and the refusal of the sword, plainness, separation from the world, baptism upon confession, the shared and yielded life, and the ordinances. These are the shape of our covenant, and we hold them firmly against the world's urging and our own weariness. Yet we hold them as our own calling, never as the measure of another's salvation."},
        {type:"refs",text:"John 14:15  ·  Romans 14:4–5  ·  Philippians 3:15–16"},
        {type:"p",text:"Third are the forms and customs: the cut of our dress, the fashion of the covering, the bounds on our tools, the ordering of our schools and our feast-days. These clothe the convictions but are not the convictions, and the church may alter them as wisdom and the age require. We make none of them a test of fellowship. He that keeps a custom and he that must vary it are brethren still, and neither is to judge the other."},
        {type:"refs",text:"Romans 14:1–4  ·  Colossians 2:16–17  ·  Mark 7:8–9"},
        {type:"p",text:"So we guard against the two deaths of a people: the slow death, in which the ground is given up little by little until only a name is left; and the sudden death, in which the body is torn apart over a bonnet or a boundary that was never the gospel. In the gospel, unity; in our convictions, faithfulness; in customs, forbearance; in all things, charity."},
        {type:"refs",text:"Ephesians 4:1–3  ·  2 Thessalonians 2:15  ·  Colossians 3:14"},
        {type:"h",text:"Of other believers",short:"Other believers"},
        {type:"p",text:"We are not the whole of Christ's church, nor the only door to him. Wherever there is true faith in Christ and a heart turned to follow him, there is a brother and a sister, though they have never heard of this way. We keep our own table and shared life, for these belong to our covenant; but this is no verdict upon another's soul, and whom Christ has received, we receive as his."},
        {type:"refs",text:"John 10:16  ·  Romans 14:4  ·  Mark 9:38–40"},
        {type:"p",text:"We hold this way as our own calling to a plainer obedience, in fear and not in pride. To his own Master each servant stands or falls; we keep what we have been given, and leave the judging to God."},
        {type:"refs",text:"Romans 14:10–12  ·  Luke 18:11–14"},
        {type:"h",text:"Of beginning, and of the household alone",short:"Beginning"},
        {type:"p",text:"This way is pressed upon no one; whoever is drawn may simply begin, and the beginning asks no community and no leave. A household alone may keep even now: morning and evening worship in the home, thanks at every meal, and prayer in secret; the Lord's Day kept holy; plainness in dress, in the covering, in what it owns, and in its tools; children raised in the way; the gospel feasts marked plainly, and fasting when there is need; honest work, a neighbor's burden borne, and an open hand. And let each give himself inwardly to Christ, and to this way, before God."},
        {type:"refs",text:"James 1:22  ·  Joshua 24:15  ·  Deuteronomy 6:6–7"},
        {type:"p",text:"But this life was never meant to be kept alone. [[ordinances|Baptism, the Supper, and the washing of feet]], [[together|the ministry]], and the church's shared discernment await a people. So while you walk faithfully where you are, seek a company of this way; where none is found, gather the two or three with whom one may begin, or wait and pray until Christ provides them. The beginning can be kept alone; the fullness awaits a people."},
        {type:"refs",text:"Hebrews 10:24–25  ·  Ecclesiastes 4:9–12  ·  Matthew 18:20"}
      ] },
    { id:"confession", no:"ii", name:"The Confession",
      tag:"what is believed",
      content:[
        {type:"p",text:"This is what we believe, held plainly and together. It is not the ground of our salvation, which is Christ, but the shared confession of a people who follow him."},
        {type:"h",text:"I.  Of God",short:"God"},
        {type:"p",text:"We believe in one God, eternal and unchanging, who is Father, Son, and Holy Spirit — three persons in one Being, maker of heaven and earth and of all things seen and unseen. To him alone belong our worship and our whole allegiance."},
        {type:"refs",text:"Deuteronomy 6:4  ·  Matthew 28:19  ·  Genesis 1:1"},
        {type:"h",text:"II.  Of Jesus Christ",short:"Christ"},
        {type:"p",text:"We believe in Jesus Christ, the eternal Son, true God and true man: conceived of the Holy Spirit, born of Mary, who lived without sin, taught the way of the Kingdom, was crucified for our sins, rose bodily from the dead, ascended to the Father, and shall come again to judge the living and the dead. He is both our Savior and our pattern: we are saved by him, and we follow him."},
        {type:"refs",text:"John 1:1–14  ·  1 Corinthians 15:3–4  ·  Philippians 2:5–11  ·  1 Peter 2:21–24  ·  John 13:15  ·  Matthew 5–7"},
        {type:"h",text:"III.  Of the Holy Spirit",short:"Spirit"},
        {type:"p",text:"We believe in the Holy Spirit, God with us and within us, who convicts of sin, gives the new birth, dwells in the believer and the church, and leads the gathered people into the truth of the Word. The life we are called to is beyond our own strength; it is his work in us."},
        {type:"refs",text:"John 16:8,13  ·  Titus 3:5  ·  Galatians 5:22–25"},
        {type:"h",text:"IV.  Of the Scriptures",short:"Scriptures"},
        {type:"p",text:"We believe the Scriptures to be the Word of God, our final authority, sufficient for faith and life. They are read toward Christ, in whom they find their center, and discerned together by the church, never bent to private will."},
        {type:"refs",text:"2 Timothy 3:16–17  ·  2 Peter 1:20–21  ·  Hebrews 1:1–2  ·  Isaiah 40:8  ·  John 17:17"},
        {type:"h",text:"V.  Of man and sin",short:"Man and sin"},
        {type:"p",text:"We believe man was made in God's image and for his fellowship, and made good; but that turning from God he fell into sin, and all have sinned and come short of the glory of God. Of ourselves we cannot mend what sin has broken; we stand in need of grace."},
        {type:"refs",text:"Genesis 1:27  ·  Romans 3:23  ·  Romans 5:12"},
        {type:"h",text:"VI.  Of salvation",short:"Salvation"},
        {type:"p",text:"We believe salvation is the gift of God, by his grace, received through faith in Christ, and never earned by any work or merit of our own. The rule of our life is never the price of it, and our assurance rests upon Christ, not upon our own record."},
        {type:"refs",text:"Ephesians 2:8–10  ·  Titus 3:4–7  ·  Romans 5:1  ·  John 3:3–7"},
        {type:"p",text:"Yet the faith that saves is a living faith, which follows Christ; a faith that will not follow him is dead, and saves no one. So grace is never cheap, and the obedient life is the fruit and evidence of true faith, never its purchase."},
        {type:"refs",text:"James 2:14–26  ·  Luke 9:23  ·  John 14:15"},
        {type:"p",text:"This assurance is real, and may be known; it rests not upon the strength of our faith but upon the finished work of the Lord. It is held humbly, in godly fear, and never turned into presumption — let him that thinketh he standeth take heed lest he fall."},
        {type:"refs",text:"1 John 5:13  ·  Romans 8:16  ·  1 Corinthians 10:12"},
        {type:"p",text:"For it is possible to fall away — not by the daily stumbling of a heart that grieves its sin and returns, for such a one is forgiven seventy times seven, but by the settled turning-away: the deliberate abandoning of Christ and his way, and the return to the world without repentance. Therefore we neither despair at every fault nor presume upon grace, but abide in Christ and help one another to the end — assured, yet watchful; at rest, yet not asleep."},
        {type:"refs",text:"Hebrews 10:26–29  ·  John 15:5–6  ·  Matthew 18:21–22"},
        {type:"h",text:"VII.  Of the church",short:"Church"},
        {type:"p",text:"We believe the church is the body of Christ: not a nation nor a building, but a people gathered out of the world by grace and joined to one another in a voluntary, committed fellowship. None is born into it; each enters by his own confession and yielding. To it Christ has given a ministry chosen from among the people, and a discipline exercised in love, whose aim is never punishment but restoration; its order is set forth in [[together|Life Together]]."},
        {type:"refs",text:"1 Corinthians 12:12–27  ·  1 Peter 2:9–10  ·  Acts 2:41–47  ·  Matthew 18:15–20  ·  1 Peter 5:1–3"},
        {type:"h",text:"VIII.  Of baptism",short:"Baptism"},
        {type:"p",text:"We believe baptism is for those who, hearing the gospel, repent and confess faith in Christ of their own will — and for these alone. We do not baptize infants, who cannot yet believe. Baptism is the sign of a faith already received and a life given over to Christ and his people: a burial of the old life and a rising to the new."},
        {type:"refs",text:"Acts 2:38  ·  Acts 8:36–37  ·  Romans 6:3–4"},
        {type:"h",text:"IX.  Of the Lord's Supper",short:"Supper"},
        {type:"p",text:"We believe the Lord's Supper is the holy remembrance of Christ's body broken and his blood shed for us, kept in thanksgiving until he comes. In the one bread we are shown to be one body, and we come to the table having first made peace with God and with one another."},
        {type:"refs",text:"1 Corinthians 11:23–26  ·  1 Corinthians 10:16–17"},
        {type:"h",text:"X.  Of the new life",short:"New life"},
        {type:"p",text:"We believe those who are Christ's are made new, and walk in holiness, love, and lowliness of heart. This new life bears the marks named in this way: plainness, separation from the world, peace and nonresistance, truthfulness without oaths, and the bearing of one another's burdens. It is not conformity to the world, but conformity to Christ."},
        {type:"refs",text:"Romans 12:1–2  ·  Galatians 5:24–25  ·  1 John 2:6  ·  1 John 2:15–17  ·  1 Timothy 6:6–10  ·  Philippians 4:11–13"},
        {type:"h",text:"XI.  Of peace and the sword",short:"Peace"},
        {type:"p",text:"We believe the way of Christ is the way of peace. We love our enemies, bless them that curse us, and overcome evil with good; we swear not at all, but let our yea be yea and our nay, nay. We defend the helpless with our own bodies and with all that love can do, laying no hand of force upon the aggressor; and we take no human life — not in vengeance, not to save our own, not for the state, nor in the wars of the nations. We follow the Lamb, who when he was reviled, reviled not again."},
        {type:"refs",text:"Matthew 5:38–48  ·  Romans 12:17–21  ·  Matthew 26:52  ·  1 Peter 2:21–23  ·  Isaiah 11:6–9"},
        {type:"h",text:"XII.  Of the last things",short:"Last things"},
        {type:"p",text:"We believe Christ will come again in glory; that the dead shall be raised; that all shall stand before God to be judged; and that there is a life everlasting with him for those who are his. In this hope we live, holding the things of this world lightly, and setting our hearts on the world to come."},
        {type:"refs",text:"1 Thessalonians 4:13–18  ·  2 Corinthians 5:1–10  ·  Revelation 21:1–7  ·  Hebrews 4:9–11  ·  1 Peter 1:3–5"}
      ] },
    { id:"powers", no:"iii", name:"Peace and the Powers",
      tag:"the state, the oath, and the sword",
      content:[
        {type:"h",text:"Of the governing powers",short:"The powers"},
        {type:"p",text:"We honor the governing powers as ordained of God for the order of the world; we obey the laws, pay what is owed, and pray for those who rule. But our first allegiance is to Christ and his Kingdom, and where the two are set against each other, we obey God rather than men."},
        {type:"refs",text:"Romans 13:1–7  ·  1 Timothy 2:1–2  ·  Acts 5:29"},
        {type:"p",text:"In the world's government we take no part. We do not vote, nor seek place in its contests, nor bear its offices; these entangle the brethren in the strife of parties and the pursuit of power, and every office of the world rests at last upon the sword. We serve our neighbor freely, but not as the world's magistrates."},
        {type:"refs",text:"Matthew 20:25–28  ·  John 18:36  ·  Romans 13:3–4"},
        {type:"h",text:"Of the oath",short:"The oath"},
        {type:"p",text:"The oath we do not swear. Our yes is yes and our no is no; we will not set some words above our ordinary truthfulness, nor call God to witness what our plain word should already bear. Where the law requires it, we affirm rather than swear."},
        {type:"refs",text:"Matthew 5:33–37  ·  James 5:12"},
        {type:"h",text:"Of the sword",short:"The sword"},
        {type:"p",text:"The sword — as vengeance, as the soldier's trade, as the saving of our own life by the shedding of another's — we lay down altogether. We do not kill, and by grace we would die before we killed; for they that take the sword shall perish with the sword, and the servants of a kingdom not of this world do not fight. Aggression, the wars of the nations, and the taking of life for the state we refuse without exception."},
        {type:"refs",text:"Matthew 26:52  ·  John 18:36  ·  Matthew 5:38–39  ·  Isaiah 2:4"},
        {type:"p",text:"Laying down the sword, we do not lay down the shepherd's care. Against the beast, the fire, and the flood we labor with all our strength to save; and when the wolf is a man, we do not stand and watch the innocent perish. We put ourselves between the strong and the weak: we shield them with our own bodies, bear the blow, carry the helpless away, and do all that love can do to deliver them out of the hand of the wicked. But upon the aggressor we lay no hand of force. The shepherd who flees and leaves the flock is no shepherd, but a hireling."},
        {type:"refs",text:"Psalm 82:3–4  ·  Proverbs 24:11–12  ·  John 10:11–12"},
        {type:"p",text:"Least of all will we take the aggressor's life. Where the innocent cannot be saved but by killing, we give our own life rather than his, and commit the rest to God — as our forebears did, who turned back upon the ice to draw out the man who hunted them. The aggressor also is a soul for whom Christ died."},
        {type:"refs",text:"John 15:13  ·  Romans 12:19–21  ·  1 Peter 2:21–23"},
        {type:"p",text:"If a man in that dark moment cannot rise to this, and strikes the attacker down to save his child, we do not name it his right. He has taken a life, and he is put out, as for any grave sin, until he has confessed it before the church as sin and is restored. We grieve with him and bear him up through it, and when he repents he is received again with joy."},
        {type:"refs",text:"Galatians 6:1–2  ·  Luke 15:20"},
        {type:"p",text:"We keep this hard word not because the wolf is unreal, but because we follow the Lamb, and wait for the day when the wolf shall dwell with the lamb, and they shall not hurt nor destroy in all his holy mountain."},
        {type:"refs",text:"Isaiah 11:6–9  ·  Matthew 5:9"},
        {type:"h",text:"Of the church and the nations",short:"The nations"},
        {type:"p",text:"The church is the chaplain of no party and no country: she does not bless their banners, nor baptize their causes, nor hang their flags where Christ alone is Lord. We love the land we dwell in, seek its peace, and pray for it, but we do not confuse it with the Kingdom. Our commonwealth is in heaven, and among every earthly people we are sojourners and strangers."},
        {type:"refs",text:"Philippians 3:20  ·  1 Peter 2:11  ·  Matthew 22:21"},
        {type:"p",text:"So the church is neither a soldier for one side in the world's quarrels nor the ornament of any ruler. When a power takes up the name of Christ to gather men to itself, we are not deceived; for our Lord, when they would have made him a king by force, withdrew. Some trust in chariots, and some in horses: but we will remember the name of the Lord our God."},
        {type:"refs",text:"John 6:15  ·  Psalm 146:3  ·  Psalm 20:7"}
      ] },
    { id:"rule", no:"iv", name:"The Rule of Life",
      tag:"the standing order of our days",
      content:[
        {type:"p",text:"The Rule of Life is the plain shape of our days. It is not the ground of our hope, which is Christ alone, but the ordered form of a life yielded to him. It is set by the church and held with an inward heart, never mistaken for the faith itself."},
        {type:"h",text:"Of dress",short:"Dress"},
        {type:"p",text:"We dress plainly, that the body not be adorned to the world's eye, nor one set above another: a people known by their simplicity, wearing no uniform, though not made identical. We wear no ornament — no jewelry, not even the wedding band, for the covenant is worn in the life and not upon the hand; no cosmetics; and no costly or showy array. Our garments are of subdued color and simple cut, drawing no eye and making no boast."},
        {type:"refs",text:"1 Timothy 2:9–10  ·  1 Peter 3:3–4  ·  Genesis 35:2–4"},
        {type:"p",text:"Men and women keep the plainness proper to each, not blurring the distinction God set between them. The woman covers her head, and wears the covering continually, as a sign before God, who may be sought in prayer at any hour; her dress is modest and plain. The man wears no necktie and nothing for display; the beard is left to conscience."},
        {type:"refs",text:"1 Corinthians 11:2–16  ·  Deuteronomy 22:5  ·  1 Thessalonians 5:17"},
        {type:"p",text:"The body is God's good work, and not a thing of shame. Our modesty is the humility of the whole people, of the men no less than the women; it is not a burden laid upon our daughters to bear for the eyes of others, and no girl among us is taught to carry shame for another's desire. In all of this the inward comes first, and plain dress is fitting only as the sign of a heart truly yielded. What God hath called good, we will not call unclean."},
        {type:"refs",text:"Genesis 1:31  ·  Psalm 139:14  ·  1 Samuel 16:7"},
        {type:"h",text:"Of tools and media",short:"Tools"},
        {type:"p",text:"We do not ask of a tool whether it is old or new, but what it does to us. The church weighs every tool by three questions: does it serve the household and the congregation, or corrode them? how far does it bind us to the world and its noise? is it needful, or only convenience and indulgence? A thing may be lawful and still not build us up."},
        {type:"refs",text:"1 Corinthians 10:23  ·  1 Corinthians 6:12"},
        {type:"p",text:"The tools that carry the world's voice into the home we bind closely. We keep no personal devices given over to endless connection; where the telephone and the internet are needed for work, for commerce, or for the care of one another, they are used plainly and in common, as servants and not companions. We keep no social media, and no screen for entertainment."},
        {type:"refs",text:"Psalm 101:3  ·  1 John 2:15–16  ·  Philippians 4:8"},
        {type:"p",text:"The conveniences of the age we weigh by the same test, and we watch most closely those that would loosen our need for one another or quicken life past the pace of presence. A thing may carry no voice of the world at all, and still scatter a people. We keep our material life simple, and share what may be shared."},
