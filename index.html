                    "The weekly rhythm",
                    "Disciplines kept, and how"] },
    { id:"practices", no:"v",     name:"Practices & Ordinances",
      tag:"the observable acts of the faith",
      content:[
        {type:"p",text:"These are the visible acts of the faith — the signs and practices Christ gave his church, kept plainly and in their season. Baptism, by which one enters, is confessed already in the Confession; its rite we set down here, with the practices of the gathered life."},
        {type:"h",text:"Of baptism and the vow"},
        {type:"p",text:"None is baptized in haste. Before the water there is a season of teaching, in which the seeker is instructed in this confession and this way, and the cost of it set plainly before him — for he is not to promise what he has not counted. Then he is examined by the church: whether he believes, whether he repents, and whether he comes freely and of his own heart."},
        {type:"refs",text:"Luke 14:27–28  ·  Acts 8:30–38  ·  Matthew 28:19–20"},
        {type:"p",text:"The choice must be free, or it is nothing. We baptize none by pressure, nor by the mere expectation of kin; and our own children, raised in the way, are told plainly, when the time comes, that they are free to decline — and that if they do, they are loved still, and not cast out. A vow not freely given is no vow at all."},
        {type:"refs",text:"Joshua 24:15  ·  Psalm 110:3  ·  1 Peter 3:21"},
        {type:"p",text:"At the water the candidate confesses his faith and makes his vow before God and the church: to trust and follow Christ, forsaking his sins; to obey Christ's teaching as the rule of his life; and to walk with this people — teachable, accountable, open to their loving admonition, as they to his. So he binds himself not to a set of rules for his salvation, but to a shared life under Christ."},
        {type:"refs",text:"Romans 10:9–10  ·  Acts 2:38  ·  Acts 2:41–42"},
        {type:"p",text:"Then water is poured upon his head, in the name of the Father, and of the Son, and of the Holy Spirit — the sign of sins washed away and of the Spirit poured out upon him, a burial of the old life and a rising to the new. So he is received, a member among the members, into the body of Christ."},
        {type:"refs",text:"Acts 2:17–18  ·  Titus 3:5–6  ·  Romans 6:3–4"},
        {type:"h",text:"Of worship"},
        {type:"p",text:"We gather to worship in our homes, in turn — one household opening its doors, and then another — that the church be a family and not a fixture. Our worship is plain: the Word read and preached, prayer, and the singing of the whole body in unison and unaccompanied, no instrument and no performance, but one voice lifted together. We come to give God his due and to be fed, not to be entertained."},
        {type:"refs",text:"Acts 2:46  ·  Colossians 3:16  ·  1 Corinthians 14:26"},
        {type:"h",text:"Of the Lord's Supper"},
        {type:"p",text:"Twice in the year we keep the Lord's Supper, and not lightly. It is preceded by a service of preparation, in which the church searches itself and makes peace — brother with brother, and each with God — that none come to the table with a quarrel unhealed or a sin unconfessed. The table is close: shared by the members of the body, at peace and in good standing, who thereby show themselves one bread and one body."},
        {type:"refs",text:"1 Corinthians 11:27–29  ·  Matthew 5:23–24  ·  1 Corinthians 10:17"},
        {type:"p",text:"With the Supper we wash one another's feet, as our Lord washed his disciples' and commanded that we do likewise. In it the greater stoops to the lesser and the lesser to the greater, and all pride is laid down: the sign that among us there is no lord but Christ, and that we are servants to one another."},
        {type:"refs",text:"John 13:4–15  ·  1 Timothy 5:10"},
        {type:"h",text:"Of the holy kiss and the anointing"},
        {type:"p",text:"We greet one another with the holy kiss — brother to brother, sister to sister — as the sign of a love unfeigned and a peace held in common. And when one among us is sick, the elders are called to pray over him and to anoint him with oil in the name of the Lord, that the prayer of faith may raise him up, committing him, in life or in death, into the hands of God."},
        {type:"refs",text:"Romans 16:16  ·  James 5:14–15"},
        {type:"h",text:"Of marriage and the household"},
        {type:"p",text:"Marriage is a covenant made before God, between one man and one woman, for the whole of life. A member marries within the faith, that two who are one in Christ may be one also in the home, and not unequally yoked. Weddings among us are plain and glad, kept within the church, without display."},
        {type:"refs",text:"Genesis 2:24  ·  Matthew 19:4–6  ·  2 Corinthians 6:14"},
        {type:"p",text:"What God has joined, man is not to put asunder. We do not divorce and marry again; the covenant holds while both yet live. Where one is in danger, we do not bind them to remain in harm — separation for safety is always allowed, and the church stands with the wronged and the endangered; yet even then the door to reconciliation is kept, and remarriage is not sought while the other lives."},
        {type:"refs",text:"Matthew 19:6  ·  Mark 10:9  ·  1 Corinthians 7:10–11"},
        {type:"p",text:"In the household there is an order, but it is the order of the cross. The husband is head as Christ is head of the church — which is to say, he lays himself down, bearing the greater weight of sacrifice and service; his headship is no right to rule, but a call to serve first and most. The wife yields to him in the same love, freely and never by compulsion. Each submits to the other in the fear of Christ, and together they submit to him."},
        {type:"refs",text:"Ephesians 5:21–33  ·  Philippians 2:3–8  ·  1 Peter 3:7"},
        {type:"h",text:"Of death and burial"},
        {type:"p",text:"We meet death in hope, and not as those who have none, for Christ is risen and has swallowed up death in victory. When one of us is dying, the church gathers to pray and to commit him into the hands of God; and when he is gone, we grieve truly — yet as those who wait for the resurrection, and the day when the dead in Christ shall rise."},
        {type:"refs",text:"1 Thessalonians 4:13–14  ·  1 Corinthians 15:54–57  ·  John 11:25–26"},
        {type:"p",text:"The body we return plainly to the earth, dust to dust — a simple coffin made by the brethren's own hands, and a swift, unadorned burial in the ground. The whole company bears it: the grave is dug by friends, the meal is made, the family left to carry none of it alone."},
        {type:"refs",text:"Genesis 3:19  ·  Ecclesiastes 12:7  ·  Galatians 6:2"},
        {type:"p",text:"Our graves are marked all alike — plain and modest stones, without monument or grandeur, that in death as in life none be exalted above another, and the small and the great lie down together. Yet each stone bears its name and its years, that none among us be forgotten; for the Lord calls his own by name."},
        {type:"refs",text:"Job 3:19  ·  1 Timothy 6:7  ·  Isaiah 43:1"},
        {type:"p",text:"The funeral is not for the praise of the dead, but for the good of the living. There is no eulogy, no exalting of the one who has gone; the same plain service is kept over every soul. The Word is preached, the resurrection set forth, and the living called to lay it to heart and to be ready. Yet we give thanks — not to flatter the departed, but to bless the God who gave the life and wrought what grace it bore: the Lord gave, and the Lord has taken away; blessed be his name."},
        {type:"refs",text:"Ecclesiastes 7:2  ·  Psalm 90:12  ·  Job 1:21"},
        {type:"p",text:"And we mourn together. Grief is neither hidden nor hurried, yet neither is it worn for show — no display, only honest sorrow held in hope. Through the season of a family's grief the whole church bears them up, sitting with them, taking up their burdens, and speaking the comfort of God, that none weep alone."},
        {type:"refs",text:"Romans 12:15  ·  Matthew 5:4  ·  2 Corinthians 1:3–4"}
      ],
      whatgoeshere:["Baptism, the Lord\u2019s Supper, worship, prayer",
                    "Mutual aid and hospitality",
                    "How each is practiced"] },
    { id:"year", no:"vi",         name:"The Year",
      tag:"the year, measured by Christ",
      content:[
        {type:"p",text:"Our year is measured by Christ, not by the world's holidays nor by a crowded calendar of seasons and saints. We keep the great days of the gospel — plainly, and for what they are."},
        {type:"h",text:"The gospel feasts"},
        {type:"p",text:"We remember together his birth, when the Word was made flesh; his death, when he bore our sins upon the tree; his rising, the firstfruits of our hope; his ascension to the Father's right hand; and the coming of the Holy Spirit upon the church. These we keep in worship and thanksgiving — plainly, and without the world's revelry, feasting, or commerce — that the day point to Christ, and not to itself."},
        {type:"refs",text:"Luke 2:10–11  ·  1 Corinthians 15:3–4  ·  Acts 1:9–11  ·  Acts 2:1–4"},
        {type:"p",text:"Beyond these we bind no holy days upon the conscience. We keep no saints' days, and we do not follow the world into its festivals. Every ordinary day is the Lord's, to be lived unto him; and we would not have the turning of a calendar stand in the place of a living walk with God."},
        {type:"refs",text:"Romans 14:5–6  ·  Galatians 4:9–11  ·  Colossians 2:16–17"},
        {type:"h",text:"Of fasting"},
        {type:"p",text:"We fast, but not by a fixed rule of days. When the church has need — in seeking God's guidance, in repentance, in trouble, or in preparing for the Lord's Supper — a fast is appointed, and the people humble themselves together before God. And each may fast in secret as the Spirit leads. But we fast as our Lord taught: not to be seen of men, with sad and disfigured faces, but unto our Father who sees in secret."},
        {type:"refs",text:"Matthew 6:16–18  ·  Matthew 9:15  ·  Acts 13:2–3"}
      ],
      whatgoeshere:["Whether a calendar is kept at all (open question)",
                    "Seasons, feasts, and fasts",
                    "How days are marked"] },
    { id:"together", no:"vii",    name:"Life Together",
      tag:"how members belong and care for one another",
      content:[
        {type:"p",text:"This is how we live as one body: how a member enters, how the church is served and ordered, how the wayward are sought, and how we bear one another up. It is the shape of the shared life the whole of this way depends upon."},
        {type:"h",text:"Of membership"},
        {type:"p",text:"None is a member of this people by birth or by nation, but only by his own confession and yielding. On repentance and faith, and the baptism that seals them, a believer is received into the body and gives himself to its shared life — to walk in the way, to be taught and admonished, to bear and be borne. This giving is free, and freely kept; the door by which one enters is never locked behind him."},
        {type:"refs",text:"Acts 2:41–42  ·  Romans 12:4–5  ·  2 Corinthians 8:5"},
        {type:"h",text:"Of the ministry"},
        {type:"p",text:"Christ raises up from among the people servants for his church: a bishop, or elder, to shepherd and oversee the flock and to keep the ordinances; ministers, to preach and teach the Word; and deacons, to tend the poor, the widow, and the sick, and to see that none is left in want. These serve, and do not lord; they are not hirelings, but brethren set apart to labor."},
        {type:"refs",text:"Ephesians 4:11–12  ·  1 Timothy 3:1–13  ·  1 Peter 5:2–3"},
        {type:"p",text:"They are not sought, nor sought after. The people name those they hold faithful, and from among the named the lot is cast; for we would not have a man choose himself, nor the church choose by the strength of one voice, but leave the choosing to God. He whom the lot takes receives it as from the Lord's hand — in fear, and not in pride."},
        {type:"refs",text:"Acts 1:23–26  ·  Proverbs 16:33"},
        {type:"h",text:"Of the brethren and the sisters"},
        {type:"p",text:"These offices — bishop, minister, and deacon — the church commits to the brethren, holding to the order set forth in Scripture and signified among us in the covering: that in the household and in the assembly the man is given to lead and to answer for it — not as a right to rule, but as the heavier yoke to bear. We keep this apostolic pattern without contempt for any, and without making the office a thing of rank; for the greatest among us is the servant of all."},
        {type:"refs",text:"1 Timothy 2:11–12  ·  1 Timothy 3:1–13  ·  Matthew 20:26–27"},
        {type:"p",text:"Yet the sisters are not thereby silent, nor without ministry. They pray in the assembly; the older women teach the younger in all that is good; they instruct the children and the sisters in the faith; and in works of mercy — the sick, the poor, the mother in her travail, the stranger at the door — their labor is not beneath the deacon's, but beside it. The body has need of every member, and honors most the parts it does not set in front."},
        {type:"refs",text:"1 Corinthians 11:5  ·  Titus 2:3–5  ·  1 Corinthians 12:22–25"},
        {type:"h",text:"Of the shepherds under the Chief Shepherd"},
        {type:"p",text:"Those who lead are not lords over the flock, but shepherds under the Chief Shepherd, and they are not above the Word, nor above correction. Their teaching is not received because they have spoken it, but because it agrees with the Scriptures; and any member may search the Scriptures, as the Bereans did, to see whether these things be so. The ministry holds no key that the whole church does not hold: it leads, and the people consent, and over the conscience Christ alone is Lord."},
        {type:"refs",text:"1 Peter 5:2–4  ·  Acts 17:11  ·  2 Corinthians 1:24"},
        {type:"p",text:"And because to lead is the heavier charge, the leader is held to the heavier account, and not the lighter. A minister who errs is admonished as any brother; and if he teach false doctrine, or lord it over the flock, or fall into grave and unrepented sin, he is not spared for his office, but corrected — and if he will not hear, put out of it. Even Peter was withstood to his face when he walked not uprightly. The office sets no man beyond the reproach of the church, but binds him the deeper within it."},
        {type:"refs",text:"James 3:1  ·  1 Timothy 5:19–20  ·  Galatians 2:11"},
        {type:"p",text:"This we do by due order, and not by faction nor the heat of a moment: as with any grave matter, upon the word of two or three witnesses, with patient admonition first, and the discernment of the gathered church — and, for a bishop, with the counsel of the sister companies, that neither one man alone nor one aggrieved company be the whole of it. So is the shepherd guarded from tyranny, and the flock from the tyranny of its own moods; for we would neither suffer a lord over us, nor make the ministry the servant of every wind."},
        {type:"refs",text:"Matthew 18:16  ·  Acts 15:22,28  ·  Proverbs 11:14"},
        {type:"h",text:"Of the gathering of a company"},
        {type:"p",text:"Where there is not yet a company of this way, one may be gathered — not by a lone man setting himself up, but by believers joined together under Christ and his Word. For where two or three are gathered in his name he is in their midst, and his church is truly present, needing no authority handed down from elsewhere to be his. Such a company, holding to this confession, may in prayer and the fear of God raise up its own first ministry by the lot, and baptize, and keep the ordinances — as the first Anabaptists did, who baptized one another with no authority but Christ and his Word."},
        {type:"refs",text:"Matthew 18:20  ·  Matthew 16:18–19  ·  Acts 14:23"},
        {type:"p",text:"Yet no company is a law to itself. It stands under the whole Word, under this shared confession, and — where other companies of the way exist — in fellowship and counsel with them, giving and receiving admonition, that none walk alone and none walk astray."},
        {type:"refs",text:"Acts 15:1–2,22  ·  Proverbs 11:14  ·  1 Corinthians 14:32–33"},
        {type:"h",text:"Of admonition and restoration"},
        {type:"p",text:"When a brother sins, he is sought — first alone, by the one who knows; then, if he will not hear, with one or two others; and only then before the church. In all of it the aim is never his shame but his return, and the whole matter is carried in love and in grief, never in anger."},
        {type:"refs",text:"Matthew 18:15–17  ·  Galatians 6:1  ·  James 5:19–20"},
        {type:"p",text:"We are careful what we weigh. Grave and open sin, clung to without repentance, is one thing; the keeping of the plain order is another. The details of our common life — the covering, the bounds upon our tools, the manner of our dress — are taught, admonished, and borne with one another in patience; they are never themselves the measure of a member, nor a ground for putting anyone out. Only when one will not turn from open, unrepentant sin, or sets himself in open defiance against the whole way he vowed, does it come to the gravest step."},
        {type:"refs",text:"1 Corinthians 5:11  ·  Romans 14:1,4  ·  Colossians 3:13"},
        {type:"p",text:"When it must come to that, he is, in sorrow, put from the membership and the table, that the body be kept whole and the weight of it call him home. Yet we do not cast him from our love, nor shun him from our doors: he is greeted still, prayed for still, counted not an enemy but admonished as a brother, and the way back is held open. When he repents he is received again with joy, and the past is not held against him."},
        {type:"refs",text:"2 Thessalonians 3:14–15  ·  2 Corinthians 2:6–8  ·  Luke 15:20–24"},
        {type:"h",text:"Of the bounds of discipline"},
        {type:"p",text:"Three things this discipline may never become. It is not the gate of salvation: a member's standing before God rests upon Christ alone, and no judgment of the church can add to it or take from it; even one rightly put out is not thereby put out of God's hand, and we dare not speak as though he were. It is never a rod for conformity: it may not be used to force agreement in disputable things, nor to punish, nor to bend a soul to the will of the strong, but only and always to restore. And it never cancels our care: the one under discipline is still fed if hungry, helped if in need, never left destitute or alone. We withhold the table; we never withhold the bread."},
        {type:"refs",text:"Romans 14:4  ·  2 Corinthians 2:7  ·  John 13:34–35  ·  Galatians 6:10"},
        {type:"h",text:"Of holding together in disagreement"},
        {type:"p",text:"A living people will not always be of one mind, and we do not pretend otherwise. In matters of judgment — not the gospel, and not plain sin, but the thousand questions of how a people should walk — we seek the mind of Christ together, and labor toward one accord, that we may say with the church of old, It seemed good to the Holy Ghost, and to us. He who is overruled in a thing indifferent yields for the peace of the body, and makes no party; he may hold his view, and speak it in its season, but he does not gather a faction, nor whisper, nor tear. For the sin is never the honest difference, but the dividing."},
        {type:"refs",text:"Acts 15:22,28  ·  Philippians 2:2  ·  Ephesians 4:2–3"},
        {type:"p",text:"And those who prevail do not lord it over those who yielded, nor bind the conscience further than the matter requires; for we would win a brother, not a vote. We bear long with one another, and count no disagreement worth the tearing of the body that is not first worth the tearing of the gospel. Parting is the last and bitterest resort, and never the first reach of an angry heart."},
        {type:"refs",text:"Romans 15:1–2  ·  Colossians 3:13  ·  1 Corinthians 1:10"},
        {type:"p",text:"Yet if part we ever must, we would part as our fathers too seldom did. When the matter is one of custom or of judgment, those who separate remain brethren still, only apart — owing each other honor, and help, and the open door. Only when a body forsakes the gospel itself — denying Christ, or the grace that saves, or the plain Word — do we own that it has left the faith, and not merely us; and even then we pronounce no man's soul lost, for that judgment is God's alone, but grieve, and pray for their return, and keep the door open against the day they come home. We will part, if part we must, in sorrow and not in cursing — never hurling the anathemas that have scarred this people's own history."},
        {type:"refs",text:"Galatians 1:8–9  ·  2 Timothy 2:19  ·  Romans 14:10–12"},
        {type:"h",text:"Of the common life"},
        {type:"p",text:"We bear one another's burdens, and so fulfil the law of Christ. The needs of the poor, the widow, the orphan, and the sick are the care of all; none among us is left to want while another has plenty. And the matters of the church we do not settle by the will of one or the reach of the strong, but discern together — the whole body seeking the mind of Christ, the ministry leading and the people consenting."},
        {type:"refs",text:"Galatians 6:2  ·  Acts 4:34–35  ·  Acts 15:22,28"},
        {type:"h",text:"Of those who leave us"},
        {type:"p",text:"As no one is forced into this way, so no one is held in it by force. A member who can no longer walk with us in conscience may go, and go in peace; we do not curse him, nor shun him, nor treat him as an enemy. He remains one whom Christ may hold, though he has let go of us; and the door by which he came is the same door by which he may leave, and the same by which, if God so lead, he may one day return. We would keep no one by the shutting of a door; for a faith that is not free is no faith at all."},
        {type:"refs",text:"John 6:66–67  ·  Philemon 1:14  ·  Luke 15:20"},
        {type:"p",text:"And because it is by no chain of need that we would bind him, we deal openly in the matter of goods. What is his own is his own, and goes with him; we hold no man's property hostage to his staying. If he owes a debt to the church, it is dealt with as any honest debt between brethren — forgiven, or borne, or repaid in its season — but never wielded as a whip to hold him, nor called in as a punishment for his going. We will not make of a loan a leash."},
        {type:"refs",text:"Romans 13:8  ·  Deuteronomy 15:7–8  ·  Philemon 1:18–19"},
        {type:"p",text:"Of the care of the church we are honest, neither more nor less. The mutual aid we bear one another is the care of a covenant shared, and is given while the life is shared; the one who leaves that life leaves also its particular claim, and we count this no punishment, but the plain shape of a bond that is mutual or is nothing. Yet beneath it there is a floor that never gives way: the one who has left is our neighbor still, and if we find him in true want we help him as we would help any man, for so the Samaritan did to a stranger. We withdraw the covenant; we never withdraw mercy. The net is a gift, and not a leash: he was free to receive it, and he is free to leave it, and he is never, in the leaving, cast below the reach of love."},
        {type:"refs",text:"Galatians 6:10  ·  Luke 10:33–35  ·  1 John 3:17"}
      ],
      whatgoeshere:["Membership and belonging",
                    "Admonition and restoration",
                    "Care, and how the community holds"] },
    { id:"prayers", no:"viii", name:"Prayers and the Order of Worship",
      tag:"how we pray, and the ordering of worship",
      content:[
        {type:"p",text:"Prayer is the breath of this life, and we would not leave it to the mood of the moment. We pray with set forms, and with silence, and freely too, each in its place. The forms are given so that prayer be not the performance of the eloquent, admired by the rest, but the common voice of the whole household lifted together; the silence is kept so that the forms be not mere words upon the lip, but the cry of the heart within; and free prayer, where it is fitting, is offered plainly and without show. We hold the Lord's Prayer as the pattern and the center of all our praying, and use it daily."},
        {type:"refs",text:"Matthew 6:5–8  ·  Luke 11:1  ·  Romans 8:26"},
        {type:"h",text:"The Lord's Prayer"},
        {type:"verse",text:"Our Father which art in heaven, Hallowed be thy name. Thy kingdom come. Thy will be done in earth, as it is in heaven. Give us this day our daily bread. And forgive us our debts, as we forgive our debtors. And lead us not into temptation, but deliver us from evil: For thine is the kingdom, and the power, and the glory, for ever. Amen.",ref:"Matthew 6:9–13"},
        {type:"h",text:"The daily order"},

/* ------------------------------- helpers ------------------------------- */
function el(html){ const t=document.createElement("template"); t.innerHTML=html.trim(); return t.content.firstChild; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function displayName(){ return FAITH.name || FAITH.descriptor; }
function findEntry(id){ return id==="preface" ? FAITH.preface : FAITH.parts.find(p=>p.id===id); }
function allEntries(){ return [FAITH.preface, ...FAITH.parts]; }
function inlineLinks(text){
  return esc(text).replace(/\[\[([a-z-]+)\|([^\]]+)\]\]/g,(m,id,label)=>`<a class="xref" data-go="${id}">${label}</a>`);
}
function renderRefs(text){
  const withLinks = inlineLinks(text);
  return withLinks.split("·").map(seg=>{
    const key = seg.trim();
    if(VERSES[key]){
      return seg.replace(key, `<a class="vref" data-ref="${key}" role="button" tabindex="0">${key}</a>`);
    }
    return seg;
  }).join("·");
}
function showVerse(ref){
  const data = VERSES[ref];
  if(!data) return;
  const body = document.querySelector("#versePop .vpop-body");
  let html = `<div class="vpop-ref">${esc(ref)}</div><p class="vpop-verse">`;
  html += data.items.map(it=>`<sup>${esc(it[0])}</sup> ${esc(it[1])}`).join("  ");
  html += `</p>`;
  body.innerHTML = html;
  const pop = document.getElementById("versePop");
  pop.hidden = false;
  document.body.style.overflow = "hidden";
}
function hideVerse(){
  const pop = document.getElementById("versePop");
  if(pop){ pop.hidden = true; document.body.style.overflow = ""; }
}
let _pendingBlock = null;
let _searchMode = false;

function setHeader(){
  document.getElementById("homeLink").textContent = displayName();
}

/* ------------------------------- views ------------------------------- */
function renderHome(){
  setHeader();
  document.getElementById("crumb").textContent = "";
  const view = document.getElementById("view");
  view.innerHTML = "";

  view.appendChild(el(`<section class="leaf">
    <span class="kicker label">a rule of life</span>
    <h1>${esc(FAITH.name)}</h1>
    <p class="subtitle">${esc(FAITH.descriptor)}</p>
  </section>`));

  view.appendChild(el(`<blockquote class="epigraph">
    ${esc(FAITH.epigraph.text)}
    <span class="ref">${esc(FAITH.epigraph.ref)}</span>
  </blockquote>`));

  const toc = el(`<nav class="contents" aria-label="Contents">
    <span class="label">contents</span>
    <ol class="toc"></ol>
  </nav>`);
  const ol = toc.querySelector("ol");
  const pf = FAITH.preface;
  ol.appendChild(el(`<li><a data-go="${pf.id}" role="link" tabindex="0">
    <span class="no"></span>
    <span class="part"><span class="name" style="font-style:italic">${esc(pf.name)}</span><span class="tag">${esc(pf.tag)}</span></span>
    <span class="arrow">\u2192</span>
  </a></li>`));
  FAITH.parts.forEach(p=>{
    const done = (p.content && p.content.length) ? `<span class="done" title="begun">\u25CF</span>` : "";
    ol.appendChild(el(`<li><a data-go="${p.id}" role="link" tabindex="0">
      <span class="no">${esc(p.no)}</span>
      <span class="part"><span class="name">${esc(p.name)}</span><span class="tag">${esc(p.tag)}</span></span>
      ${done}<span class="arrow">\u2192</span>
    </a></li>`));
  });
  view.appendChild(toc);
}

function renderBlock(b,i){
  const a = (i==null) ? "" : ` id="blk${i}"`;
  if(b.type==="h")     return `<h3 class="sub"${a}>${esc(b.text)}</h3>`;
  if(b.type==="refs")  return `<p class="refs"${a}>${renderRefs(b.text)}</p>`;
  if(b.type==="verse") return `<blockquote class="verse"${a}>${inlineLinks(b.text)}<span class="ref">${esc(b.ref||"")}</span></blockquote>`;
  return `<p class="body"${a}>${inlineLinks(b.text)}</p>`;
}
function highlightBlock(i){
  const node = document.getElementById("blk"+i);
  if(!node) return;
  node.scrollIntoView({behavior:"smooth",block:"center"});
  node.classList.remove("hl"); void node.offsetWidth; node.classList.add("hl");
}
function renderPart(part){
  setHeader();
  document.getElementById("crumb").textContent = part.name;
  const view = document.getElementById("view");
  view.innerHTML = "";
  const body = (part.content && part.content.length)
    ? part.content.map((b,i)=>renderBlock(b,i)).join("")
    : `<div class="placeholder"><span class="label">what goes here</span><ul>${part.whatgoeshere.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`;
  const page = el(`<article class="part-page">
    <span class="eyebrow label">${part.front ? "preface" : "part "+esc(part.no)}</span>
    <h2>${esc(part.name)}</h2>
    <p class="lead">${esc(part.tag)}</p>
    ${body}
    <a class="backlink" data-go="home" role="link" tabindex="0">\u2190 back to contents</a>
  </article>`);
  view.appendChild(page);
  if(_pendingBlock!=null){ const i=_pendingBlock; _pendingBlock=null; requestAnimationFrame(()=>highlightBlock(i)); }
}

/* --------------------------- navigation --------------------------- */
/* State-driven, no URL/hash changes — so it works inside sandboxed
   preview frames as well as a saved file opened directly. */
function go(where, block){
  window.scrollTo(0,0);
  _searchMode = false;
  _pendingBlock = (block==null ? null : block);
  if(!where || where==="home"){ _pendingBlock=null; renderHome(); return; }
  const part = findEntry(where);
  if(part){ renderPart(part); } else { _pendingBlock=null; renderHome(); }
}
function handleNav(e){
  const t = e.target.closest("[data-go]");
  if(!t) return;
  e.preventDefault();
  const b = t.getAttribute("data-block");
  go(t.getAttribute("data-go"), b==null?null:Number(b));
}
document.addEventListener("click", handleNav);
document.addEventListener("keydown", e=>{
  if((e.key==="Enter"||e.key===" ") && e.target.closest("[data-go]")){ handleNav(e); }
});

/* ------------------------------- search ------------------------------- */
function snippet(text, at, len){
  const pad=60;
  const start=Math.max(0,at-pad), end=Math.min(text.length,at+len+pad);
  const pre=(start>0?"\u2026":"")+text.slice(start,at);
  const mid=text.slice(at,at+len);
  const post=text.slice(at+len,end)+(end<text.length?"\u2026":"");
  return esc(pre)+"<mark>"+esc(mid)+"</mark>"+esc(post);
}
function renderSearch(raw){
  _searchMode = true;
  setHeader();
  document.getElementById("crumb").textContent = "search";
  const view=document.getElementById("view"); view.innerHTML="";
  const wrap=el(`<div class="results"><span class="label">search</span></div>`);
  const query=String(raw||"").trim().toLowerCase();
  if(query.length<2){
    wrap.appendChild(el(`<p class="none">Type a word or two to search the whole text.</p>`));
    wrap.appendChild(el(`<a class="backlink" data-go="home" role="link" tabindex="0">\u2190 back to contents</a>`));
    view.appendChild(wrap); return;
  }
  const hits=[];
  allEntries().forEach(entry=>{
    (entry.content||[]).forEach((b,i)=>{
      if(!b.text) return;
      const at=b.text.toLowerCase().indexOf(query);
      if(at>=0) hits.push({entry,i,text:b.text,at});
    });
  });
  if(!hits.length){
    wrap.appendChild(el(`<p class="none">Nothing found for \u201c${esc(raw.trim())}\u201d.</p>`));
  }else{
    wrap.appendChild(el(`<p class="none">${hits.length} ${hits.length===1?"passage":"passages"} found.</p>`));
    hits.forEach(h=>{
      const where = h.entry.front ? "Preface" : ("Part "+h.entry.no.toUpperCase()+" \u00b7 "+h.entry.name);
      wrap.appendChild(el(`<a class="result" data-go="${h.entry.id}" data-block="${h.i}" role="link" tabindex="0">
        <span class="where">${esc(where)}</span>
        <span class="snip">${snippet(h.text,h.at,query.length)}</span>
      </a>`));
    });
  }
  wrap.appendChild(el(`<a class="backlink" data-go="home" role="link" tabindex="0">\u2190 back to contents</a>`));
  view.appendChild(wrap);
}
const qEl=document.getElementById("q");
let _qt=null;
qEl.addEventListener("input",()=>{
  clearTimeout(_qt);
  _qt=setTimeout(()=>{
    const v=qEl.value;
    if(v.trim().length>=2 || _searchMode) renderSearch(v);
  },140);
});
qEl.addEventListener("keydown",e=>{
  if(e.key==="Enter"){ e.preventDefault(); renderSearch(qEl.value); }
});

/* ------------------------------- print ------------------------------- */
function stripLinks(text){
  return esc(text).replace(/\[\[([a-z-]+)\|([^\]]+)\]\]/g,(m,id,label)=>label);
}
function printBlock(b){
  if(b.type==="h")     return `<h3>${esc(b.text)}</h3>`;
  if(b.type==="refs")  return `<p class="refs">${stripLinks(b.text)}</p>`;
  if(b.type==="verse") return `<blockquote class="verse">${stripLinks(b.text)}<span class="ref">${esc(b.ref||"")}</span></blockquote>`;
  return `<p>${stripLinks(b.text)}</p>`;
}
function buildPrintBook(){
  const host=document.getElementById("print-book");
  let html=`<div class="pb-leaf"><h1>${esc(FAITH.name)}</h1><div class="sub">${esc(FAITH.descriptor)}</div></div>`;
  html+=`<div class="pb-epi">${esc(FAITH.epigraph.text)}<span class="ref">${esc(FAITH.epigraph.ref)}</span></div>`;
  allEntries().forEach((entry,idx)=>{
    const eyebrow = entry.front ? "preface" : ("part "+entry.no);
    html+=`<section class="pb-part${idx===0?" pb-first":""}"><div class="pb-eyebrow">${esc(eyebrow)}</div><h2>${esc(entry.name)}</h2><p class="pb-lead">${esc(entry.tag)}</p>`;
    (entry.content||[]).forEach(b=>{ html+=printBlock(b); });
    html+=`</section>`;
  });
  host.innerHTML=html;
}
const printBtn=document.getElementById("printBtn");
printBtn.addEventListener("click",()=>window.print());
printBtn.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); window.print(); } });

/* ------------------------- scripture popover ------------------------- */
document.addEventListener("click", e=>{
  const vr = e.target.closest(".vref");
  if(vr){ e.preventDefault(); showVerse(vr.getAttribute("data-ref")); }
});
document.addEventListener("keydown", e=>{
  if((e.key==="Enter"||e.key===" ") && e.target.closest && e.target.closest(".vref")){
    e.preventDefault(); showVerse(e.target.closest(".vref").getAttribute("data-ref"));
  }
  if(e.key==="Escape") hideVerse();
});
(function(){
  const pop=document.getElementById("versePop");
  pop.addEventListener("click", e=>{ if(e.target===pop || e.target.closest(".vpop-x")) hideVerse(); });
})();

/* --------------------------------- init --------------------------------- */
buildPrintBook();
go("home");
</script>
