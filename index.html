, and of the Son, and of the Holy Ghost:"]]}, "Matthew 28:19–20": {"c": "28", "items": [["19", "Go ye therefore, and teach all nations, baptizing them in the name of the Father, and of the Son, and of the Holy Ghost:"], ["20", "Teaching them to observe all things whatsoever I have commanded you: and, lo, I am with you alway, even unto the end of the world. Amen."]]}, "Matthew 5:17–20": {"c": "5", "items": [["17", "Think not that I am come to destroy the law, or the prophets: I am not come to destroy, but to fulfil."], ["18", "For verily I say unto you, Till heaven and earth pass, one jot or one tittle shall in no wise pass from the law, till all be fulfilled."], ["19", "Whosoever therefore shall break one of these least commandments, and shall teach men so, he shall be called the least in the kingdom of heaven: but whosoever shall do and teach them, the same shall be called great in the kingdom of heaven."], ["20", "For I say unto you, That except your righteousness shall exceed the righteousness of the scribes and Pharisees, ye shall in no case enter into the kingdom of heaven."]]}, "Matthew 5:23–24": {"c": "5", "items": [["23", "Therefore if thou bring thy gift to the altar, and there rememberest that thy brother hath ought against thee;"], ["24", "Leave there thy gift before the altar, and go thy way; first be reconciled to thy brother, and then come and offer thy gift."]]}, "Matthew 5:33–37": {"c": "5", "items": [["33", "Again, ye have heard that it hath been said by them of old time, Thou shalt not forswear thyself, but shalt perform unto the Lord thine oaths:"], ["34", "But I say unto you, Swear not at all; neither by heaven; for it is God’s throne:"], ["35", "Nor by the earth; for it is his footstool: neither by Jerusalem; for it is the city of the great King."], ["36", "Neither shalt thou swear by thy head, because thou canst not make one hair white or black."], ["37", "But let your communication be, Yea, yea; Nay, nay: for whatsoever is more than these cometh of evil."]]}, "Matthew 5:38–39": {"c": "5", "items": [["38", "Ye have heard that it hath been said, An eye for an eye, and a tooth for a tooth:"], ["39", "But I say unto you, That ye resist not evil: but whosoever shall smite thee on thy right cheek, turn to him the other also."]]}, "Matthew 5:38–48": {"c": "5", "items": [["38", "Ye have heard that it hath been said, An eye for an eye, and a tooth for a tooth:"], ["39", "But I say unto you, That ye resist not evil: but whosoever shall smite thee on thy right cheek, turn to him the other also."], ["40", "And if any man will sue thee at the law, and take away thy coat, let him have thy cloak also."], ["41", "And whosoever shall compel thee to go a mile, go with him twain."], ["42", "Give to him that asketh thee, and from him that would borrow of thee turn not thou away."], ["43", "Ye have heard that it hath been said, Thou shalt love thy neighbour, and hate thine enemy."], ["44", "But I say unto you, Love your enemies, bless them that curse you, do good to them that hate you, and pray for them which despitefully use you, and persecute you;"], ["45", "That ye may be the children of your Father which is in heaven: for he maketh his sun to rise on the evil and on the good, and sendeth rain on the just and on the unjust."], ["46", "For if ye love them which love you, what reward have ye? do not even the publicans the same?"], ["47", "And if ye salute your brethren only, what do ye more than others? do not even the publicans so?"], ["48", "Be ye therefore perfect, even as your Father which is in heaven is perfect."]]}, "Matthew 5:4": {"c": "5", "items": [["4", "Blessed are they that mourn: for they shall be comforted."]]}, "Matthew 5:48": {"c": "5", "items": [["48", "Be ye therefore perfect, even as your Father which is in heaven is perfect."]]}, "Matthew 5:9": {"c": "5", "items": [["9", "Blessed are the peacemakers: for they shall be called the children of God."]]}, "Matthew 6:11": {"c": "6", "items": [["11", "Give us this day our daily bread."]]}, "Matthew 6:16–18": {"c": "6", "items": [["16", "Moreover when ye fast, be not, as the hypocrites, of a sad countenance: for they disfigure their faces, that they may appear unto men to fast. Verily I say unto you, They have their reward."], ["17", "But thou, when thou fastest, anoint thine head, and wash thy face;"], ["18", "That thou appear not unto men to fast, but unto thy Father which is in secret: and thy Father, which seeth in secret, shall reward thee openly."]]}, "Matthew 6:19–21": {"c": "6", "items": [["19", "Lay not up for yourselves treasures upon earth, where moth and rust doth corrupt, and where thieves break through and steal:"], ["20", "But lay up for yourselves treasures in heaven, where neither moth nor rust doth corrupt, and where thieves do not break through nor steal:"], ["21", "For where your treasure is, there will your heart be also."]]}, "Matthew 6:5–8": {"c": "6", "items": [["5", "And when thou prayest, thou shalt not be as the hypocrites are: for they love to pray standing in the synagogues and in the corners of the streets, that they may be seen of men. Verily I say unto you, They have their reward."], ["6", "But thou, when thou prayest, enter into thy closet, and when thou hast shut thy door, pray to thy Father which is in secret; and thy Father which seeth in secret shall reward thee openly."], ["7", "But when ye pray, use not vain repetitions, as the heathen do: for they think that they shall be heard for their much speaking."], ["8", "Be not ye therefore like unto them: for your Father knoweth what things ye have need of, before ye ask him."]]}, "Matthew 6:6": {"c": "6", "items": [["6", "But thou, when thou prayest, enter into thy closet, and when thou hast shut thy door, pray to thy Father which is in secret; and thy Father which seeth in secret shall reward thee openly."]]}, "Matthew 6:9–13": {"c": "6", "items": [["9", "After this manner therefore pray ye: Our Father which art in heaven, Hallowed be thy name."], ["10", "Thy kingdom come. Thy will be done in earth, as it is in heaven."], ["11", "Give us this day our daily bread."], ["12", "And forgive us our debts, as we forgive our debtors."], ["13", "And lead us not into temptation, but deliver us from evil: For thine is the kingdom, and the power, and the glory, for ever. Amen."]]}, "Matthew 7:13–14": {"c": "7", "items": [["13", "Enter ye in at the strait gate: for wide is the gate, and broad is the way, that leadeth to destruction, and many there be which go in thereat:"], ["14", "Because strait is the gate, and narrow is the way, which leadeth unto life, and few there be that find it."]]}, "Matthew 9:15": {"c": "9", "items": [["15", "And Jesus said unto them, Can the children of the bridechamber mourn, as long as the bridegroom is with them? but the days will come, when the bridegroom shall be taken from them, and then shall they fast."]]}, "Micah 6:8": {"c": "6", "items": [["8", "He hath shewed thee, O man, what is good; and what doth the LORD require of thee, but to do justly, and to love mercy, and to walk humbly with thy God?"]]}, "Philemon 1:14": {"c": "1", "items": [["14", "But without thy mind would I do nothing; that thy benefit should not be as it were of necessity, but willingly."]]}, "Philemon 1:18–19": {"c": "1", "items": [["18", "If he hath wronged thee, or oweth thee ought, put that on mine account;"], ["19", "I Paul have written it with mine own hand, I will repay it: albeit I do not say to thee how thou owest unto me even thine own self besides."]]}, "Philippians 2:2": {"c": "2", "items": [["2", "Fulfil ye my joy, that ye be likeminded, having the same love, being of one accord, of one mind."]]}, "Philippians 2:3–8": {"c": "2", "items": [["3", "Let nothing be done through strife or vainglory; but in lowliness of mind let each esteem other better than themselves."], ["4", "Look not every man on his own things, but every man also on the things of others."], ["5", "Let this mind be in you, which was also in Christ Jesus:"], ["6", "Who, being in the form of God, thought it not robbery to be equal with God:"], ["7", "But made himself of no reputation, and took upon him the form of a servant, and was made in the likeness of men:"], ["8", "And being found in fashion as a man, he humbled himself, and became obedient unto death, even the death of the cross."]]}, "Philippians 2:5–11": {"c": "2", "items": [["5", "Let this mind be in you, which was also in Christ Jesus:"], ["6", "Who, being in the form of God, thought it not robbery to be equal with God:"], ["7", "But made himself of no reputation, and took upon him the form of a servant, and was made in the likeness of men:"], ["8", "And being found in fashion as a man, he humbled himself, and became obedient unto death, even the death of the cross."], ["9", "Wherefore God also hath highly exalted him, and given him a name which is above every name:"], ["10", "That at the name of Jesus every knee should bow, of things in heaven, and things in earth, and things under the earth;"], ["11", "And that every tongue should confess that Jesus Christ is Lord, to the glory of God the Father."]]}, "Philippians 3:13–14": {"c": "3", "items": [["13", "Brethren, I count not myself to have apprehended: but this one thing I do, forgetting those things which are behind, and reaching forth unto those things which are before,"], ["14", "I press toward the mark for the prize of the high calling of God in Christ Jesus."]]}, "Philippians 3:15–16": {"c": "3", "items": [["15", "Let us therefore, as many as be perfect, be thus minded: and if in any thing ye be otherwise minded, God shall reveal even this unto you."], ["16", "Nevertheless, whereto we have already attained, let us walk by the same rule, let us mind the same thing."]]}, "Philippians 3:20": {"c": "3", "items": [["20", "For our conversation is in heaven; from whence also we look for the Saviour, the Lord Jesus Christ:"]]}, "Philippians 4:11–13": {"c": "4", "items": [["11", "Not that I speak in respect of want: for I have learned, in whatsoever state I am, therewith to be content."], ["12", "I know both how to be abased, and I know how to abound: every where and in all things I am instructed both to be full and to be hungry, both to abound and to suffer need."], ["13", "I can do all things through Christ which strengtheneth me."]]}, "Philippians 4:8": {"c": "4", "items": [["8", "Finally, brethren, whatsoever things are true, whatsoever things are honest, whatsoever things are just, whatsoever things are pure, whatsoever things are lovely, whatsoever things are of good report; if there be any virtue, and if there be any praise, think on these things."]]}, "Proverbs 11:14": {"c": "11", "items": [["14", "Where no counsel is, the people fall: but in the multitude of counsellors there is safety."]]}, "Proverbs 12:11": {"c": "12", "items": [["11", "He that tilleth his land shall be satisfied with bread: but he that followeth vain persons is void of understanding."]]}, "Proverbs 16:33": {"c": "16", "items": [["33", "The lot is cast into the lap; but the whole disposing thereof is of the LORD."]]}, "Proverbs 22:6": {"c": "22", "items": [["6", "Train up a child in the way he should go: and when he is old, he will not depart from it."]]}, "Proverbs 24:11–12": {"c": "24", "items": [["11", "If thou forbear to deliver them that are drawn unto death, and those that are ready to be slain;"], ["12", "If thou sayest, Behold, we knew it not; doth not he that pondereth the heart consider it? and he that keepeth thy soul, doth not he know it? and shall not he render to every man according to his works?"]]}, "Proverbs 28:13": {"c": "28", "items": [["13", "He that covereth his sins shall not prosper: but whoso confesseth and forsaketh them shall have mercy."]]}, "Proverbs 30:8–9": {"c": "30", "items": [["8", "Remove far from me vanity and lies: give me neither poverty nor riches; feed me with food convenient for me:"], ["9", "Lest I be full, and deny thee, and say, Who is the LORD? or lest I be poor, and steal, and take the name of my God in vain."]]}, "Proverbs 4:23": {"c": "4", "items": [["23", "Keep thy heart with all diligence; for out of it are the issues of life."]]}, "Proverbs 9:10": {"c": "9", "items": [["10", "The fear of the LORD is the beginning of wisdom: and the knowledge of the holy is understanding."]]}, "Psalm 101:3": {"c": "101", "items": [["3", "I will set no wicked thing before mine eyes: I hate the work of them that turn aside; it shall not cleave to me."]]}, "Psalm 104:14": {"c": "104", "items": [["14", "He causeth the grass to grow for the cattle, and herb for the service of man: that he may bring forth food out of the earth;"]]}, "Psalm 110:3": {"c": "110", "items": [["3", "Thy people shall be willing in the day of thy power, in the beauties of holiness from the womb of the morning: thou hast the dew of thy youth."]]}, "Psalm 121:3–4": {"c": "121", "items": [["3", "He will not suffer thy foot to be moved: he that keepeth thee will not slumber."], ["4", "Behold, he that keepeth Israel shall neither slumber nor sleep."]]}, "Psalm 139:14": {"c": "139", "items": [["14", "I will praise thee; for I am fearfully and wonderfully made: marvellous are thy works; and that my soul knoweth right well."]]}, "Psalm 143:8": {"c": "143", "items": [["8", "Cause me to hear thy lovingkindness in the morning; for in thee do I trust: cause me to know the way wherein I should walk; for I lift up my soul unto thee."]]}, "Psalm 146:3": {"c": "146", "items": [["3", "Put not your trust in princes, nor in the son of man, in whom there is no help."]]}, "Psalm 20:7": {"c": "20", "items": [["7", "Some trust in chariots, and some in horses: but we will remember the name of the LORD our God."]]}, "Psalm 34:18": {"c": "34", "items": [["18", "The LORD is nigh unto them that are of a broken heart; and saveth such as be of a contrite spirit."]]}, "Psalm 46:1": {"c": "46", "items": [["1", "God is our refuge and strength, a very present help in trouble."]]}, "Psalm 4:8": {"c": "4", "items": [["8", "I will both lay me down in peace, and sleep: for thou, LORD, only makest me dwell in safety."]]}, "Psalm 51:1–2": {"c": "51", "items": [["1", "Have mercy upon me, O God, according to thy lovingkindness: according unto the multitude of thy tender mercies blot out my transgressions."], ["2", "Wash me throughly from mine iniquity, and cleanse me from my sin."]]}, "Psalm 55:17": {"c": "55", "items": [["17", "Evening, and morning, and at noon, will I pray, and cry aloud: and he shall hear my voice."]]}, "Psalm 68:6": {"c": "68", "items": [["6", "God setteth the solitary in families: he bringeth out those which are bound with chains: but the rebellious dwell in a dry land."]]}, "Psalm 78:4–7": {"c": "78", "items": [["4", "We will not hide them from their children, shewing to the generation to come the praises of the LORD, and his strength, and his wonderful works that he hath done."], ["5", "For he established a testimony in Jacob, and appointed a law in Israel, which he commanded our fathers, that they should make them known to their children:"], ["6", "That the generation to come might know them, even the children which should be born; who should arise and declare them to their children:"], ["7", "That they might set their hope in God, and not forget the works of God, but keep his commandments:"]]}, "Psalm 82:3–4": {"c": "82", "items": [["3", "Defend the poor and fatherless: do justice to the afflicted and needy."], ["4", "Deliver the poor and needy: rid them out of the hand of the wicked."]]}, "Psalm 90:12": {"c": "90", "items": [["12", "So teach us to number our days, that we may apply our hearts unto wisdom."]]}, "Psalm 92:1–2": {"c": "92", "items": [["1", "IT IS A GOOD THING TO GIVE THANKS UNTO THE LORD, AND TO SING PRAISES UNTO THY NAME, O MOST HIGH:"], ["2", "To shew forth thy lovingkindness in the morning, and thy faithfulness every night,"]]}, "Revelation 21:1–7": {"c": "21", "items": [["1", "And I saw a new heaven and a new earth: for the first heaven and the first earth were passed away; and there was no more sea."], ["2", "And I John saw the holy city, new Jerusalem, coming down from God out of heaven, prepared as a bride adorned for her husband."], ["3", "And I heard a great voice out of heaven saying, Behold, the tabernacle of God is with men, and he will dwell with them, and they shall be his people, and God himself shall be with them, and be their God."], ["4", "And God shall wipe away all tears from their eyes; and there shall be no more death, neither sorrow, nor crying, neither shall there be any more pain: for the former things are passed away."], ["5", "And he that sat upon the throne said, Behold, I make all things new. And he said unto me, Write: for these words are true and faithful."], ["6", "And he said unto me, It is done. I am Alpha and Omega, the beginning and the end. I will give unto him that is athirst of the fountain of the water of life freely."], ["7", "He that overcometh shall inherit all things; and I will be his God, and he shall be my son."]]}, "Revelation 21:3–4": {"c": "21", "items": [["3", "And I heard a great voice out of heaven saying, Behold, the tabernacle of God is with men, and he will dwell with them, and they shall be his people, and God himself shall be with them, and be their God."], ["4", "And God shall wipe away all tears from their eyes; and there shall be no more death, neither sorrow, nor crying, neither shall there be any more pain: for the former things are passed away."]]}, "Romans 10:9–10": {"c": "10", "items": [["9", "That if thou shalt confess with thy mouth the Lord Jesus, and shalt believe in thine heart that God hath raised him from the dead, thou shalt be saved."], ["10", "For with the heart man believeth unto righteousness; and with the mouth confession is made unto salvation."]]}, "Romans 12:13": {"c": "12", "items": [["13", "Distributing to the necessity of saints; given to hospitality."]]}, "Romans 12:15": {"c": "12", "items": [["15", "Rejoice with them that do rejoice, and weep with them that weep."]]}, "Romans 12:17–21": {"c": "12", "items": [["17", "Recompense to no man evil for evil. Provide things honest in the sight of all men."], ["18", "If it be possible, as much as lieth in you, live peaceably with all men."], ["19", "Dearly beloved, avenge not yourselves, but rather give place unto wrath: for it is written, Vengeance is mine; I will repay, saith the Lord."], ["20", "Therefore if thine enemy hunger, feed him; if he thirst, give him drink: for in so doing thou shalt heap coals of fire on his head."], ["21", "Be not overcome of evil, but overcome evil with good."]]}, "Romans 12:19–21": {"c": "12", "items": [["19", "Dearly beloved, avenge not yourselves, but rather give place unto wrath: for it is written, Vengeance is mine; I will repay, saith the Lord."], ["20", "Therefore if thine enemy hunger, feed him; if he thirst, give him drink: for in so doing thou shalt heap coals of fire on his head."], ["21", "Be not overcome of evil, but overcome evil with good."]]}, "Romans 12:1–2": {"c": "12", "items": [["1", "I beseech you therefore, brethren, by the mercies of God, that ye present your bodies a living sacrifice, holy, acceptable unto God, which is your reasonable service."], ["2", "And be not conformed to this world: but be ye transformed by the renewing of your mind, that ye may prove what is that good, and acceptable, and perfect, will of God."]]}, "Romans 12:2": {"c": "12", "items": [["2", "And be not conformed to this world: but be ye transformed by the renewing of your mind, that ye may prove what is that good, and acceptable, and perfect, will of God."]]}, "Romans 12:4–5": {"c": "12", "items": [["4", "For as we have many members in one body, and all members have not the same office:"], ["5", "So we, being many, are one body in Christ, and every one members one of another."]]}, "Romans 13:1–7": {"c": "13", "items": [["1", "Let every soul be subject unto the higher powers. For there is no power but of God: the powers that be are ordained of God."], ["2", "Whosoever therefore resisteth the power, resisteth the ordinance of God: and they that resist shall receive to themselves damnation."], ["3", "For rulers are not a terror to good works, but to the evil. Wilt thou then not be afraid of the power? do that which is good, and thou shalt have praise of the same:"], ["4", "For he is the minister of God to thee for good. But if thou do that which is evil, be afraid; for he beareth not the sword in vain: for he is the minister of God, a revenger to execute wrath upon him that doeth evil."], ["5", "Wherefore ye must needs be subject, not only for wrath, but also for conscience sake."], ["6", "For for this cause pay ye tribute also: for they are God’s ministers, attending continually upon this very thing."], ["7", "Render therefore to all their dues: tribute to whom tribute is due; custom to whom custom; fear to whom fear; honour to whom honour."]]}, "Romans 13:3–4": {"c": "13", "items": [["3", "For rulers are not a terror to good works, but to the evil. Wilt thou then not be afraid of the power? do that which is good, and thou shalt have praise of the same:"], ["4", "For he is the minister of God to thee for good. But if thou do that which is evil, be afraid; for he beareth not the sword in vain: for he is the minister of God, a revenger to execute wrath upon him that doeth evil."]]}, "Romans 13:8": {"c": "13", "items": [["8", "Owe no man any thing, but to love one another: for he that loveth another hath fulfilled the law."]]}, "Romans 14:1,4": {"c": "14", "items": [["1", "Him that is weak in the faith receive ye, but not to doubtful disputations."], ["4", "Who art thou that judgest another man’s servant? to his own master he standeth or falleth. Yea, he shall be holden up: for God is able to make him stand."]]}, "Romans 14:10–12": {"c": "14", "items": [["10", "But why dost thou judge thy brother? or why dost thou set at nought thy brother? for we shall all stand before the judgment seat of Christ."], ["11", "For it is written, As I live, saith the Lord, every knee shall bow to me, and every tongue shall confess to God."], ["12", "So then every one of us shall give account of himself to God."]]}, "Romans 14:1–4": {"c": "14", "items": [["1", "Him that is weak in the faith receive ye, but not to doubtful disputations."], ["2", "For one believeth that he may eat all things: another, who is weak, eateth herbs."], ["3", "Let not him that eateth despise him that eateth not; and let not him which eateth not judge him that eateth: for God hath received him."], ["4", "Who art thou that judgest another man’s servant? to his own master he standeth or falleth. Yea, he shall be holden up: for God is able to make him stand."]]}, "Romans 14:4": {"c": "14", "items": [["4", "Who art thou that judgest another man’s servant? to his own master he standeth or falleth. Yea, he shall be holden up: for God is able to make him stand."]]}, "Romans 14:4–5": {"c": "14", "items": [["4", "Who art thou that judgest another man’s servant? to his own master he standeth or falleth. Yea, he shall be holden up: for God is able to make him stand."], ["5", "One man esteemeth one day above another: another esteemeth every day alike. Let every man be fully persuaded in his own mind."]]}, "Romans 14:5–6": {"c": "14", "items": [["5", "One man esteemeth one day above another: another esteemeth every day alike. Let every man be fully persuaded in his own mind."], ["6", "He that regardeth the day, regardeth it unto the Lord; and he that regardeth not the day, to the Lord he doth not regard it. He that eateth, eateth to the Lord, for he giveth God thanks; and he that eateth not, to the Lord he eateth not, and giveth God thanks."]]}, "Romans 15:1–2": {"c": "15", "items": [["1", "We then that are strong ought to bear the infirmities of the weak, and not to please ourselves."], ["2", "Let every one of us please his neighbour for
