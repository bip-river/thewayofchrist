name: Deploy static site to GitHub Pages

on:
  # Publish on every push to the default branch
  push:
    branches: [main]
  # Allow publishing manually from the Actions tab
  workflow_dispatch:

# Grant the token the permissions required to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; don't cancel an in-progress run,
# so an already-running publish finishes before the next one starts.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        # enablement: true switches the Pages build source to "GitHub Actions"
        # and enables Pages if it is not already configured that way.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The site is a single static index.html at the repository root
          # (.nojekyll disables Jekyll processing), so publish the whole root.
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
